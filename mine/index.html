<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6EFE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的礦山">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<title>我的礦山</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6EFE3;--card:#FFFCF6;--ink:#3A2E24;--sub:#8C7B6B;--line:#EADFCC;
  --gold:#C9A24A;--gold2:#E7C46A;--rust:#B97455;
  --up:#C0564B;--down:#5E8C78;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif}
.num{font-family:"Outfit","Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 8px) 16px calc(var(--safe-b) + 110px)}

/* ---------- hero ---------- */
.hero{position:relative;text-align:center;padding-top:4px}
.mine{position:relative;width:210px;height:150px;margin:0 auto;cursor:pointer}
.cart-roll{position:absolute;inset:0;animation:roll 5.5s ease-in-out infinite;transform-origin:50% 90%}
.cart-bob{position:absolute;inset:0;animation:bob .55s ease-in-out infinite alternate}
.cart-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(120,80,30,.18))}
.cart-shine{position:absolute;inset:0;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,240,.85) 48%,transparent 60%);background-size:260% 100%;animation:shine 3.2s ease-in-out infinite;mix-blend-mode:screen}
.shadow{position:absolute;left:22%;right:22%;bottom:2px;height:12px;border-radius:50%;background:radial-gradient(rgba(110,75,35,.25),transparent 70%);animation:shadow 5.5s ease-in-out infinite}
@keyframes roll{0%,100%{transform:translateX(-10px) rotate(-2deg)}50%{transform:translateX(10px) rotate(2deg)}}
@keyframes shadow{0%,100%{transform:translateX(-10px)}50%{transform:translateX(10px)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
@keyframes shine{0%{background-position:130% 0}55%,100%{background-position:-30% 0}}
.spark{position:absolute;width:18px;height:18px;color:var(--gold2);animation:twinkle 2.4s ease-in-out infinite;pointer-events:none}
.spark svg{width:100%;height:100%;display:block}
@keyframes twinkle{0%,100%{transform:scale(.3) rotate(0);opacity:0}45%{transform:scale(1) rotate(25deg);opacity:1}70%{transform:scale(.8) rotate(40deg);opacity:.8}}
.nug{position:absolute;width:11px;height:9px;border-radius:3px 4px 3px 5px;background:linear-gradient(135deg,#FFE58A,#E0A92A 60%,#B9801B);box-shadow:0 0 6px rgba(255,210,90,.7);pointer-events:none;left:50%;top:38%}
.title{font-weight:900;font-size:26px;letter-spacing:.12em;margin:4px 0 0;display:flex;align-items:center;justify-content:center;gap:8px}
.title small{font-size:12px;letter-spacing:0;font-weight:500;color:var(--sub);background:#EFE4CF;border-radius:20px;padding:2px 8px}
.total-label{margin-top:14px;font-size:13px;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:6px}
.eye{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.total{font-size:40px;font-weight:800;letter-spacing:-.5px;line-height:1.1;margin-top:2px}
.subrow{display:flex;justify-content:center;gap:14px;margin-top:6px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.subrow b{color:var(--ink);font-weight:600}
.up{color:var(--up)!important}.down{color:var(--down)!important}

/* ---------- status ---------- */
.status{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 6px}
.chip{font-size:12px;padding:4px 10px;border-radius:20px;background:#EFE6D6;color:var(--sub);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:#B8AA97}
.chip.open .dot{background:#D2913B;box-shadow:0 0 0 3px rgba(210,145,59,.22);animation:pulse 1.6s infinite}
.chip.open{color:var(--ink);background:#F3E2BE}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(210,145,59,0)}}
.updated{font-size:11px;color:var(--sub);text-align:center;display:flex;justify-content:center;align-items:center;gap:6px}
.refresh{padding:3px 8px;border-radius:14px;background:#EFE6D6;font-size:11px}
.refresh.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- allocation ---------- */
.alloc{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:16px 0 8px;background:var(--line)}
.alloc i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub);margin-bottom:6px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:1px}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:22px;margin-top:14px;box-shadow:0 1px 0 var(--line),0 6px 18px -12px rgba(90,60,20,.25);overflow:hidden}
.cat-head{display:flex;align-items:center;padding:16px 18px;gap:12px;width:100%;text-align:left}
.cat-bar{width:6px;align-self:stretch;border-radius:4px;background:var(--c)}
.cat-name{font-weight:700;font-size:17px}
.cat-sub{font-size:12px;color:var(--sub);margin-top:2px}
.cat-val{margin-left:auto;text-align:right;font-size:20px;font-weight:700}
.chev{transition:transform .2s;color:var(--sub);flex:none}
.card.closed .chev{transform:rotate(-90deg)}
.card.closed .cat-body{display:none}
.grp{border-top:1px solid var(--line)}
.grp-head{display:flex;align-items:center;gap:8px;padding:10px 18px 6px;font-size:13px;color:var(--sub);cursor:pointer;user-select:none}
.grp-head .gchev{transition:transform .2s;color:var(--sub);flex:none}
.grp.gclosed .gchev{transform:rotate(-90deg)}
.grp.gclosed .item,.grp.gclosed .add-row{display:none}
.grp.gclosed .grp-head{padding-bottom:10px}
.grp-head b{color:var(--ink);font-size:14px}
.grp-head .gv{margin-left:auto;font-weight:600;color:var(--ink)}
.mini{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#F2EADB;color:var(--sub);flex:none}
.tag{font-size:10px;padding:1px 6px;border-radius:8px;background:#EDE3F0;background:#EEE5D8;color:var(--sub)}
.item{display:flex;align-items:center;gap:12px;padding:11px 18px;width:100%;text-align:left;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.item.lifted{position:relative;z-index:30;background:var(--card);border-radius:16px;box-shadow:0 14px 30px -8px rgba(90,60,20,.35);transform-origin:center;transition:box-shadow .15s,scale .15s;scale:1.03}
body.dragging{overflow:hidden;touch-action:none}
body.dragging .item:not(.lifted){transition:transform .15s}
.item:active{background:#FBF5EA}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--c);flex:none;font-family:Outfit,sans-serif}
.it-main{min-width:0;flex:1}
.it-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.it-meta{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-right{text-align:right;flex:none}
.it-val{font-weight:600;font-size:16px}
.it-chg{font-size:11.5px;margin-top:2px;color:var(--sub)}
.dca-pill{font-size:10px;color:#9A6A1E;background:#F6E4BD;border-radius:8px;padding:1px 6px;flex:none}
.add-row{display:flex;gap:8px;padding:8px 18px 14px}
.ghost{font-size:13px;color:var(--sub);padding:7px 12px;border-radius:12px;background:#F4ECDD}

/* schedule */
.sched{padding:6px 18px 14px}
.sched-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.sched-row:last-child{border-bottom:0}
.sdate{width:54px;text-align:center;flex:none}
.sdate b{display:block;font-size:18px;font-family:Outfit}
.sdate span{font-size:11px;color:var(--sub)}
.empty{font-size:13px;color:var(--sub);padding:4px 0 6px;line-height:1.6}

/* fab */
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(var(--safe-b) + 22px);width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#E7C46A,#C9A24A);box-shadow:0 10px 22px -8px rgba(160,110,20,.6);display:grid;place-items:center;color:#3A2E24;z-index:5}
.dock{position:fixed;left:max(18px,calc(50% - 262px));bottom:calc(var(--safe-b) + 26px);display:flex;gap:4px;background:rgba(255,252,246,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:26px;padding:6px;box-shadow:0 8px 20px -10px rgba(90,60,20,.35);z-index:5}
.dock button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}

/* sheet */
.mask{position:fixed;inset:0;background:rgba(40,28,15,.35);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:21;padding:0 18px calc(var(--safe-b) + 24px)}
.sheet.on{transform:none}
.sheet-top{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;padding:14px 0 10px;z-index:2}
.sheet-top h3{margin:0;font-size:17px;flex:1;text-align:center}
.grab{width:40px;height:5px;border-radius:3px;background:#DCCFB9;margin:8px auto 0}
.fld{background:var(--card);border-radius:16px;padding:2px 14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{font-size:14px;flex:none;width:86px;color:var(--sub)}
.row input[type=text],.row input[type=number],.row input[type=date],.row select,.row textarea{flex:1;min-width:0;border:0;background:transparent;font-size:16px;text-align:right;padding:10px 0;outline:none}
.row textarea{text-align:left;resize:vertical;min-height:44px}
.row select{appearance:none;-webkit-appearance:none;text-align-last:right}
.seg{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0}
.seg button{padding:6px 11px;border-radius:12px;background:#F1E8D8;font-size:13px}
.seg button.on{background:var(--ink);color:#fff}
.sw{position:relative;width:48px;height:28px;flex:none;margin-left:auto}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:20px;background:#DCCFB9;transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--gold)}
.sw input:checked+span::after{transform:translateX(20px)}
.sec-t{font-size:13px;color:var(--sub);margin:16px 4px 6px;display:flex;align-items:center;gap:6px}
.btn{display:block;width:100%;padding:14px;border-radius:16px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;margin-top:8px}
.btn.gold{background:linear-gradient(145deg,#E7C46A,#C9A24A);color:var(--ink)}
.btn.light{background:#EFE6D6;color:var(--ink);font-weight:500}
.btn.danger{background:#F3E1DC;color:#A2493C;font-weight:500}
.hint{font-size:12px;color:var(--sub);line-height:1.6;margin:4px 4px 10px}
.log{font-size:13px;display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.log:last-child{border-bottom:0}
.log .ld{font-family:Outfit;width:78px;color:var(--sub);flex:none}
.log .lt{flex:1;min-width:0}
.log input{width:84px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;text-align:right;background:#fff;font-size:13px}
.srch{display:flex;gap:8px;padding:8px 0}
.srch button{padding:6px 12px;border-radius:10px;background:#EFE6D6;font-size:13px;flex:none}
.results button{display:block;width:100%;text-align:left;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px}
.results b{font-family:Outfit}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translate(-50%,-20px);opacity:0;visibility:hidden;pointer-events:none;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:40;transition:.3s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
.viewseg{display:flex;background:#EDE3D2;border-radius:14px;padding:3px;margin:14px 0 2px}
.viewseg button{flex:1;padding:8px;border-radius:11px;font-size:14px;color:var(--sub)}
.viewseg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(90,60,20,.12)}
.sec-h{display:flex;align-items:center;gap:8px;padding:12px 18px 2px;font-size:12.5px;color:var(--sub);letter-spacing:.05em}
.sec-h b{font-weight:600;color:var(--ink);font-size:13px}
.sec-h span{margin-left:auto;font-family:Outfit;font-weight:600;color:var(--ink)}
.btag{font-size:10.5px;padding:1px 6px;border-radius:8px;background:#F1E6CF;color:#8A6A2E;flex:none}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 10px}
.picker button{background:var(--card);border-radius:16px;padding:16px 12px;text-align:left;font-size:15px;font-weight:600;box-shadow:0 1px 0 var(--line)}
.picker button small{display:block;font-weight:400;font-size:12px;color:var(--sub);margin-top:3px}
.mv{display:flex;flex-direction:column;gap:4px;flex:none;margin-left:4px}
.mv button{width:34px;height:26px;border-radius:9px;background:#EFE4CF;display:grid;place-items:center;color:var(--ink)}
.mv button:disabled{opacity:.25}
.sortbar{position:sticky;top:calc(var(--safe-t) + 6px);z-index:6;display:none;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:16px;padding:10px 14px;margin-top:12px;font-size:14px}
.sortbar button{margin-left:auto;background:var(--gold2);color:var(--ink);border-radius:10px;padding:6px 14px;font-weight:700}
body.sorting .sortbar{display:flex}
body.sorting .add-row,body.sorting .grp-head .mini{display:none}
body.sorting .dock button.sortb{background:var(--gold2)}
.hidden-amt .amt{filter:blur(7px);user-select:none}
.pop{animation:pop .5s}
@keyframes pop{30%{transform:scale(1.06)}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="hero">
    <div class="mine" id="mine" title="點我更新行情">
      <div class="shadow"></div>
      <div class="cart-roll"><div class="cart-bob">
        <img class="cart-img" id="cartImg" alt="礦車">
        <div class="cart-shine" id="cartShine"></div>
      </div></div>
    </div>
    <h1 class="title">我的礦山 <small id="hello">⛏ 挖礦中</small></h1>
    <div class="total-label">總資產 (TWD)
      <button class="eye" id="eyeBtn" aria-label="隱藏金額"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="total num amt" id="total">—</div>
    <div class="subrow">
      <span>淨資產 <b class="num amt" id="net">—</b></span>
      <span>今日 <b class="num amt" id="today">—</b></span>
    </div>
    <div class="status" id="status"></div>
    <div class="updated"><span id="updated">尚未更新</span>
      <button class="refresh" id="refreshBtn"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" style="vertical-align:-1px"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg> 更新</button>
    </div>
  </div>
  <div class="alloc" id="alloc"></div>
  <div class="legend" id="legend"></div>
  <div class="sortbar">⇅ 排序模式：用箭頭調整順序<button id="sortDone">完成</button></div>
  <div id="cats"></div>
  <div class="card" id="schedCard">
    <div class="cat-head"><div class="cat-bar" style="--c:#D2913B"></div>
      <div><div class="cat-name">⛏ 定期定額排程</div><div class="cat-sub">到期日自動幫你把單位數加上去</div></div></div>
    <div class="sched" id="sched"></div>
  </div>
</div>

<div class="dock">
  <button id="settingsBtn" aria-label="設定"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <button id="sortBtn" class="sortb" aria-label="調整順序"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
  <button id="collapseBtn" aria-label="全部收合"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
</div>
<button class="fab" id="fab" aria-label="新增"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const num = v => { const n = parseFloat(String(v).replace(/,/g,'')); return isFinite(n) ? n : 0; };
const fmt = (n, d=0) => (Math.round(n * 10**d) / 10**d).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtU = n => { if (!n) return '0'; const a = Math.abs(n); const d = a >= 1000 ? 2 : a >= 1 ? 4 : 6; return (+n.toFixed(d)).toLocaleString('en-US', {maximumFractionDigits:d}); };
const fmtP = n => { const a = Math.abs(n); const d = a >= 100 ? 2 : a >= 1 ? 2 : a >= 0.01 ? 4 : 6; return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:d}); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const signCls = n => n > 0.0001 ? 'up' : n < -0.0001 ? 'down' : '';
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '') ;
function tzParts(tz, d = new Date()){
  const p = {}; new Intl.DateTimeFormat('en-US', {timeZone:tz, hour12:false, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', weekday:'short'})
    .formatToParts(d).forEach(x => p[x.type] = x.value);
  const wd = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[p.weekday];
  return {date:`${p.year}-${p.month}-${p.day}`, wd, mins:(+p.hour % 24) * 60 + (+p.minute)};
}
const today = () => tzParts('Asia/Taipei').date;
const ymd = (y,m,d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const dim = (y,m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
function addDays(s, n){ const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
function shiftWeekend(s){ const w = new Date(s + 'T00:00:00Z').getUTCDay(); return w === 6 ? addDays(s,2) : w === 0 ? addDays(s,1) : s; }
const md = s => `${+s.slice(5,7)}/${+s.slice(8,10)}`;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); }

let S;
function load(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { S = JSON.parse(raw); migrate(); return; } } catch(e) {}
  S = seed();
}
function migrate(){
  if (!S.m2 && !S.m3){
    const rich = S.items.filter(i => grp(i.group)?.cat === 'cash' && /richart/i.test(i.name));
    if (rich.length && !S.groups.some(g => g.id === 'g_richart')){
      const at = S.groups.findIndex(g => g.cat === 'cash');
      S.groups.splice(at + 1, 0, {id:'g_richart', cat:'cash', name:'台新 Richart', excluded:false});
      const first = S.items.indexOf(rich[0]);
      S.items = S.items.filter(i => !rich.includes(i));
      rich.forEach(i => { i.group = 'g_richart'; i.name = i.name.replace(/^\s*(台新\s*)?richart\s*[-－–]?\s*/i, '').trim() || i.name; });
      S.items.splice(first, 0, ...rich);
    }
    S.m2 = 1;
  }
  if (!S.m3){
    S.banks = S.banks || [
      {id:'b_ctbc', name:'中國信託'}, {id:'b_sinopac', name:'永豐銀行'}, {id:'b_ubot', name:'聯邦銀行'}, {id:'b_richart', name:'台新銀行'},
      {id:'b_next', name:'將來銀行'}, {id:'b_line', name:'LINE Bank'}];
    // Richart group (from earlier version) → back into the cash list, tagged with the bank
    const rg = S.groups.find(g => g.id === 'g_richart');
    if (rg){ const cashG = S.groups.find(g => g.cat === 'cash' && g.id !== 'g_richart');
      S.items.forEach(i => { if (i.group === 'g_richart'){ i.bank = 'b_richart'; if (cashG) i.group = cashG.id; } });
      if (cashG) S.groups = S.groups.filter(g => g !== rg); }
    for (const i of S.items){
      if (i.bank) continue; const n = i.name, g = grp(i.group);
      if (g?.cat === 'cash'){
        if (/richart|台新/i.test(n)) { i.bank = 'b_richart'; i.name = n.replace(/^\s*(台新\s*)?richart\s*[-－–]?\s*/i, '').trim() || n; }
        else if (/中信|薪資/.test(n)) i.bank = 'b_ctbc'; else if (/永豐/.test(n)) i.bank = 'b_sinopac';
        else if (/聯邦/.test(n)) i.bank = 'b_ubot'; else if (/將來/.test(n)) i.bank = 'b_next'; else if (/line/i.test(n)) i.bank = 'b_line';
      }
    }
    S.m3 = 1;
  }
  if (!S.m4){
    (S.banks || []).forEach(b => { if (b.id === 'b_sinopac') b.name = '永豐銀行'; if (b.id === 'b_richart') b.name = '台新銀行'; });
    S.banks = (S.banks || []).filter(b => b.id !== 'b_binance' && b.id !== 'b_maicoin');
    S.items.forEach(i => { if (i.bank === 'b_binance' || i.bank === 'b_maicoin') i.bank = ''; });
    S.m4 = 1;
  }
  if (!S.m1){ S.items.forEach(i => { if (i.group === 'g_liu' && !i.due && /^11\/30/.test(i.name)) i.due = '2026-11-30'; }); S.m1 = 1; }
}

  if (b.short) return b.short;
  const map = {'中國信託':'中信','國泰世華':'國泰','台北富邦':'富邦','玉山銀行':'玉山','第一銀行':'一銀','華南銀行':'華南','兆豐銀行':'兆豐'};

function valueOf(it){
  if (it.kind === 'cash') return num(it.amount) * fx(it.ccy);
  return num(it.units) * num(it.price) * fx(it.ccy);
}
function dayChg(it){
  if (it.kind === 'cash' || !it.prev || !it.price) return 0;
  return num(it.units) * (num(it.price) - num(it.prev)) * fx(it.ccy);
}
const counted = it => !it.excluded && !(grp(it.group) || {}).excluded;
function totals(){
  const cat = {}; CATS.forEach(c => cat[c.id] = 0);
  let chg = 0;
  for (const it of S.items){ const g = grp(it.group); if (!g) continue; if (counted(it)) { cat[g.cat] += valueOf(it); chg += dayChg(it); } }
  const assets = cat.cash + cat.inv + cat.fixed + cat.recv;
  return {cat, assets, net: assets - cat.debt, chg};
}

function twOpen(){ const t = tzParts('Asia/Taipei'); return t.wd >= 1 && t.wd <= 5 && t.mins >= 540 && t.mins <= 815; }
function usState(){
  const t = tzParts('America/New_York');
  if (t.wd < 1 || t.wd > 5) return 'closed';
  if (t.mins >= 570 && t.mins < 960) return 'open';
  if (t.mins >= 240 && t.mins < 570) return 'pre';
  if (t.mins >= 960 && t.mins < 1200) return 'post';
  return 'closed';
}

/* ================= network ================= */
const routeOK = {};
async function getJSON(url, opts={}){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), opts.timeout || 12000);
  try {
    const r = await fetch(url, {signal:ctl.signal, cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    return JSON.parse(txt);
  } finally { clearTimeout(t); }
}
/* proxied GET: 1) same-origin Netlify proxy (_redirects) 2) public CORS proxies */
async function viaProxy(prefix, path){
  const full = BASES[prefix] + path;
  const tries = [];
  if (location.protocol.startsWith('http') && routeOK[prefix] !== false) tries.push(['self', `/${prefix}${path}`]);
  tries.push(['cp', 'https://corsproxy.io/?url=' + encodeURIComponent(full)]);
  tries.push(['ao', 'https://api.allorigins.win/raw?url=' + encodeURIComponent(full)]);
  let err;
  for (const [k, u] of tries){
    try { const j = await getJSON(u); if (k === 'self') routeOK[prefix] = true; return j; }
    catch(e){ err = e; if (k === 'self') routeOK[prefix] = false; }
  }
  throw err;
}

/* --- Yahoo chart (US / fund / TW fallback / FX) --- */
async function yahooQuote(sym){
  const j = await viaProxy('yf', `/v8/finance/chart/${encodeURIComponent(sym)}?range=1d&interval=1d&includePrePost=false`);
  const m = j?.chart?.result?.[0]?.meta; if (!m || !m.regularMarketPrice) throw new Error('no data ' + sym);
  return {price:m.regularMarketPrice, prev:m.chartPreviousClose ?? m.previousClose ?? m.regularMarketPrice, ccy:m.currency, time:m.regularMarketTime};
}
async function yahooHistClose(sym, date){
  const t0 = Math.floor(new Date(addDays(date,-6) + 'T00:00:00Z') / 1000), t1 = Math.floor(new Date(addDays(date,1) + 'T23:59:59Z') / 1000);
  const j = await viaProxy('yf', `/v8/finance/chart/${encodeURIComponent(sym)}?period1=${t0}&period2=${t1}&interval=1d`);
  const r = j?.chart?.result?.[0]; const ts = r?.timestamp || []; const cl = r?.indicators?.quote?.[0]?.close || [];
  const off = (r?.meta?.gmtoffset || 0);
  let best = null;
  ts.forEach((t, i) => { const d = new Date((t + off) * 1000).toISOString().slice(0,10); if (d <= date && cl[i] != null) best = cl[i]; });
  if (best == null) throw new Error('no hist'); return best;
}

async function fetchTW(list){
  if (!list.length) return 0;
  const codes = [...new Set(list.map(i => i.symbol.trim()).filter(Boolean))];
  const chs = codes.map(c => { const it = list.find(i => i.symbol.trim() === c); return it.market ? [`${it.market}_${c}.tw`] : [`tse_${c}.tw`,`otc_${c}.tw`]; }).flat();
  const got = {};
  try {
    const j = await viaProxy('twse', `/stock/api/getStockInfo.jsp?ex_ch=${encodeURIComponent(chs.join('|'))}&json=1&delay=0&_=${Date.now()}`);
    for (const m of (j.msgArray || [])){
      const first = s => num(String(s || '').split('_')[0]);
      const price = num(m.z) || first(m.b) || first(m.a) || num(m.y) || num(m.o);
      if (price) got[m.c] = {price, prev:num(m.y) || price, market:m.ex};
    }
  } catch(e) { console.warn('mis', e); }
  const missing = codes.filter(c => !got[c]);
  await Promise.all(missing.map(async c => {
    const it = list.find(i => i.symbol.trim() === c);
    const mkts = it.market ? [it.market] : ['tse','otc'];
    for (const mk of mkts){ try { const q = await yahooQuote(c + (mk === 'otc' ? '.TWO' : '.TW')); got[c] = {price:q.price, prev:q.prev, market:mk}; break; } catch(e){} }
  }));
  let n = 0;
  for (const it of list){ const g = got[it.symbol.trim()]; if (g){ it.price = g.price; it.prev = g.prev; it.market = g.market || it.market; it.pts = Date.now(); n++; } }
  return n;
}

async function fetchCrypto(list){
  if (!list.length) return 0;
  const syms = [...new Set(list.map(i => i.symbol.trim().toUpperCase()))];
  const got = {};
  try {
    const pairs = syms.filter(s => s !== 'USDT').map(s => s + 'USDT');
    const j = await getJSON('https://api.binance.com/api/v3/ticker/24hr?symbols=' + encodeURIComponent(JSON.stringify(pairs)));
    j.forEach(x => got[x.symbol.replace(/USDT$/,'')] = {price:num(x.lastPrice), prev:num(x.openPrice)});
  } catch(e) {

    await Promise.all(syms.map(async s => { try { const x = await getJSON(`https://api.binance.com/api/v3/ticker/24hr?symbol=${s}USDT`); got[s] = {price:num(x.lastPrice), prev:num(x.openPrice)}; } catch(_){} }));

const last = {tw:0, us:0, fund:0, crypto:0, fx:0};
let busy = false;
async function refresh(force=false){
  if (busy) return; busy = true; $('#refreshBtn').classList.add('spin');
  const now = Date.now(), tw = twOpen(), us = usState();
  const due = (k, openMs, closedMs, open) => force || !last[k] || now - last[k] > (open ? openMs : closedMs);
  const jobs = [];
  const by = k => S.items.filter(i => i.kind === k && (i.symbol || '').trim());
  const job = (k, fn) => jobs.push(fn().then(n => { if (n) last[k] = Date.now(); return n || 0; }));
  if (due('fx', 5*60e3, 60*60e3, tw || us === 'open')) job('fx', fetchFX);
  if (due('tw', 30e3, 30*60e3, tw)) job('tw', () => fetchTW(by('tw')));
  if (due('us', 60e3, 30*60e3, us !== 'closed')) job('us', () => fetchYahooList(by('us')));
  if (due('crypto', 30e3, 30e3, true)) job('crypto', () => fetchCrypto(by('crypto')));
  if (due('fund', 3*3600e3, 3*3600e3, false)) job('fund', () => fetchYahooList(by('fund')));
  const res = await Promise.allSettled(jobs);
  const got = res.reduce((a, r) => a + (r.status === 'fulfilled' ? r.value : 0), 0);
  if (got) S.lastFetch = Date.now();
  await runDCA();
  save(); render();
  busy = false; $('#refreshBtn').classList.remove('spin');
}

/* ================= DCA engine ================= */
function planDates(p, fromEx, toIn){
  const out = new Set();
  let [y, m] = fromEx.split('-').map(Number); m -= 1; if (m < 1){ m = 12; y--; }
  const [ty, tm] = toIn.split('-').map(Number);
  let guard = 0;
  while ((y < ty || (y === ty && m <= tm)) && guard++ < 400){
    const days = p.freq === 'yearly' ? (m === +p.month ? [+p.day] : []) : (p.days || []);
    for (const dd of days){
      if (!dd) continue;
      let s = ymd(y, m, Math.min(dd, dim(y, m)));
      if (p.skipWeekend !== false) s = shiftWeekend(s);
      if (s > fromEx && s <= toIn) out.add(s);
    }
    m++; if (m > 12){ m = 1; y++; }
  }
  return [...out].sort();
}
async function priceOn(it, date){
  if (date >= today() || it.kind === 'cash') return num(it.price);
  try {
    if (it.kind === 'crypto') return await cryptoHistClose(it.symbol.trim().toUpperCase(), date);
    if (it.kind === 'tw') return await yahooHistClose(twYahooSym(it), date);
    if ((it.kind === 'us' || it.kind === 'fund') && it.symbol) return await yahooHistClose(it.symbol.trim(), date);
  } catch(e){}
  return num(it.price);
}
let dcaBusy = false;
async function runDCA(){
  if (dcaBusy) return; dcaBusy = true;
  const t = today(); const done = [];
  try {
    for (const it of S.items){
      const p = it.dca; if (!p || !p.on) continue;
      const dates = planDates(p, p.last || addDays(t, -1), t).slice(0, 36);
      for (const d of dates){
        if (p.maxTimes && (p.done || 0) >= p.maxTimes){ p.on = false; break; }
        const res = await execDCA(it, d);
        if (!res) break;
        if (p.maxTimes){ p.done = (p.done || 0) + 1; if (it.ins) it.ins.paid = p.done; }
        done.push(`${it.name} ${md(d)}`);
      }
    }
  } finally { dcaBusy = false; }
  if (done.length){ save(); toast(`⛏ 自動入帳 ${done.length} 筆：${done.slice(0,3).join('、')}${done.length > 3 ? '…' : ''}`); burst(10); }
}
async function execDCA(it, d){
  const p = it.dca;
  const gross = num(p.amount), fee = num(p.fee);
  if (gross <= 0) return false;
  const rec = {id:uid(), date:d, amount:gross, fee, ccy:p.ccy || 'TWD', auto:true};
  const netInItem = (gross - fee) * fx(rec.ccy) / fx(it.ccy);
  let spentInRec = gross;
  if (it.kind === 'cash'){
    it.amount = num(it.amount) + netInItem; rec.added = netInItem;
  } else {
    const price = await priceOn(it, d);
    if (!price || price <= 0) return false;      // wait until a price is available
    let units = netInItem / price;
    if (it.kind === 'tw'){ units = Math.floor(units); spentInRec = units * price * fx(it.ccy) / fx(rec.ccy) + fee; }
    else units = +units.toFixed(6);
    it.units = +(num(it.units) + units).toFixed(6);
    rec.units = units; rec.price = price;
  }
  rec.spent = spentInRec;
  if (p.from){
    const acc = itm(p.from);
    if (acc && acc.kind === 'cash'){ const deduct = spentInRec * fx(rec.ccy) / fx(acc.ccy); acc.amount = +(num(acc.amount) - deduct).toFixed(2); rec.deducted = deduct; rec.fromName = acc.name; }
  }
  (it.log = it.log || []).unshift(rec);
  p.last = d;
  return true;
}
function undoRec(it, recId){
  const i = (it.log || []).findIndex(r => r.id === recId); if (i < 0) return;
  const r = it.log[i];
  if (it.kind === 'cash') it.amount = num(it.amount) - num(r.added);
  else it.units = +(num(it.units) - num(r.units)).toFixed(6);
  if (r.deducted && it.dca?.from){ const acc = itm(it.dca.from); if (acc) acc.amount = +(num(acc.amount) + r.deducted).toFixed(2); }
  it.log.splice(i, 1);
  if (it.dca?.maxTimes){ it.dca.done = Math.max(0, (it.dca.done || 0) - 1); it.dca.on = true; if (it.ins) it.ins.paid = it.dca.done; }
}
function upcoming(days=45){
  const t = today(), end = addDays(t, days), out = [];
  for (const it of S.items){
    const p = it.dca; if (!p || !p.on) continue;
    const left = p.maxTimes ? Math.max(0, p.maxTimes - (p.done || 0)) : 99;
    planDates(p, p.last || addDays(t, -1), end).slice(0, left).forEach(d => out.push({d, it}));
  }
  return out.sort((a, b) => a.d.localeCompare(b.d));
}

/* ================= ordering ================= */
let sorting = false;
const UP = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 15l6-6 6 6"/></svg>';
const DN = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>';
function moveIn(arr, obj, dir, same){
  const peers = arr.filter(same); const k = peers.indexOf(obj); const other = peers[k + dir]; if (!other) return;
  const a = arr.indexOf(obj), b = arr.indexOf(other); arr[a] = other; arr[b] = obj;
}
const mvBtns = (type, id, first, lastOne) => `<span class="mv"><button data-mv="${type}:${id}:-1" ${first ? 'disabled' : ''} aria-label="上移">${UP}</button><button data-mv="${type}:${id}:1" ${lastOne ? 'disabled' : ''} aria-label="下移">${DN}</button></span>`;

function itemRow(it, color, arrows='', showBank=true){
  const v = valueOf(it), ch = dayChg(it);
  const pct = it.prev && it.kind !== 'cash' ? (it.price / it.prev - 1) * 100 : null;
  const b = it.bank ? bank(it.bank) : null;
  return `<${sorting ? 'div' : 'button'} class="item" ${sorting ? '' : `data-item="${it.id}"`}>
    <span class="badge" style="--c:${color}">${b && it.kind === 'cash' ? esc(bankShort(b)) : badgeText(it)}</span>
    <span class="it-main"><span class="it-name">${esc(it.name)}${it.dca?.on ? `<span class="dca-pill">${it.ins ? '自動記' : '定額'}</span>` : ''}${it.excluded ? '<span class="tag">不統計</span>' : ''}</span>
    <span class="it-meta num">${itemMeta(it)}</span></span>
    <span class="it-right"><div class="it-val num">${money(v)}</div>
    ${pct !== null && Math.abs(pct) > 0.0001 ? `<div class="it-chg num ${signCls(ch)}"><span class="amt">${sgn(ch)}${fmt(Math.abs(ch))}</span> (${pct > 0 ? '+' : ''}${pct.toFixed(2)}%)</div>` : ''}</span>
    ${arrows}
  </${sorting ? 'div' : 'button'}>`;
}
const SECS = [
  ['twd','台幣存款', it => it.kind === 'cash' && grp(it.group)?.cat === 'cash' && it.ccy === 'TWD'],
  ['fx','外幣存款', it => it.kind === 'cash' && grp(it.group)?.cat === 'cash' && it.ccy !== 'TWD'],
  ['fund','基金', it => it.kind === 'fund'],
  ['us','美股／ETF', it => it.kind === 'us'],
  ['tw','台股', it => it.kind === 'tw'],
  ['crypto','加密貨幣', it => it.kind === 'crypto'],
  ['other','其他', it => true],
];
const catColor = it => (CATS.find(c => c.id === grp(it.group)?.cat) || CATS[0]).color;
function renderBanks(){
  const list = [...(S.banks || []), {id:'', name:'未指定銀行'}];
  return list.map(b => {
    const its = S.items.filter(i => b.id ? i.bank === b.id : (!i.bank && ['cash','inv'].includes(grp(i.group)?.cat)));
    if (!b.id && !its.length) return '';
    const tot = its.filter(counted).reduce((a, i) => a + valueOf(i) * (grp(i.group)?.cat === 'debt' ? -1 : 1), 0);
    const used = new Set();
    const secs = SECS.map(([k, label, fn]) => {
      const rows = its.filter(i => !used.has(i) && fn(i)); rows.forEach(i => used.add(i));
      if (!rows.length) return '';
      const st = rows.filter(counted).reduce((a, i) => a + valueOf(i), 0);
      return `<div class="sec-h"><b>${label}</b>${rows.length} 筆<span class="amt">${fmt(st)}</span></div>` + rows.map(i => itemRow(i, catColor(i), '', false)).join('');
    }).join('');
    const key = b.id || '_none';
    const kinds = [...new Set(its.map(i => SECS.find(([, , fn]) => fn(i))[1]))].join('、');
    return `<div class="card ${(S.bclosed || {})[key] ? 'closed' : ''}">

        <span style="min-width:0"><div class="cat-name">${esc(b.name)}</div><div class="cat-sub">${its.length ? esc(kinds) : '還沒有資產'}</div></span>

}
function bankSecs(its){
  const used = new Set();
  return SECS.map(([k, label, fn]) => {
    const rows = its.filter(i => !used.has(i) && fn(i)); rows.forEach(i => used.add(i));
    if (!rows.length) return null;
    return {label, rows, sum: rows.filter(counted).reduce((a, i) => a + valueOf(i), 0)};
  }).filter(Boolean);
}
function bankRow(b, its, color){
  const sum = its.filter(counted).reduce((a, i) => a + valueOf(i), 0);
  const kinds = bankSecs(its).map(x => x.label.replace('存款', '')).join('、');
  const extra = S.items.filter(i => i.bank === b.id && !its.includes(i)).length;
  return `<button class="item" data-bankopen="${b.id}">
    <span class="badge" style="--c:${color}">${esc(bankShort(b))}</span>
    <span class="it-main"><span class="it-name">${esc(b.name)}<span class="tag">${its.length} 個帳戶</span></span>
    <span class="it-meta">${esc(kinds)}${extra ? `・另有 ${extra} 筆投資` : ''}</span></span>
    <span class="it-right"><div class="it-val num">${money(sum)}</div></span>
  </button>`;
}

function groupFor(type){
  const first = cat => S.groups.find(g => g.cat === cat)?.id;

  return {twd:first('cash'), fx:first('cash'), fund:by('g_fund'), us:by('g_us'), tw:by('g_tw'), crypto:by('g_bn')}[type] || first(type === 'twd' || type === 'fx' ? 'cash' : 'inv');

const money = n => `<span class="amt">${fmt(n)}</span>`;
function badgeText(it){
  if (it.kind === 'tw' || it.kind === 'us' || it.kind === 'crypto') return esc((it.symbol || '').replace('-', '').slice(0, 5)) || '·';
  if (it.kind === 'fund') return '基';
  return {cash:'$'}[it.kind] || '·';
}
function dueInfo(it){
  if (!it.due) return null;
  const d = Math.round((Date.parse(it.due) - Date.parse(today())) / 864e5);
  const txt = d > 0 ? `還有 ${d} 天` : d === 0 ? '今天到期' : `已逾期 ${-d} 天`;
  return {d, html:`<span style="color:${d < 0 ? 'var(--up)' : d <= 7 ? '#B7791F' : 'var(--sub)'};font-weight:${d <= 7 ? 600 : 400}">應收 ${md(it.due)}・${txt}</span>`};
}
function itemMeta(it){
  const di = dueInfo(it);
  if (di && grp(it.group)?.cat === 'recv') return di.html + (it.note ? ` · ${esc(it.note)}` : '');
  if (it.ins && isIns(it)){
    const I = it.ins, n = nextPay(it);
    const done = num(I.years) && num(I.paid) >= num(I.years);
    return `年繳 ${I.ccy} ${fmt(num(I.premium))}・${num(I.years) ? `第 ${num(I.paid)}/${num(I.years)} 年` : ''}${done ? '・已繳費期滿' : n ? `・下次 ${md(n)}` : ''}`;
  }
  if (it.kind === 'cash') return it.ccy !== 'TWD' ? `${it.ccy} ${fmt(num(it.amount), 2)} · r${fmtP(fx(it.ccy))}` : esc(it.note || '');
  const cur = it.ccy === 'TWD' ? '$' : it.ccy + ' ';
  return `持有 ${fmtU(num(it.units))} · ${cur}${fmtP(num(it.price))}${it.symbol ? '' : ' · 手動價格'}`;
}

}

$('#mask').onclick = closeSheet;
const topBar = (title, right='') => `<div class="sheet-top"><button class="mini" data-close aria-label="關閉"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M15 18l-6-6 6-6"/></svg></button><h3>${title}</h3>${right || '<span style="width:26px"></span>'}</div>`;
const sw = (id, on) => `<label class="sw"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}><span></span></label>`;
const ccySel = (id, v) => `<select id="${id}">${CCYS.map(c => `<option ${c === v ? 'selected' : ''}>${c}</option>`).join('')}</select>`;

function editItem(id, newGroup, preset){
  const isNew = !id;
  const g0 = newGroup ? grp(newGroup) : null;
  const guessKind = g0 ? ({g_tw:'tw', g_us:'us', g_fund:'fund', g_bn:'crypto', g_mc:'crypto'}[g0.id] || (g0.cat === 'inv' ? 'us' : 'cash')) : 'cash';
  const it = isNew ? {id:uid(), group:newGroup, kind:guessKind, name:'', symbol:'', units:0, price:0, amount:0, bank:'', ccy:guessKind === 'us' || guessKind === 'crypto' ? 'USD' : 'TWD', ...(preset || {})} : JSON.parse(JSON.stringify(itm(id)));
  const p = it.dca || {on:false, amount:0, ccy:'TWD', freq:'monthly', days:[], month:1, day:1, fee:0, from:'', skipWeekend:true};
  const cashAccs = S.items.filter(i => i.kind === 'cash' && grp(i.group)?.cat === 'cash');
  let kind = it.kind;

  const draw = () => {
    const priced = kind !== 'cash';
    const symLabel = {tw:'股票代號', us:'美股代號', fund:'Yahoo 代號', crypto:'幣種代號'}[kind] || '';
    const symPh = {tw:'例：2330、00919', us:'例：SPY、NVDA', fund:'可按搜尋找代號', crypto:'例：BTC、ETH'}[kind] || '';
    const nextDates = p.on ? planDates(p, p.last || addDays(today(), -1), addDays(today(), 400)).slice(0, 3).map(md).join('、') : '';
    openSheet(`${topBar(isNew ? '新增' : '編輯', '')}
      <div class="fld">
        <div class="row"><label>名稱</label><input type="text" id="f_name" value="${esc(it.name)}" placeholder="例：台新 Richart"></div>
        <div class="row"><label>群組</label><select id="f_group">${CATS.map(c => `<optgroup label="${c.name}">${S.groups.filter(g => g.cat === c.id).map(g => `<option value="${g.id}" ${g.id === it.group ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</optgroup>`).join('')}</select></div>
        <div class="row"><label>銀行／機構</label><select id="f_bank"><option value="">未指定</option>${(S.banks || []).map(b => `<option value="${b.id}" ${b.id === it.bank ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}<option value="__new">＋ 新增銀行…</option></select></div>
        <div class="row" id="f_nb_row" style="display:none"><label>新銀行名稱</label><input type="text" id="f_nb" placeholder="例：國泰世華"></div>
        <div class="seg" id="f_kind">${Object.entries(KINDS).map(([k, l]) => `<button data-k="${k}" class="${k === kind ? 'on' : ''}">${l}</button>`).join('')}</div>
      </div>
      ${priced ? `
      <div class="fld">
        <div class="row"><label>${symLabel}</label><input type="text" id="f_sym" value="${esc(it.symbol || '')}" placeholder="${symPh}" autocapitalize="characters"></div>
        ${kind === 'us' || kind === 'fund' ? `<div class="srch"><input type="text" id="f_q" placeholder="${kind === 'fund' ? '輸入英文基金名，如 Allianz Income Growth' : '輸入公司名搜尋'}" style="flex:1;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff;min-width:0"><button id="f_search">搜尋</button></div><div class="results" id="f_res"></div>` : ''}
        <div class="row"><label>持有數量</label><input type="number" inputmode="decimal" id="f_units" value="${num(it.units)}"></div>
        <div class="row"><label>目前價格</label><input type="number" inputmode="decimal" id="f_price" value="${num(it.price)}"></div>
        <div class="row"><label>計價幣別</label>${ccySel('f_ccy', it.ccy)}</div>
      </div>
      <div class="hint">${kind === 'fund' ? '基金淨值每天更新一次。填了 Yahoo 代號就會自動抓；沒填就用你手動輸入的淨值。' : kind === 'tw' ? '上市、上櫃都可以，自動判斷。開盤時間每 30 秒更新。' : kind === 'crypto' ? '幣安即時報價，24 小時更新。' : '美股開盤時間每分鐘更新，休市時顯示最後收盤價。'}</div>
      ` : `
      <div class="fld">
        <div class="row"><label>${isIns(it) ? '保單價值' : '金額'}</label><input type="number" inputmode="decimal" id="f_amount" value="${num(it.amount)}"></div>
        <div class="row"><label>幣別</label>${ccySel('f_ccy', it.ccy)}</div>
      </div>`}
      <div class="fld">
        <div class="row" id="f_due_row" style="${grp(it.group)?.cat === 'recv' ? '' : 'display:none'}"><label>應收日期</label><input type="date" id="f_due" value="${esc(it.due || '')}"></div>
        <div class="row"><label>不計入統計</label>${sw('f_ex', it.excluded)}</div>
        <div class="row"><label>備註</label><textarea id="f_note" rows="1">${esc(it.note || '')}</textarea></div>
      </div>

      ${isIns(it) ? (() => { const I = it.ins || {years:'', paid:0, premium:'', ccy:it.ccy || 'TWD', month:'', day:'', from:'', auto:true}; const n = nextPay(it); return `
      <div class="sec-t">☂️ 保單繳費</div>
      <div class="fld">
        <div class="row"><label>繳費年期</label><input type="number" inputmode="numeric" id="i_years" value="${esc(I.years)}" placeholder="例：6"><span style="color:var(--sub)">年</span></div>
        <div class="row"><label>已經繳了</label><input type="number" inputmode="numeric" id="i_paid" value="${num(I.paid)}" placeholder="0"><span style="color:var(--sub)">年</span></div>
        <div class="row"><label>年繳保費</label><input type="number" inputmode="decimal" id="i_prem" value="${esc(I.premium)}" placeholder="例：2500"></div>
        <div class="row"><label>保費幣別</label><div class="seg" id="i_ccy" style="padding:6px 0;margin-left:auto">${['TWD','USD'].map(c => `<button data-c="${c}" class="${(I.ccy || 'TWD') === c ? 'on' : ''}">${c === 'TWD' ? '台幣' : '美金'}</button>`).join('')}</div></div>
        <div class="row"><label>每年扣款</label><input type="number" inputmode="numeric" id="i_month" value="${esc(I.month)}" placeholder="月" style="max-width:56px"> 月 <input type="number" inputmode="numeric" id="i_day" value="${esc(I.day)}" placeholder="日" style="max-width:56px"> 日</div>
        <div class="row"><label>扣款帳戶</label><select id="i_from"><option value="">不扣款</option>${cashAccs.map(a => `<option value="${a.id}" ${a.id === I.from ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div>
        <div class="row"><label>自動記</label><span style="flex:1"></span>${sw('i_auto', I.auto !== false)}</div>
      </div>
      <div class="hint">${n ? `下次扣款：${n.replace(/-/g, '/')}・` : ''}每年到了扣款日，打開 App 會自動把年繳保費加進上面的金額、已繳年數 +1；有選扣款帳戶會同時扣掉那個帳戶的錢。繳滿年期就自動停止。</div>`; })() : `
      <div class="sec-t">⛏ 定期定額／自動記</div>
      <div class="fld">
        <div class="row"><label>啟用</label>${sw('d_on', p.on)}</div>
        <div id="d_box" style="${p.on ? '' : 'display:none'}">
          <div class="row"><label>每次金額</label><input type="number" inputmode="decimal" id="d_amt" value="${num(p.amount) || ''}" placeholder="例：3000"></div>
          <div class="row"><label>金額幣別</label>${ccySel('d_ccy', p.ccy || 'TWD')}</div>
          <div class="seg" id="d_freq"><button data-f="monthly" class="${p.freq !== 'yearly' ? 'on' : ''}">每月</button><button data-f="yearly" class="${p.freq === 'yearly' ? 'on' : ''}">每年</button></div>
          <div class="row" id="d_days_row" style="${p.freq === 'yearly' ? 'display:none' : ''}"><label>扣款日</label><input type="text" id="d_days" value="${(p.days || []).join(', ')}" placeholder="例：6, 16, 26"></div>
          <div class="row" id="d_year_row" style="${p.freq === 'yearly' ? '' : 'display:none'}"><label>每年</label><input type="number" id="d_month" value="${p.month || 1}" style="max-width:60px"> 月 <input type="number" id="d_day" value="${p.day || 1}" style="max-width:60px"> 日</div>
          <div class="row"><label>手續費</label><input type="number" inputmode="decimal" id="d_fee" value="${num(p.fee) || ''}" placeholder="0"></div>
          <div class="row"><label>扣款帳戶</label><select id="d_from"><option value="">不扣款</option>${cashAccs.map(a => `<option value="${a.id}" ${a.id === p.from ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div>
          <div class="row"><label>遇假日</label><span style="flex:1;text-align:right;font-size:14px;color:var(--sub)">順延到週一</span>${sw('d_wk', p.skipWeekend !== false)}</div>
          <div class="row"><label>開始日</label><input type="date" id="d_start" value="${p.last ? addDays(p.last, 1) : today()}"></div>
          ${nextDates ? `<div class="hint" style="margin:8px 0">接下來：${nextDates}</div>` : ''}
        </div>
      </div>
      <div class="hint">到了扣款日，打開 App 就會自動：${priced ? '用當天價格換算單位數加進持有' : '把金額加進去（例如保費、存款）'}${priced ? '，有選扣款帳戶就同時扣掉現金' : ''}。錯過的日期也會補記，單位數可以在下面紀錄裡改成對帳單的實際數字。</div>`}

      ${(it.log || []).length ? `<div class="sec-t">入帳紀錄</div><div class="fld">${it.log.slice(0, 40).map(r => `
        <div class="log"><span class="ld">${r.date.slice(2).replace(/-/g, '/')}</span>
        <span class="lt">${r.ccy} ${fmt(r.amount)}${r.price ? ` @${fmtP(r.price)}` : ''}${r.fromName ? `<br><span style="color:var(--sub);font-size:11px">扣 ${esc(r.fromName)}</span>` : ''}</span>
        ${r.units != null ? `<input type="number" step="any" data-recu="${r.id}" value="${+(+r.units).toFixed(6)}" title="單位數">` : `<span class="num">+${fmt(r.added || 0)}</span>`}
        <button class="mini" data-undo="${r.id}" title="撤銷">↺</button></div>`).join('')}</div>` : ''}

      <button class="btn gold" id="f_save">儲存</button>
      ${isNew ? '' : '<button class="btn danger" id="f_del">刪除這筆</button>'}
    `);
    bind();
  };

  const collect = () => {
    it.name = $('#f_name').value.trim() || '未命名';
    it.group = $('#f_group').value; it.kind = kind;
    it.excluded = $('#f_ex').checked; it.note = $('#f_note').value.trim();
    let bk = $('#f_bank').value;
    if (bk === '__new'){ const nm = $('#f_nb').value.trim(); if (nm){ const nb = {id:'b_' + uid(), name:nm}; (S.banks = S.banks || []).push(nb); bk = nb.id; } else bk = ''; }
    it.bank = bk;
    it.due = grp(it.group)?.cat === 'recv' ? ($('#f_due').value || '') : (it.due || '');
    it.ccy = $('#f_ccy').value;
    if (kind === 'cash'){ it.amount = num($('#f_amount').value); }
    else {
      let sym = $('#f_sym').value.trim(); if (kind === 'tw' || kind === 'crypto') sym = sym.toUpperCase();
      if (sym !== it.symbol) { it.market = undefined; it.prev = 0; }
      it.symbol = sym; it.units = num($('#f_units').value); it.price = num($('#f_price').value);
      if (!it.prev) it.prev = it.price;
    }
    if ($('#i_years')){
      const I = {years:num($('#i_years').value), paid:num($('#i_paid').value), premium:num($('#i_prem').value),
        ccy:$('#i_ccy .on')?.dataset.c || 'TWD', month:num($('#i_month').value), day:num($('#i_day').value), from:$('#i_from').value, auto:$('#i_auto').checked};
      if (I.month && (I.month < 1 || I.month > 12)) { toast('月份要 1–12'); return false; }
      if (I.day && (I.day < 1 || I.day > 31)) { toast('日期要 1–31'); return false; }
      const old = it.dca || {}; const sameDate = old.month === I.month && old.day === I.day && old.maxTimes;
      it.ins = I;
      it.dca = {on: I.auto && I.premium > 0 && I.month > 0 && I.day > 0 && (!I.years || I.paid < I.years), amount:I.premium, ccy:I.ccy, freq:'yearly', month:I.month, day:I.day,
        from:I.from, fee:0, skipWeekend:false, last: sameDate && old.last ? old.last : today(), maxTimes: I.years || 999, done: I.paid};
      return true;
    }
    p.on = $('#d_on').checked;
    if ($('#d_amt')){
      p.amount = num($('#d_amt').value); p.ccy = $('#d_ccy').value; p.fee = num($('#d_fee').value); p.from = $('#d_from').value;
      p.days = $('#d_days').value.split(/[^0-9]+/).map(Number).filter(n => n >= 1 && n <= 31);
      p.month = Math.min(12, Math.max(1, num($('#d_month').value) || 1)); p.day = Math.min(31, Math.max(1, num($('#d_day').value) || 1));
      p.skipWeekend = $('#d_wk').checked;
      const st = $('#d_start').value || today();
      p.last = addDays(st, -1);
    }
    it.dca = p;
    if (p.on && (p.freq === 'yearly' ? false : !p.days.length)) { toast('請填扣款日，例如 6, 16, 26'); return false; }
    if (p.on && !p.amount) { toast('請填每次金額'); return false; }
    return true;
  };

  const bind = () => {
    $('#sheet [data-close]').onclick = closeSheet;
    $('#f_kind').onclick = e => { const b = e.target.closest('button'); if (!b) return; snapshot(); kind = b.dataset.k; if (kind === 'crypto' || kind === 'us') it.ccy = 'USD'; draw(); };
    $('#f_bank').onchange = e => { $('#f_nb_row').style.display = e.target.value === '__new' ? '' : 'none'; if (e.target.value === '__new') $('#f_nb').focus(); };
    $('#f_group').onchange = e => { const was = isIns(it); snapshot(); it.group = e.target.value; if (isIns(it) !== was) return draw(); $('#f_due_row').style.display = grp(e.target.value)?.cat === 'recv' ? '' : 'none'; };
    if ($('#i_ccy')) $('#i_ccy').onclick = e => { const b = e.target.closest('button'); if (!b) return; [...$('#i_ccy').children].forEach(x => x.classList.toggle('on', x === b)); };
    if ($('#d_on')) $('#d_on').onchange = e => { $('#d_box').style.display = e.target.checked ? '' : 'none'; };
    if ($('#d_freq')) $('#d_freq').onclick = e => { const b = e.target.closest('button'); if (!b) return; p.freq = b.dataset.f; [...$('#d_freq').children].forEach(x => x.classList.toggle('on', x === b)); $('#d_days_row').style.display = p.freq === 'yearly' ? 'none' : ''; $('#d_year_row').style.display = p.freq === 'yearly' ? '' : 'none'; };
    if ($('#f_search')) $('#f_search').onclick = async () => {
      const q = $('#f_q').value.trim() || $('#f_name').value.trim(); if (!q) return;
      $('#f_res').innerHTML = '<div class="hint">搜尋中…</div>';
      try {
        const r = await yahooSearch(q);
        $('#f_res').innerHTML = r.length ? r.map(x => `<button data-pick="${esc(x.symbol)}"><b>${esc(x.symbol)}</b> · ${esc(x.name)} <span style="color:var(--sub)">${esc(x.type)} ${esc(x.exch)}</span></button>`).join('') : '<div class="hint">找不到，換個關鍵字（基金多半要用英文名）。</div>';
      } catch(e){ $('#f_res').innerHTML = '<div class="hint">搜尋失敗：要部署到 Netlify 後才連得到 Yahoo。</div>'; }
    };
    if ($('#f_res')) $('#f_res').onclick = async e => {
      const b = e.target.closest('[data-pick]'); if (!b) return;
      $('#f_sym').value = b.dataset.pick; $('#f_res').innerHTML = '<div class="hint">抓價格中…</div>';
      try { const q = await yahooQuote(b.dataset.pick); $('#f_price').value = q.price; if (q.ccy && CCYS.includes(q.ccy.toUpperCase())) $('#f_ccy').value = q.ccy.toUpperCase(); $('#f_res').innerHTML = `<div class="hint">✓ 目前 ${q.ccy} ${fmtP(q.price)}，跟你的對帳單淨值對一下，對得上就是它。</div>`; }
      catch(_){ $('#f_res').innerHTML = '<div class="hint">這個代號抓不到價格，換一個試試。</div>'; }
    };
    $('#f_save').onclick = () => {
      if (!collect()) return;
      const i = S.items.findIndex(x => x.id === it.id);
      if (i >= 0) S.items[i] = it; else S.items.push(it);
      save(); closeSheet(); render(); toast('已儲存 ✨');
      runDCA().then(render);
      if (it.kind !== 'cash' && it.symbol){ last[it.kind] = 0; refresh(); }
    };
    if ($('#f_del')) $('#f_del').onclick = () => confirmBox(`確定刪除「${esc(it.name)}」？`, () => { S.items = S.items.filter(x => x.id !== it.id); save(); closeSheet(); render(); });
    $('#sheet').querySelectorAll('[data-undo]').forEach(b => b.onclick = () => {
      confirmBox('撤銷這筆自動入帳？（單位數跟扣款都會還原）', () => {
        const real = itm(it.id); undoRec(real, b.dataset.undo); save(); render(); editItem(it.id);
      });
    });
    $('#sheet').querySelectorAll('[data-recu]').forEach(inp => inp.onchange = () => {
      const real = itm(it.id); const r = real.log.find(x => x.id === inp.dataset.recu); if (!r) return;
      const nv = num(inp.value); real.units = +(num(real.units) + nv - num(r.units)).toFixed(6); r.units = nv;
      if (r.price && nv) r.price = (r.amount - (r.fee || 0)) * fx(r.ccy) / fx(real.ccy) / nv;
      save(); render(); it.units = real.units; if ($('#f_units')) $('#f_units').value = real.units; toast('已更新單位數');
    });
  };
  // keep typed values when switching kind
  const snapshot = () => {
    it.name = $('#f_name').value; it.group = $('#f_group').value; if ($('#f_bank').value !== '__new') it.bank = $('#f_bank').value; if ($('#f_due')) it.due = $('#f_due').value;
    if ($('#f_units')){ it.units = num($('#f_units').value); it.price = num($('#f_price').value); it.symbol = $('#f_sym').value; }
    if ($('#f_amount')) it.amount = num($('#f_amount').value);
  };
  draw();
}

function editGroup(gid, cat){
  const isNew = !gid;
  const g = isNew ? {id:'g_' + uid(), cat, name:'', excluded:false} : {...grp(gid)};
  openSheet(`${topBar(isNew ? '新增群組' : '群組設定')}
    <div class="fld">
      <div class="row"><label>群組名稱</label><input type="text" id="g_name" value="${esc(g.name)}" placeholder="例：日股"></div>
      <div class="row"><label>分類</label><select id="g_cat">${CATS.map(c => `<option value="${c.id}" ${c.id === g.cat ? 'selected' : ''}>${c.name}</option>`).join('')}</select></div>
      <div class="row"><label>整組不統計</label>${sw('g_ex', g.excluded)}</div>
    </div>
    <button class="btn gold" id="g_save">儲存</button>
    ${isNew ? '' : '<button class="btn danger" id="g_del">刪除群組（含裡面的項目）</button>'}`);
  $('#sheet [data-close]').onclick = closeSheet;
  $('#g_save').onclick = () => {
    g.name = $('#g_name').value.trim() || '新群組'; g.cat = $('#g_cat').value; g.excluded = $('#g_ex').checked;
    const i = S.groups.findIndex(x => x.id === g.id); if (i >= 0) S.groups[i] = g; else S.groups.push(g);
    save(); closeSheet(); render();
  };
  if ($('#g_del')) $('#g_del').onclick = () => confirmBox(`刪除「${esc(g.name)}」和裡面所有項目？`, () => { S.groups = S.groups.filter(x => x.id !== g.id); S.items = S.items.filter(x => x.group !== g.id); save(); closeSheet(); render(); });
}

function confirmBox(msg, ok){
  const prev = $('#sheet').innerHTML;
  openSheet(`${topBar('確認')}<div class="hint" style="font-size:15px;color:var(--ink);margin:10px 4px 18px">${msg}</div>
    <button class="btn danger" id="c_ok">確定</button><button class="btn light" id="c_no">取消</button>`);
  $('#sheet [data-close]').onclick = closeSheet;
  $('#c_ok').onclick = () => { closeSheet(); ok(); };
  $('#c_no').onclick = closeSheet;
}

function addMenu(){
  openSheet(`${topBar('新增到哪裡？')}
    ${CATS.map(c => `<div class="sec-t"><span style="width:10px;height:10px;border-radius:3px;background:${c.color};display:inline-block"></span>${c.name}</div>
      <div class="seg">${S.groups.filter(g => g.cat === c.id).map(g => `<button data-ng="${g.id}">${esc(g.name)}</button>`).join('')}<button data-nc="${c.id}">＋ 新群組</button></div>`).join('')}`);
  $('#sheet [data-close]').onclick = closeSheet;
  $('#sheet').querySelectorAll('[data-ng]').forEach(b => b.onclick = () => editItem(null, b.dataset.ng));
  $('#sheet').querySelectorAll('[data-nc]').forEach(b => b.onclick = () => editGroup(null, b.dataset.nc));
}

function settings(){
  const T = totals();
  openSheet(`${topBar('設定與備份')}
    <div class="fld">
      <div class="row"><label>總資產</label><span class="num" style="flex:1;text-align:right">${fmt(T.assets)}</span></div>
      <div class="row"><label>負債</label><span class="num" style="flex:1;text-align:right">${fmt(T.cat.debt)}</span></div>
      <div class="row"><label>淨資產</label><span class="num" style="flex:1;text-align:right;font-weight:700">${fmt(T.net)}</span></div>
    </div>
    <div class="sec-t">匯率（自動更新，TWD）</div>
    <div class="fld">${['USD','JPY','EUR','CNY','HKD','AUD'].map(c => `<div class="row"><label>${c}</label><span class="num" style="flex:1;text-align:right">${fmtP(fx(c))}</span></div>`).join('')}</div>
    <div class="hint">${S.fx.ts ? '更新於 ' + new Date(S.fx.ts).toLocaleString('zh-TW') : '尚未從網路更新'}</div>
    <div class="sec-t">備份</div>
    <div class="hint">${S.lastBackup ? `上次備份：${new Date(S.lastBackup).toLocaleDateString('zh-TW')}` : '還沒有備份過'}</div>
    <button class="btn" id="s_export">⬇ 匯出 JSON 備份檔</button>
    <button class="btn light" id="s_copy">複製備份文字</button>
    <textarea id="s_dump" readonly rows="5" style="display:none;width:100%;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;font-size:12px"></textarea>
    <button class="btn light" id="s_import">匯入備份檔</button>
    <button class="btn light" id="s_paste">貼上備份文字匯入</button>
    <div id="s_pastebox" style="display:none"><textarea id="s_txt" rows="5" placeholder="把複製的備份文字貼在這裡" style="width:100%;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;font-size:13px"></textarea><button class="btn gold" id="s_doimport">匯入</button></div>
    <div class="hint">資料存在這支手機的瀏覽器裡。換手機或清除 Safari 資料前，記得先匯出備份。</div>
    <div class="sec-t">資料來源</div>
    <div class="hint">台股：證交所／櫃買即時行情（備援 Yahoo）・美股、基金、匯率：Yahoo Finance・加密貨幣：Binance（備援 CoinGecko）。報價可能有延遲，僅供記帳參考。</div>
    <button class="btn danger" id="s_reset">重設回初始資料</button>`);
  $('#sheet [data-close]').onclick = closeSheet;
  const dump = () => JSON.stringify(S, null, 1);
  const showDump = () => { const t = $('#s_dump'); t.value = dump(); t.style.display = ''; t.focus(); t.select(); toast('長按文字框 → 全選 → 拷貝'); };
  const mark = () => { S.lastBackup = Date.now(); save(); };
  $('#s_export').onclick = async () => {
    const name = `我的礦山備份_${today()}.json`;
    const file = new File([dump()], name, {type:'application/json'});
    try {
      if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); mark(); return; }
    } catch(e){ if (e && e.name === 'AbortError') return; }
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); mark(); toast('已下載備份檔'); }
    catch(e){ showDump(); }
  };
  $('#s_copy').onclick = async () => { try { await navigator.clipboard.writeText(dump()); mark(); toast('已複製，貼到備忘錄存起來'); } catch(e){ showDump(); mark(); } };
  $('#s_import').onclick = () => $('#fileIn').click();
  $('#s_paste').onclick = () => { $('#s_pastebox').style.display = ''; $('#s_txt').focus(); };
  $('#s_doimport').onclick = () => {
    try { const j = JSON.parse($('#s_txt').value); if (!j.items || !j.groups) throw 0;
      confirmBox('用貼上的資料取代目前所有資料？', () => { S = j; migrate(); save(); render(); toast('匯入完成'); refresh(true); });
    } catch(_){ toast('文字格式不對，請整段完整貼上'); }
  };
  $('#s_reset').onclick = () => confirmBox('所有修改都會不見，回到 11/11 的初始資料。確定？', () => { S = seed(); save(); render(); refresh(true); });
}
$('#fileIn').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const j = JSON.parse(await f.text()); if (!j.items || !j.groups) throw 0; S = j; save(); render(); closeSheet(); toast('匯入完成'); refresh(true); }
  catch(_){ toast('檔案格式不對'); }
  e.target.value = '';
};

/* ================= events ================= */
/* ================= long-press drag to reorder ================= */
(function(){
  let timer = null, drag = null, startX = 0, startY = 0, suppressClick = false, scrollTimer = null, lastClientY = 0;
  const rowsOf = grpEl => [...grpEl.querySelectorAll(':scope > .item')].filter(r => r.dataset.item || r.dataset.bankopen);
  function begin(row){
    const grpEl = row.closest('.grp[data-gid]'); if (!grpEl) return;
    drag = {row, grpEl, baseY: lastClientY + window.scrollY};
    row.classList.add('lifted'); document.body.classList.add('dragging');
    try { navigator.vibrate && navigator.vibrate(15); } catch(e){}
    scrollTimer = setInterval(() => {
      if (!drag) return;
      const edge = 90, h = window.innerHeight;
      if (lastClientY < edge) window.scrollBy(0, -10); else if (lastClientY > h - edge - 80) window.scrollBy(0, 10);
      move(lastClientY);
    }, 16);
  }
  function move(clientY){
    if (!drag) return;
    const {row} = drag;
    let dy = clientY + window.scrollY - drag.baseY;
    const rows = rowsOf(drag.grpEl), i = rows.indexOf(row);
    const next = rows[i + 1], prev = rows[i - 1];
    if (next && dy > next.offsetHeight / 2){ next.after(row); drag.baseY += next.offsetHeight; dy -= next.offsetHeight; }
    else if (prev && dy < -prev.offsetHeight / 2){ prev.before(row); drag.baseY -= prev.offsetHeight; dy += prev.offsetHeight; }
    row.style.transform = `translateY(${dy}px)`;
  }
  function finish(){
    clearTimeout(timer); timer = null;
    if (!drag) return;
    clearInterval(scrollTimer);
    const {row, grpEl} = drag; drag = null;
    row.classList.remove('lifted'); row.style.transform = ''; document.body.classList.remove('dragging');
    suppressClick = true; setTimeout(() => suppressClick = false, 350);
    const gid = grpEl.dataset.gid;
    const ids = [];
    rowsOf(grpEl).forEach(r => {
      if (r.dataset.item) ids.push(r.dataset.item);
      else S.items.filter(x => x.group === gid && x.bank === r.dataset.bankopen).forEach(x => ids.push(x.id));
    });
    S.items.filter(x => x.group === gid && !ids.includes(x.id)).forEach(x => ids.push(x.id));
    const first = S.items.findIndex(x => x.group === gid);
    const before = S.items.slice(0, first).filter(x => x.group !== gid), after = S.items.slice(first).filter(x => x.group !== gid);
    S.items = [...before, ...ids.map(itm).filter(Boolean), ...after];
    save(); render(); toast('順序已儲存');
  }
  const startOn = (target, x, y) => {
    if (sorting) return;
    const row = target.closest('.grp[data-gid] > .item'); if (!row || !(row.dataset.item || row.dataset.bankopen)) return;
    startX = x; startY = y; lastClientY = y;
    clearTimeout(timer); timer = setTimeout(() => { timer = null; begin(row); }, 420);
  };
  document.addEventListener('touchstart', e => { if (e.touches.length === 1) startOn(e.target, e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  document.addEventListener('touchmove', e => {
    const t = e.touches[0]; lastClientY = t.clientY;
    if (drag){ e.preventDefault(); move(t.clientY); return; }
    if (timer && (Math.abs(t.clientX - startX) > 8 || Math.abs(t.clientY - startY) > 8)){ clearTimeout(timer); timer = null; }
  }, {passive:false});
  document.addEventListener('touchend', finish); document.addEventListener('touchcancel', finish);
  // mouse (computer) support
  document.addEventListener('mousedown', e => { if (e.button === 0) startOn(e.target, e.clientX, e.clientY); });
  document.addEventListener('mousemove', e => { lastClientY = e.clientY; if (drag){ e.preventDefault(); move(e.clientY); } else if (timer && (Math.abs(e.clientX - startX) > 6 || Math.abs(e.clientY - startY) > 6)){ clearTimeout(timer); timer = null; } });
  document.addEventListener('mouseup', finish);
  document.addEventListener('contextmenu', e => { if (drag || timer) e.preventDefault(); });
  document.addEventListener('click', e => { if (suppressClick){ e.stopPropagation(); e.preventDefault(); } }, true);
})();

document.addEventListener('click', e => {
  const mv = e.target.closest('[data-mv]');
  if (mv){ e.stopPropagation(); const [type, id, d] = mv.dataset.mv.split(':');
    if (type === 'i'){ const it = itm(id); moveIn(S.items, it, +d, x => x.group === it.group); }
    else { const g = grp(id); moveIn(S.groups, g, +d, x => x.cat === g.cat); }
    save(); render(); return; }
  const vb = e.target.closest('[data-view]'); if (vb){ S.view = vb.dataset.view; save(); render(); return; }
  const bo = e.target.closest('[data-bankopen]'); if (bo) return bankSheet(bo.dataset.bankopen);
  const bt = e.target.closest('[data-btoggle],[data-bankadd],[data-bankedit]');
  if (bt){
    if (bt.dataset.btoggle !== undefined){ S.bclosed = S.bclosed || {}; S.bclosed[bt.dataset.btoggle] = !S.bclosed[bt.dataset.btoggle]; save(); bt.closest('.card').classList.toggle('closed'); return; }
    if (bt.dataset.bankadd !== undefined) return bankAdd(bt.dataset.bankadd);
    return editBank(bt.dataset.bankedit);
  }
  const t = e.target.closest('[data-toggle],[data-item],[data-additem],[data-addgroup],[data-gedit],[data-gtoggle]'); if (!t) return;
  if (t.dataset.gtoggle){ S.gclosed = S.gclosed || {}; S.gclosed[t.dataset.gtoggle] = !S.gclosed[t.dataset.gtoggle]; save(); t.closest('.grp').classList.toggle('gclosed'); return; }
  if (t.dataset.gedit){ e.stopPropagation(); return editGroup(t.dataset.gedit); }
  if (t.dataset.toggle){ S.closed[t.dataset.toggle] = !S.closed[t.dataset.toggle]; save(); t.closest('.card').classList.toggle('closed'); return; }
  if (t.dataset.item) return editItem(t.dataset.item);
  if (t.dataset.additem) return editItem(null, t.dataset.additem);
  if (t.dataset.addgroup) return editGroup(null, t.dataset.addgroup);
});
const setSort = on => { sorting = on; document.body.classList.toggle('sorting', on); if (on){ S.gclosed = {}; CATS.forEach(c => S.closed[c.id] = false); } render(); };
$('#sortBtn').onclick = () => setSort(!sorting);
$('#sortDone').onclick = () => { setSort(false); toast('順序已儲存'); };
$('#eyeBtn').onclick = () => { S.hide = !S.hide; save(); render(); };
$('#refreshBtn').onclick = () => refresh(true);
$('#fab').onclick = addMenu;
$('#settingsBtn').onclick = settings;
$('#collapseBtn').onclick = () => { const all = CATS.every(c => S.closed[c.id]); CATS.forEach(c => S.closed[c.id] = !all); save(); render(); };
$('#mine').onclick = () => { burst(14); refresh(true); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

/* ================= mine animation ================= */
const STAR = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 0c.7 6.5 5.5 11.3 12 12-6.5.7-11.3 5.5-12 12-.7-6.5-5.5-11.3-12-12C6.5 11.3 11.3 6.5 12 0z"/></svg>';
function initMine(){
  $('#cartImg').src = CART_SRC;
  const sh = $('#cartShine'); sh.style.webkitMaskImage = sh.style.maskImage = `url(${CART_SRC})`;
  const mine = $('#mine');
  [[8,18,0,20],[178,8,.6,16],[188,70,1.2,14],[2,78,1.8,12],[60,-6,.9,13],[140,112,1.5,11]].forEach(([x,y,d,s]) => {
    const el = document.createElement('div'); el.className = 'spark'; el.innerHTML = STAR;
    Object.assign(el.style, {left:x + 'px', top:y + 'px', width:s + 'px', height:s + 'px', animationDelay:d + 's', animationDuration:(2 + Math.random()) + 's'});
    mine.appendChild(el);
  });
  setInterval(() => { if (!document.hidden) burst(2); }, 3800);
}
function burst(n){
  const mine = $('#mine');
  for (let i = 0; i < n; i++){
    const el = document.createElement('div'); el.className = 'nug';
    mine.appendChild(el);
    const dx = (Math.random() - .5) * 170, up = 40 + Math.random() * 50, rot = (Math.random() - .5) * 720;
    el.animate([
      {transform:'translate(-50%,0) rotate(0)', opacity:1},
      {transform:`translate(calc(-50% + ${dx * .5}px), -${up}px) rotate(${rot / 2}deg)`, opacity:1, offset:.45},
      {transform:`translate(calc(-50% + ${dx}px), 70px) rotate(${rot}deg)`, opacity:0}
    ], {duration:1100 + Math.random() * 500, delay:i * 45, easing:'cubic-bezier(.3,.6,.5,1)'}).onfinish = () => el.remove();
  }
  $('#total').classList.remove('pop'); void $('#total').offsetWidth; $('#total').classList.add('pop');
}

/* ================= boot ================= */
load(); initMine(); render();
runDCA().then(render);
refresh(true);
setInterval(() => { if (!document.hidden) refresh(); }, 20e3);
setInterval(render, 60e3);
</script>
