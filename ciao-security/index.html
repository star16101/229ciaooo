  :root{
    --bg:#ECEEED;
    --surface:#FAFAF9;
    --surface-2:#E1E6E6;
    --ink:#38404A;
    --ink-soft:#80898F;
    --accent:#5F7B8A;
    --accent-deep:#475F6D;
    --accent-ink:#475F6D;
    --accent-soft:#DCE5E8;
    --rose:#B08F8A;
    --rose-soft:#EFE3E0;
    --sage:#7E948B;
    --sage-soft:#DFE8E3;
    --slate:#7E8C93;
    --slate-soft:#DCE3E4;
    --border:#D9DFDF;
    --danger:#A5645B;
    --danger-soft:#F2E4E1;
    --radius:20px;
    --radius-sm:14px;
    --shadow:0 1px 2px rgba(56,64,74,0.05), 0 8px 24px rgba(56,64,74,0.07);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3,.serif,.modal-title,.brand .title{font-family:'JinXuan','Noto Serif TC',serif;font-weight:600;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  /* ---- top bar ---- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(236,238,237,0.9);
    backdrop-filter:blur(8px);
    padding:calc(34px + env(safe-area-inset-top)) 20px 16px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;flex-direction:column;line-height:1.2;}
  .brand .title{font-size:22px;font-weight:600;letter-spacing:1px;}
  @keyframes islandFloat{
    0%,100%{ transform:translateY(0) rotate(-4deg); }
    50%{ transform:translateY(-5px) rotate(4deg); }
  }
  .island-emoji{display:inline-block;animation:islandFloat 2.6s ease-in-out infinite;margin-right:4px;}
  .brand .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .icon-btn{
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:8px 14px;font-size:13px;color:var(--ink-soft);
    cursor:pointer;
  }
  .back-btn{background:none;border:none;color:var(--accent-ink);font-size:14px;cursor:pointer;padding:6px 0;display:flex;align-items:center;gap:4px;}

  .content{flex:1;padding:20px 20px 60px;}

  /* ---- cards ---- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    margin-bottom:14px;
  }
  .card.tap{cursor:pointer;transition:transform .12s ease;}
  .card.tap:active{transform:scale(0.98);}
  .empty{
    text-align:center;color:var(--ink-soft);padding:48px 20px;
    font-size:14px;line-height:1.8;
  }

  /* ---- forms ---- */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:500;}
  .field input, .field select, .field textarea{
    width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--surface);color:var(--ink);font-size:16px;
  }
  .field textarea{resize:vertical;min-height:90px;}
  .field input[type=date]{
    -webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;
    height:48px;line-height:1.2;text-align:left;
  }
  .field input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em;}
  .field input[type=date]::-webkit-calendar-picker-indicator{opacity:.55;}
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(95,123,138,.15);
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:14px 22px;border-radius:14px;border:1px solid transparent;font-size:15px;font-weight:600;
    letter-spacing:1px;cursor:pointer;width:100%;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .btn:active{transform:translateY(1px) scale(.99);}
  .btn:disabled{opacity:.6;cursor:default;}
  .btn-primary{
    background:linear-gradient(180deg,#6B8797 0%,#566F7D 100%);color:#fff;
    box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 6px 16px rgba(71,95,109,.28);
  }
  .btn-primary:active{background:var(--accent-deep);box-shadow:0 2px 6px rgba(71,95,109,.3);}
  .btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--border);box-shadow:0 1px 2px rgba(56,64,74,.05);}
  .btn-sage{background:linear-gradient(180deg,#8CA197 0%,#738B80 100%);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 6px 16px rgba(115,139,128,.28);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--accent-deep);box-shadow:0 1px 2px rgba(56,64,74,.05);}
  .btn-sm{padding:10px 16px;font-size:13px;width:auto;border-radius:12px;}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}

  .tabs{display:flex;gap:4px;margin-bottom:22px;background:var(--surface-2);padding:4px;border-radius:16px;}
  .tab{flex:1;text-align:center;padding:11px;border-radius:12px;font-size:14px;font-weight:600;letter-spacing:1px;color:var(--ink-soft);cursor:pointer;transition:background .15s,color .15s;}
  .tab.active{background:var(--surface);color:var(--accent-deep);box-shadow:0 1px 3px rgba(56,64,74,.1);}

  .link{color:var(--accent-ink);font-size:13px;text-align:center;display:block;margin-top:16px;cursor:pointer;text-decoration:underline;}
  .link-muted{color:var(--ink-soft);font-size:12px;text-align:center;display:block;margin-top:28px;cursor:pointer;}

  /* ================= 新擬物 Neumorphism（最終覆蓋層）================= */
  :root{
    --bg:#E8EBF0; --surface:#E8EBF0; --surface-2:#DEE2E8;
    --ink:#4A4D57; --ink-soft:#9498A3; --border:transparent;
    --accent:#F4A62A; --accent-deep:#E8901A; --accent-ink:#B8700F; --accent-soft:#FBE7BE;
    --brown:#8A5A12; --radius:30px; --radius-sm:20px;
    --nu-dark:#C6CAD3; --nu-light:#FFFFFF;
    --raise:8px 8px 18px var(--nu-dark), -8px -8px 18px var(--nu-light);
    --raise-sm:5px 5px 11px var(--nu-dark), -5px -5px 11px var(--nu-light);
    --press:inset 5px 5px 10px var(--nu-dark), inset -5px -5px 10px var(--nu-light);
    --grad:linear-gradient(145deg,#F9CC57,#F29A24);
    --shadow:var(--raise);
  }
  html,body{background:var(--bg)!important;color:var(--ink);}
  #app{padding-bottom:40px;}
  .topbar{background:var(--bg)!important;border:0!important;box-shadow:none!important;padding:22px 22px 8px!important;backdrop-filter:none!important;}
  .brand .title{color:var(--ink)!important;font-size:24px!important;}
  .brand .sub{color:var(--ink-soft)!important;font-size:11px!important;letter-spacing:.14em;margin-top:6px;}
  .content{padding:10px 22px 40px!important;}
  .section-title{background:none!important;border:0!important;box-shadow:none!important;color:var(--ink-soft)!important;font-size:12px!important;letter-spacing:.2em;font-weight:600;margin:26px 4px 14px!important;display:flex;align-items:center;gap:10px;padding:0!important;text-transform:none;}
  .section-title::before{content:"";width:18px;height:4px;border-radius:4px;background:var(--grad);display:inline-block;}
  .hint{color:var(--ink-soft)!important;}

  /* cards */
  .card{background:var(--bg)!important;border:0!important;border-radius:30px!important;box-shadow:var(--raise)!important;color:var(--ink)!important;}
  .card.tap{transition:box-shadow .15s,transform .15s;cursor:pointer;}
  .card.tap:active{box-shadow:var(--press)!important;transform:scale(.99);}
  .panel{background:var(--bg);border-radius:36px;box-shadow:var(--raise);padding:22px 20px 24px;}

  /* buttons */
  .btn,.btn-sm,button.btn{background:var(--bg)!important;color:var(--ink)!important;border:0!important;border-radius:999px!important;box-shadow:var(--raise-sm)!important;font-weight:600;letter-spacing:.04em;transition:box-shadow .12s,transform .12s;}
  .btn:active,.btn-sm:active{box-shadow:var(--press)!important;transform:scale(.98);}
  .btn-primary,.btn.btn-primary{background:var(--grad)!important;color:#fff!important;text-shadow:0 1px 2px rgba(150,80,0,.35);box-shadow:6px 6px 14px rgba(214,150,40,.45),-5px -5px 12px #fff!important;}
  .btn-primary:active{box-shadow:inset 4px 4px 9px rgba(170,100,10,.5),inset -3px -3px 7px rgba(255,220,130,.6)!important;}
  .btn-secondary,.btn-sage,.btn-ghost{background:var(--bg)!important;color:var(--accent-ink)!important;}
  .btn:disabled{opacity:.55;}
  .icon-btn{background:var(--bg)!important;color:var(--ink)!important;border:0!important;border-radius:999px!important;box-shadow:var(--raise-sm)!important;padding:9px 16px!important;font-size:12px!important;font-weight:600;}
  .icon-btn:active{box-shadow:var(--press)!important;}
  .back-btn{background:var(--bg)!important;border:0!important;border-radius:999px!important;box-shadow:var(--raise-sm)!important;color:var(--ink)!important;}
  .add-item-btn{background:var(--bg)!important;border:0!important;box-shadow:var(--raise-sm)!important;border-radius:999px!important;color:var(--accent-ink)!important;}
  .fab{background:var(--grad)!important;color:#fff!important;border:0!important;border-radius:50%!important;box-shadow:7px 7px 16px rgba(214,150,40,.5),-6px -6px 14px #fff!important;}
  .fab:active{box-shadow:inset 4px 4px 9px rgba(170,100,10,.5)!important;}
  .mini-btn{flex:1;border:0;border-radius:999px;background:var(--bg);color:var(--accent-ink);font-weight:700;font-size:13px;padding:10px 0;box-shadow:var(--raise-sm);cursor:pointer;letter-spacing:.1em;}
  .mini-btn:active{box-shadow:var(--press);}
  .btn-row{gap:14px!important;}

  /* inputs */
  .field input,.field select,.field textarea,input[type=text],input[type=tel],input[type=password],input[type=date],textarea,select{background:var(--bg)!important;border:0!important;border-radius:20px!important;box-shadow:var(--press)!important;color:var(--ink)!important;padding:14px 18px!important;outline:none;}
  .field input:focus,.field textarea:focus,textarea:focus{box-shadow:var(--press),0 0 0 2px rgba(244,166,42,.55)!important;}
  .field label,.label{color:var(--ink-soft)!important;font-size:12px!important;letter-spacing:.08em;}
  .paste-box,.draft-card,.invite-box{background:var(--bg)!important;border:0!important;border-radius:26px!important;box-shadow:var(--press)!important;}
  .invite-code{color:var(--accent-ink)!important;}

  /* segmented tabs */
  .tabs{display:flex;gap:0;background:var(--bg)!important;border:0!important;border-radius:999px!important;box-shadow:var(--press)!important;padding:6px!important;margin:0 0 20px!important;}
  .tab{flex:1;text-align:center;padding:11px 0!important;border-radius:999px!important;color:var(--ink-soft)!important;background:transparent!important;border:0!important;box-shadow:none!important;font-weight:600;font-size:14px;cursor:pointer;position:relative;transition:all .18s;}
  .tab.active{background:var(--bg)!important;color:var(--accent-ink)!important;box-shadow:var(--raise-sm)!important;}
  .tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--grad);margin-left:5px;vertical-align:middle;}
  .tabs.three{margin-top:22px!important;}

  /* login */
  .login-hero{text-align:center;padding:42px 20px 10px;}
  .login-hero .island-mascot{width:110px!important;height:auto;margin:0 auto 6px;display:block;filter:drop-shadow(6px 8px 10px rgba(150,155,170,.45));}
  .login-title{font-size:28px;color:var(--ink);margin-top:6px;}
  .login-sub{font-size:12px;color:var(--ink-soft);letter-spacing:.12em;margin-top:8px;}
  .link-muted{text-align:center;color:var(--ink-soft)!important;margin-top:22px;font-size:13px;}
  .msg{border-radius:20px!important;box-shadow:var(--press);background:var(--bg)!important;border:0!important;}
  .msg-error{color:#B4574B!important;} .msg-ok{color:#4F8B6B!important;}

  /* policy card */
  .policy-card{padding:18px 18px 16px!important;margin-bottom:20px!important;}
  .pol-top{display:flex;align-items:center;gap:14px;}
  .pol-badge{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--accent-ink);background:var(--bg);box-shadow:var(--press);font-family:'Noto Sans TC',sans-serif;}
  .pol-main{flex:1;min-width:0;}
  .pol-main .insurer{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;margin-bottom:3px;}
  .pol-main .name{font-size:16px;font-weight:700;color:var(--ink);line-height:1.35;}
  .pol-right{flex:none;display:flex;gap:8px;align-items:center;}
  .chev{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--raise-sm);color:var(--accent-ink);font-size:20px;}
  .pol-act{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--raise-sm);color:var(--ink);font-size:14px;cursor:pointer;}
  .pol-act:active{box-shadow:var(--press);} .pol-act.del{color:#B4574B;}
  .tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .tag{background:var(--bg)!important;border:0!important;box-shadow:var(--press);color:var(--ink-soft)!important;border-radius:999px!important;padding:5px 12px!important;font-size:11px!important;}
  .tag.accent{color:var(--accent-ink)!important;}
  .rider-box{margin-top:14px;padding:12px 14px;border-radius:20px;box-shadow:var(--press);}
  .rider-cap{font-size:11px;color:var(--ink-soft);letter-spacing:.2em;margin-bottom:6px;}
  .rider-row{padding:6px 0!important;border:0!important;}
  .rider-name{font-size:13px;color:var(--ink);} .rider-tags{font-size:11px;color:var(--ink-soft);}
  .item-line{background:transparent!important;border:0!important;}

  /* hero gauge */
  .hero-panel{display:flex;align-items:center;gap:20px;background:var(--bg);border-radius:36px;box-shadow:var(--raise);padding:22px 20px;}
  .ring{position:relative;width:128px;height:128px;flex:none;border-radius:50%;box-shadow:var(--raise-sm);padding:6px;background:var(--bg);}
  .ring-svg{width:100%;height:100%;display:block;}
  .ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-num{font-size:30px;font-weight:700;color:var(--ink);line-height:1;font-family:'Noto Sans TC',sans-serif;}
  .ring-num span{font-size:13px;color:var(--ink-soft);margin-left:1px;}
  .ring-cap{font-size:10px;color:var(--ink-soft);letter-spacing:.14em;margin-top:5px;}
  .hero-side{flex:1;min-width:0;}
  .hs-cap{font-size:11px;color:var(--ink-soft);letter-spacing:.2em;}
  .hs-big{font-size:21px;font-weight:700;color:var(--ink);margin:4px 0 2px;font-family:'JinXuan','Noto Serif TC',serif;}
  .hs-line{font-size:12px;color:var(--accent-ink);font-weight:600;}
  .hs-btns{display:flex;gap:10px;margin-top:14px;}

  /* gap */
  .gap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .gap-tile{border-radius:24px;padding:16px 6px 14px;text-align:center;cursor:pointer;transition:all .15s;}
  .gap-tile.on{background:var(--grad);box-shadow:6px 6px 14px rgba(214,150,40,.4),-5px -5px 12px #fff;color:#fff;}
  .gap-tile.off{background:var(--bg);box-shadow:var(--press);color:var(--ink-soft);}
  .gap-ico{font-size:26px;line-height:1;} .gap-tile.off .gap-ico{filter:grayscale(1);opacity:.55;}
  .gap-name{font-size:12px;font-weight:700;margin-top:9px;} .gap-state{font-size:10px;margin-top:3px;letter-spacing:.1em;opacity:.9;}
  .gap-detail{margin-top:22px;padding:20px!important;}
  .gd-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:12px;}
  .gd-row{display:flex;gap:12px;margin-top:12px;align-items:flex-start;}
  .gd-ico{width:38px;height:38px;border-radius:50%;box-shadow:var(--raise-sm);display:flex;align-items:center;justify-content:center;flex:none;}
  .gd-name{font-size:14px;font-weight:700;color:var(--ink);} .gd-tip{font-size:12px;color:var(--ink-soft);line-height:1.65;margin-top:2px;}

  /* games */
  .game-menu{display:grid;grid-template-columns:1fr;gap:16px;}
  .game-tile{display:grid;grid-template-columns:56px 1fr;column-gap:14px;align-items:center;padding:16px 18px;border-radius:28px;background:var(--bg);box-shadow:var(--raise-sm);cursor:pointer;}
  .game-tile:active{box-shadow:var(--press);}
  .g-ico{grid-row:1/3;width:56px;height:56px;border-radius:50%;box-shadow:var(--press);display:flex;align-items:center;justify-content:center;font-size:26px;}
  .g-name{font-weight:700;font-size:15px;color:var(--ink);} .g-desc{font-size:12px;color:var(--ink-soft);}
  .memo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .memo-card{aspect-ratio:1;border:0;border-radius:20px;background:var(--bg);box-shadow:var(--raise-sm);font-size:26px;cursor:pointer;padding:0!important;transition:all .15s;}
  .memo-card.on{box-shadow:var(--press);background:var(--bg);} .memo-card.done{background:var(--accent-soft);}
  .game-stat{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:12px;font-weight:600;}
  .catch-area{position:relative;height:300px;border-radius:28px;box-shadow:var(--press);overflow:hidden;touch-action:none;}
  .catch-hud{position:absolute;top:10px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink);z-index:2;}
  .catcher{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:38px;line-height:1;transition:filter .2s;}
  .catcher.hit{filter:grayscale(1) brightness(.8);}
  .fall{position:absolute;font-size:28px;transform:translateX(-50%);line-height:1;}
  .fortune-box{border-radius:28px;box-shadow:var(--press);padding:30px 22px;text-align:center;}
  .fortune-ico{font-size:46px;display:inline-block;} .fortune-ico.shake{animation:fshake .7s;}
  @keyframes fshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg)}40%{transform:rotate(16deg)}60%{transform:rotate(-12deg)}80%{transform:rotate(8deg)}}
  .fortune-text{margin-top:14px;font-size:15px;line-height:1.8;color:var(--ink);font-family:'JinXuan','Noto Serif TC',serif;}

  /* modal */
  .modal{background:var(--bg)!important;border-radius:36px 36px 0 0!important;box-shadow:0 -10px 30px rgba(120,125,140,.25)!important;border:0!important;}
  .modal-handle{background:var(--nu-dark)!important;}
  .modal-title{color:var(--ink)!important;}

  /* lists / admin */
  .client-row{background:var(--bg)!important;border:0!important;border-radius:28px!important;box-shadow:var(--raise-sm)!important;}
  .client-row:active{box-shadow:var(--press)!important;}
  .empty,.loading{color:var(--ink-soft)!important;}
  .chevron{color:var(--accent-ink)!important;}
  hr{border:0;height:2px;background:var(--nu-dark);opacity:.4;border-radius:2px;}
  .login-hero .island-mascot.mascot-lg{width:112px!important;}
  .top-right{display:flex;align-items:center;gap:10px;}
  .top-right .island-mascot{width:46px!important;height:auto;filter:drop-shadow(3px 4px 5px rgba(150,155,170,.5));}

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://zefgdogfbfiqyvxdcnvs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DUd4I3iTYi165too1Go3Ww_QGTJtX7z';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const ADMIN_LOGIN_EMAIL = 'admin@island.local'; // 業務登入只輸入密碼，帳號固定
const app = document.getElementById('app');

let state = {
  session: null,
  profile: null,        // {id, role, client_id, display_name}
  view: 'login',         // login | admin-signup | admin-home | admin-client | client-home
  authTab: 'client',
  clientNeedsCode: false,
  clientPhoneCache: '',
  activeClientId: null,
  activeClientName: '',
  clients: [],
  clientSearch: '',
  messages: [],
  referrals: [],
  myClient: null,
  myMessages: [],
  policies: [],
  ridersByPolicy: {},
  coverage: [],
  editingPolicy: null,   // policy object being edited, or 'new'
  draftRiders: [],       // for policy form: [{product_name,payment_term,coverage_plan}]
  pasteOpen: false,
  pasteText: '',
  parsedBatch: null,     // { insurer, main:{...}, riders:[...] } from paste parse
  parsedMultiBatches: [], // multiple policies parsed from one paste (date-separated)
  parsedCoverageDrafts: [], // parsed candidates for coverage_summary paste
  msg: null,             // {type,text}
  activePolicyId: null,  // for client policy detail page / admin per-policy coverage manager
  referralCode: null,
  referralSubmitted: false,
  referralSubmitting: false,
};

function setMsg(type, text){ state.msg = {type, text}; render(); setTimeout(()=>{ if(state.msg && state.msg.text===text){ state.msg=null; render(); } }, 4000); }

// ---------- auth bootstrap ----------
const urlParams = new URLSearchParams(location.search);
const refCodeFromUrl = urlParams.get('ref');
if(refCodeFromUrl){
  state.view = 'referral-signup';
  state.referralCode = refCodeFromUrl;
  render();
} else {
  sb.auth.getSession().then(({data})=>{
    state.session = data.session;
    afterAuthChange();
  });
  sb.auth.onAuthStateChange((_event, session)=>{
    state.session = session;
    afterAuthChange();
  });
}

async function afterAuthChange(){
  if(!state.session){
    state.profile = null;
    state.view = 'login';
    render();
    return;
  }
  const { data, error } = await sb.from('ins_profiles').select('*').eq('id', state.session.user.id).single();
  if(error || !data){
    state.profile = null;
    state.view = 'login';
    render();
    return;
  }
  state.profile = data;
  if(data.role === 'admin'){
    state.view = 'admin-home';
    await loadClients();
    await loadAdminInbox();
  } else {
    state.view = 'client-home';
    state.activeClientId = data.client_id;
    await loadClientHomeData();
  }
  render();
}

async function logout(){
  await sb.auth.signOut();
  state = {...state, session:null, profile:null, view:'login', activeClientId:null, clients:[], policies:[], coverage:[]};
  render();
}

// ---------- data loaders ----------
async function loadClients(){
  const { data: clients } = await sb.from('ins_clients').select('*').order('created_at', {ascending:false});
  const { data: policyCounts } = await sb.from('ins_policies').select('client_id');
  const counts = {};
  (policyCounts||[]).forEach(p=>{ counts[p.client_id] = (counts[p.client_id]||0)+1; });
  state.clients = (clients||[]).map(c=>({...c, count: counts[c.id]||0}));
  state.activity = {};
  try{ const { data: act } = await sb.rpc('ins_client_activity'); (act||[]).forEach(a=>{ state.activity[a.client_id] = a.last_sign_in_at || 'none'; }); }catch(e){}
}
function activityText(id){
  const a = (state.activity||{})[id];
  if(!a) return '<span class="act off">✗ 尚未開通</span>';
  if(a==='none') return '<span class="act on">✓ 已開通,尚未登入</span>';
  const d = new Date(a), p2=n=>String(n).padStart(2,'0');
  const t = `${d.getFullYear()}/${p2(d.getMonth()+1)}/${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  return `<span class="act on">✓ 已開通,最近登入:${t}</span>`;
}

async function loadAdminInbox(){
  const { data: messages } = await sb.from('ins_messages').select('*, clients:ins_clients(name)').order('created_at', {ascending:false});
  const { data: referrals } = await sb.from('ins_referrals').select('*').order('created_at', {ascending:false});
  state.messages = messages || [];
  state.referrals = referrals || [];
}

async function loadClientPolicies(clientId){
  const { data: policies } = await sb.from('ins_policies').select('*').eq('client_id', clientId).order('sort_order').order('created_at');
  const policyIds = (policies||[]).map(p=>p.id);
  let riders = [];
  if(policyIds.length){
    const { data: riderData } = await sb.from('ins_policy_riders').select('*').in('policy_id', policyIds).order('sort_order').order('created_at');
    riders = riderData || [];
  }
  const { data: coverage } = await sb.from('ins_coverage_summary').select('*').eq('client_id', clientId).order('sort_order').order('created_at');
  state.policies = (policies || []).sort((a,b)=>(a.effective_date||'9999').localeCompare(b.effective_date||'9999') || (a.insurer||'').localeCompare(b.insurer||'','zh-Hant-TW'));
  state.ridersByPolicy = {};
  riders.forEach(r=>{ (state.ridersByPolicy[r.policy_id] ||= []).push(r); });
  state.coverage = coverage || [];
}

const FAMILY_RELATIONS = ['伴侶','爸爸','媽媽','爺爺','奶奶','兒子','女兒','哥哥','姊姊','弟弟','妹妹','手足'];
async function loadFamily(clientId){
  const { data } = await sb.from('ins_family_links').select('id, relation, related_id, related:ins_clients!ins_family_links_related_id_fkey(id,name)').eq('client_id', clientId).order('created_at');
  return (data||[]).filter(r=>r.related);
}
async function switchViewing(id){
  state.viewingId = (id && id!==state.activeClientId) ? id : null;
  state.clientTab = 'policies'; state.insurerFilter = '';
  await loadClientPolicies(state.viewingId || state.activeClientId);
  render(); window.scrollTo(0,0);
}
async function loadClientHomeData(){
  state.viewingId = null;
  state.family = await loadFamily(state.activeClientId);
  await loadClientPolicies(state.activeClientId);
  const { data: myClient } = await sb.from('ins_clients').select('name, referral_code').eq('id', state.activeClientId).single();
  state.myClient = myClient || null;
  const { data: myMessages } = await sb.from('ins_messages').select('*').eq('client_id', state.activeClientId).order('created_at', {ascending:false});
  state.myMessages = myMessages || [];
}

function mascotHtml(){ return `<img class="island-mascot" src="${ISLAND_IMG}" alt="島嶼" draggable="false">`; }
const GULL_SVG = `<svg viewBox="0 0 40 20" width="34" height="17" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2 14 Q10 1 20 12 Q30 1 38 14" fill="none" stroke="#5B6B73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function releaseGulls(el){
  el.classList.remove('hop'); void el.offsetWidth; el.classList.add('hop');
  const r = el.getBoundingClientRect();
  const n = 4;
  for(let i=0;i<n;i++){
    const g = document.createElement('div');
    g.className = 'gull';
    g.innerHTML = GULL_SVG;
    const dir = i%2===0 ? 1 : -1;
    g.style.left = (r.left + r.width*0.55) + 'px';
    g.style.top = (r.top + r.height*0.45) + 'px';
    g.style.setProperty('--dx', (dir*(60+Math.random()*120)) + 'px');
    g.style.setProperty('--dy', (-(30+Math.random()*80)) + 'px');
    g.style.setProperty('--dur', (1.8+Math.random()*1.1) + 's');
    g.style.animationDelay = (i*0.12) + 's';
    document.body.appendChild(g);
    setTimeout(()=>g.remove(), 3400);
  }
}
document.addEventListener('click', e=>{
  const m = e.target.closest && e.target.closest('.island-mascot');
  if(m) releaseGulls(m);
});

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function genPassword(){ return Math.random().toString(36).slice(-6) + Math.random().toString(36).slice(-2).toUpperCase(); }

// ---------- paste parser ----------
const POLICY_STATUS_OPTIONS = ['有效','停效','失效','減額繳清','減額'];

const KNOWN_INSURERS = ['台灣人壽','富邦人壽','新光人壽','凱基人壽','遠雄人壽','全球人壽','保誠人壽',
  '國泰人壽','南山人壽','玉山人壽','安達人壽','臺銀人壽','安聯人壽','友邦人壽','宏泰人壽','元大人壽','第一金人壽','法國巴黎人壽'];

function detectInsurerFromText(text){
  for(const name of KNOWN_INSURERS){ if(text.includes(name)) return name; }
  return '';
}

// 保單只抓：商品名稱／繳費年期／保額或計劃別。不處理保費金額，也不帶入保障內容子項目。
function extractPolicyLine(line){
  const codeMatch = line.match(/[\(（]([A-Za-z0-9\/.]{2,12})[\)）]/);
  const detailsText = codeMatch ? line.slice(codeMatch.index + codeMatch[0].length) : '';

  const termMatch = detailsText.match(/(\d+\s*年期|一年期|躉繳)/) || detailsText.match(/(保障終身|終身)/);

  let amountMatch = null;
  const amountPatterns = [
    /\d+(?:\.\d+)?\s*萬/,
    /\d+\s*單位/,
    /(?:計劃|計畫|方案)[一二三四五六七八九十\dA-Za-z]{0,3}/,
  ];
  for(const p of amountPatterns){ const m = detailsText.match(p); if(m){ amountMatch = m[0]; break; } }
  // 刻意不用「元」金額當作保額/計劃別備援 —— 那通常是保費，遇到就略過

  let productName = line.split(/[\(（]/)[0].trim() || line.trim();

  return {
    product_name: productName || '未命名商品',
    payment_term: termMatch ? termMatch[0] : '',
    coverage_plan: amountMatch ? amountMatch.trim() : '',
  };
}

function parseImportText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const merged = [];
  lines.forEach(l=>{
    if(/^[\(（]/.test(l) && merged.length){
      merged[merged.length-1] += ' ' + l; // 換行造成的接續內容，併回上一行
    } else {
      merged.push(l);
    }
  });
  const candidateLines = merged.filter(l=>/[\(（0-9]/.test(l)); // 過濾掉純標題字（如「豁免保費 性別 年齡」）
  const source = candidateLines.length ? candidateLines : merged;
  return source.map(extractPolicyLine);
}

// 整段貼上「多張保單」：以民國日期（如 090/03/22）為分隔，每個日期起算一張新保單，
// 日期後第一行若無數字/括號視為保險公司名稱，其餘為該保單的商品明細
function parseMultiPolicyText(text){
  const rawLines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const lines = rawLines.filter(l => !/^繳費年期/.test(l) && !/^年繳保費/.test(l) && !/^保單內容/.test(l));

  const groups = [];
  let current = null;
  for(const line of lines){
    const dateMatch = line.match(/^(\d{2,3})\/(\d{2})\/(\d{2})$/);
    if(dateMatch){
      const y = parseInt(dateMatch[1],10) + 1911;
      current = { effective_date: `${y}-${dateMatch[2]}-${dateMatch[3]}`, insurer: '', productLines: [] };
      groups.push(current);
      continue;
    }
    if(!current) continue;
    if(!current.insurer && !/[\(（0-9]/.test(line)){
      current.insurer = line;
      continue;
    }
    current.productLines.push(line);
  }

  return groups.map(g=>{
    const merged = [];
    g.productLines.forEach(l=>{
      if(/^[\(（]/.test(l) && merged.length){ merged[merged.length-1] += ' ' + l; }
      else merged.push(l);
    });
    const candidateLines = merged.filter(l=>/[\(（0-9]/.test(l));
    const source = candidateLines.length ? candidateLines : merged;
    const records = source.map(extractPolicyLine);
    return {
      insurer: g.insurer,
      effective_date: g.effective_date,
      main: records[0] || {product_name:'未命名商品', payment_term:'', coverage_plan:''},
      riders: records.slice(1),
    };
  }).filter(g => g.riders.length || g.main.product_name !== '未命名商品');
}

const COVERAGE_PHASE_ORDER = ['醫療前期','醫療中期','醫療後期','身價'];
const COVERAGE_SUBGROUPS = ['🌟一次金','🏥醫療','⚡️意外','🌿長照','👼🏻身價'];
const COVERAGE_RULES = [
  ['醫療前期','🌟一次金', ['輕度癌症','重度癌症','特定癌症','癌症罹患金','初次罹癌','重大傷病','重大疾病','特定傷病','一次金','罹患金']],
  ['醫療前期','🏥醫療', ['病房費','住院補貼','住院雜費','住院特定手術','門診特定手術','癌症手術','癌症住院']],
  ['醫療中期','⚡️意外', ['意外實支實付','意外住院','意外骨折','意外醫療','意外傷害醫療']],
  ['醫療中期','🏥醫療', ['雜費實支實付','實支住院日額','實支住院手術','實支門診手術','定額住院日額','住院手術','門診手術','轉換病房日額','住院日額','實支實付','住院醫療','手術']],
  ['醫療後期','⚡️意外', ['意外失能金','意外失能月給付','意外失能']],
  ['醫療後期','🌿長照', ['長照失能一次金','長照失能扶助給付','長照','失能扶助','給付幾年','給付年期']],
  ['身價','👼🏻身價', ['一般身故','癌症身故','意外身故','身故']],
];
function classifyCoverageItem(label){
  for(const [phase, subgroup, keywords] of COVERAGE_RULES){
    if(keywords.some(k=>label.includes(k))) return {phase, subgroup};
  }
  return {phase:'', subgroup:''};
}

// 貼上保障內容時常會不小心多選到旁邊欄位（年期、保費、續保狀態、表格標題列等雜訊），
// 只保留「有金額」或「符合已知分類關鍵字」的行，其餘自動略過
function parseCoverageText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean)
    .filter(l => !/^(保險種類|繳費期間|保障期間|額度\/?計畫別|保費|保證續保|保障內容)/.test(l))
    .filter(l => !(l.includes('額度') && l.includes('保費') && l.includes('保障內容'))); // 整列表頭一起被選到的情況

  return lines.map(line=>{
    const clean = line.replace(/^[•・\-\u2022]\s*/, '');
    const m = clean.match(/^(.*?)[\s　]*([\d,]+(?:\.\d+)?\s*(?:萬|元))\s*$/);
    const category = m ? m[1].trim() : clean;
    const content = m ? m[2].trim() : '';
    const { phase, subgroup } = classifyCoverageItem(category);
    return { category, content, phase, subgroup, hasAmount: !!m };
  }).filter(item => (item.hasAmount && item.category) || item.phase);
}

// ---------- 一鍵貼上：保單內容＋各商品下方的保障項目 ----------
const SKIP_LINE_RE = /^(保險種類|繳費年期|繳費期間|保障期間|額度\/?計畫別|保費|年繳保費|保證續保|保障內容|保單內容)/;
function parseAnyPasteText(text){
  const rawLines = text.split('\n').map(l=>l.trim()).filter(Boolean).filter(l=>!SKIP_LINE_RE.test(l) && l!=='保證續保' && l!=='不保證續保');
  const groups = [];
  let cur = null;
  const newGroup = (date)=>{ cur = { effective_date: date||'', insurer:'', products:[], coverage:[] }; groups.push(cur); };
  const CODE_RE = /[\(（][A-Za-z0-9\/.]{2,12}[\)）]/;
  for(const line0 of rawLines){
    const line = line0.replace(/^[•・•]\s*/, '');
    const dm = line.match(/^(\d{2,3})\/(\d{2})\/(\d{2})$/);
    if(dm){ newGroup(`${parseInt(dm[1],10)+1911}-${dm[2]}-${dm[3]}`); continue; }
    if(!cur) newGroup('');
    const known = KNOWN_INSURERS.find(n=>line.includes(n));
    if(known && !CODE_RE.test(line) && line.length <= known.length+6){ cur.insurer = known; continue; }
    if(!cur.insurer && !/[\(（0-9]/.test(line) && !cur.products.length){ cur.insurer = line; continue; }
    if(CODE_RE.test(line)){ cur.products.push(extractPolicyLine(line)); continue; }
    if(/^[\(（]/.test(line) && cur.products.length){ // 換行接續的括號內容
      const last = cur.products[cur.products.length-1];
      const ex = extractPolicyLine('x'+line);
      if(!last.payment_term) last.payment_term = ex.payment_term;
      if(!last.coverage_plan) last.coverage_plan = ex.coverage_plan;
      continue;
    }
    const m = line.match(/^(.+?)[\s　]+([\d,]+(?:\.\d+)?\s*(?:萬|元))\s*$/);
    if(m && !/保費/.test(m[1])){
      const category = m[1].trim(), content = m[2].replace(/\s+/g,'');
      const {phase, subgroup} = classifyCoverageItem(category);
      cur.coverage.push({category, content, phase, subgroup});
      continue;
    }
    // 單獨一行的年期／保額：補到最近一個商品
    const last = cur.products[cur.products.length-1];
    if(last){
      if(!last.payment_term && /^(\d+\s*年期?|一年期|躉繳|終身|保障終身)$/.test(line)) { last.payment_term = line; continue; }
      if(!last.coverage_plan && /^\d+(?:\.\d+)?\s*(萬|單位)$/.test(line)) { last.coverage_plan = line; continue; }
    }
    // 其他（無金額且非已知格式）→ 略過
  }
  return groups.filter(g=>g.products.length || g.coverage.length).map(g=>({
    insurer: g.insurer || detectInsurerFromText(g.insurer),
    effective_date: g.effective_date,
    main: g.products[0] || {product_name:'未命名商品', payment_term:'', coverage_plan:''},
    riders: g.products.slice(1),
    coverage: g.coverage,
  }));
}

// 相同項目疊加：同分類＋同子分類＋同名稱，金額加總（只用於唯讀檢視）
function parseAmount(str){
  const m = String(str||'').replace(/,/g,'').match(/^(\d+(?:\.\d+)?)\s*(萬|元)$/);
  if(!m) return null;
  return { n: parseFloat(m[1]), unit: m[2] };
}
function mergeSameCategory(list){
  const map = new Map(); const out = [];
  list.forEach(c=>{
    const key = [c.phase||'', c.subgroup||'', (c.category||'').trim()].join('|');
    if(!map.has(key)){ const item = {...c, _parts:[c.content], _count:1}; map.set(key, item); out.push(item); }
    else { const it = map.get(key); it._parts.push(c.content); it._count++; }
  });
  out.forEach(it=>{
    if(it._count===1){ return; }
    const parsed = it._parts.map(parseAmount);
    if(parsed.every(Boolean)){
      const allWan = parsed.every(p=>p.unit==='萬');
      const total = allWan ? parsed.reduce((a,p)=>a+p.n,0) : parsed.reduce((a,p)=>a+(p.unit==='萬'?p.n*10000:p.n),0);
      const rounded = Math.round(total*100)/100;
      it.content = allWan ? `${rounded.toLocaleString('en-US')}萬` : `${rounded.toLocaleString('en-US')}元`;
    } else {
      it.content = it._parts.filter(Boolean).join(' + ');
    }
  });
  return out;
}

function groupCoverage(list){
  const groups = {};
  const seenOrder = [];
  list.forEach(item=>{
    const phase = item.phase || '其他';
    const subgroup = (item.subgroup || '').replace('☂️','🌿');
    if(!groups[phase]){ groups[phase] = {}; seenOrder.push(phase); }
    if(!groups[phase][subgroup]) groups[phase][subgroup] = [];
    groups[phase][subgroup].push(item);
  });
  const orderedPhases = [...COVERAGE_PHASE_ORDER.filter(p=>groups[p]), ...seenOrder.filter(p=>!COVERAGE_PHASE_ORDER.includes(p))];
  return orderedPhases.map(phase=>{
    const subs = groups[phase]; const sorted = {};
    [...COVERAGE_SUBGROUPS, ''].forEach(k=>{ if(subs[k]) sorted[k]=subs[k]; });
    Object.keys(subs).forEach(k=>{ if(!sorted[k]) sorted[k]=subs[k]; });
    return { phase, subgroups: sorted };
  });
}

function computeGaps(coverage, policies, ridersByPolicy){
  const texts = [];
  (coverage||[]).forEach(c=>texts.push(String(c.category||'')));
  (policies||[]).forEach(p=>{
    texts.push(String(p.product_name||''));
    ((ridersByPolicy||{})[p.id]||[]).forEach(r=>texts.push(String(r.product_name||'')));
  });
  const items = GAP_ITEMS.map(g=>({ ...g, covered: texts.some(t=>g.test(t)) }));
  const done = items.filter(i=>i.covered).length;
  return { items, done, total: items.length, pct: Math.round(done/items.length*100) };
}
function ringSvg(pct){
  const r=54, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg viewBox="0 0 140 140" class="ring-svg" aria-hidden="true">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9D56E"/><stop offset="1" stop-color="#F29A2E"/></linearGradient></defs>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="#DADDE4" stroke-width="12"/>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 70 70)"/>
  </svg>`;
}
async function sendGapMessage(missing, btn){

function openMemoryGame(){
  const icons=['🌟','🏥','⚡️','🌿','🛡️','🏝️'];
  const deck=[...icons,...icons].map(v=>({v,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.v);
  let open=[], matched=new Set(), moves=0, lock=false;
  renderModal(`
    <div class="modal-title">保障翻翻樂</div>
    <div class="hint" style="margin:-8px 0 14px;">翻開兩張相同的圖案就算配對成功</div>
    <div class="memo-grid" id="memo"></div>
    <div class="game-stat" id="memo-stat"></div>
    <button class="btn btn-primary" id="memo-again" style="margin-top:14px;">重新洗牌</button>`);
  const grid=document.getElementById('memo'), stat=document.getElementById('memo-stat');
  function draw(){
    grid.innerHTML = deck.map((v,i)=>{
      const on = open.includes(i)||matched.has(i);
      return `<button class="memo-card ${on?'on':''} ${matched.has(i)?'done':''}" data-i="${i}">${on?v:''}</button>`;
    }).join('');
    stat.textContent = matched.size===deck.length ? `全部配對完成！共 ${moves} 步 🎉` : `步數 ${moves}`;
    grid.querySelectorAll('.memo-card').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      if(lock||open.includes(i)||matched.has(i)) return;
      open.push(i);
      if(open.length===2){
        moves++;
        const [a,c]=open;
        if(deck[a]===deck[c]){ matched.add(a); matched.add(c); open=[]; }
        else { lock=true; draw(); setTimeout(()=>{ open=[]; lock=false; draw(); }, 700); return; }
      }
      draw();
    });
  }
  document.getElementById('memo-again').onclick=()=>openMemoryGame();
  draw();
}
function openCatchGame(){
  renderModal(`

    <div class="hint" style="margin:-8px 0 12px;">手指左右滑動，用小島接住 🍀，閃開 ⚡️。共 3 條命，30 秒。</div>
    <div class="catch-area" id="catch">
      <div class="catch-hud"><span id="c-score">得分 0</span><span id="c-life">❤️❤️❤️</span><span id="c-time">30</span></div>
      <div class="catcher" id="catcher">🏝️</div>
    </div>
    <div class="game-stat" id="c-result"></div>
    <button class="btn btn-primary" id="c-start" style="margin-top:12px;">開始</button>`);
  const area=document.getElementById('catch'), catcher=document.getElementById('catcher');
  const $score=document.getElementById('c-score'), $life=document.getElementById('c-life'), $time=document.getElementById('c-time'), $res=document.getElementById('c-result');
  let running=false, raf=0, score=0, lives=3, items=[], px=0.5, last=0, spawn=0, timeLeft=30, tick=0;
  const setX=(clientX)=>{ const r=area.getBoundingClientRect(); px=Math.min(1,Math.max(0,(clientX-r.left)/r.width)); catcher.style.left=(px*100)+'%'; };
  area.addEventListener('touchmove',e=>{ setX(e.touches[0].clientX); e.preventDefault(); },{passive:false});
  area.addEventListener('touchstart',e=>setX(e.touches[0].clientX),{passive:true});
  area.addEventListener('mousemove',e=>setX(e.clientX));
  function end(){
    running=false; cancelAnimationFrame(raf); items.forEach(i=>i.el.remove()); items=[];
    let best=0; try{ best=+localStorage.getItem('catchBest')||0; if(score>best){ best=score; localStorage.setItem('catchBest',String(best)); } }catch(e){}
    $res.textContent = `本局得分 ${score}${best?`・最佳 ${best}`:''}`;
    document.getElementById('c-start').textContent='再玩一次'; document.getElementById('c-start').disabled=false;
  }
  function frame(t){
    if(!running) return;
    const dt=Math.min(40,t-last); last=t;
    tick+=dt; if(tick>=1000){ tick-=1000; timeLeft--; $time.textContent=timeLeft; if(timeLeft<=0) return end(); }
    spawn-=dt;
    if(spawn<=0){
      spawn=520+Math.random()*420;
      const bad=Math.random()<0.32;
      const el=document.createElement('div'); el.className='fall'; el.textContent=bad?'⚡️':'🍀';
      const x=0.08+Math.random()*0.84; el.style.left=(x*100)+'%'; area.appendChild(el);
      items.push({el,x,y:-30,bad,v:0.11+Math.random()*0.07});
    }
    const h=area.clientHeight, w=area.clientWidth;
    for(let i=items.length-1;i>=0;i--){
      const it=items[i]; it.y+=it.v*dt; it.el.style.top=it.y+'px';
      if(it.y>h-70 && it.y<h-20 && Math.abs(it.x-px)*w<38){
        if(it.bad){ lives--; $life.textContent='❤️'.repeat(Math.max(lives,0))||'💔'; catcher.classList.add('hit'); setTimeout(()=>catcher.classList.remove('hit'),250); }
        else { score++; $score.textContent='得分 '+score; }
        it.el.remove(); items.splice(i,1);
        if(lives<=0) return end();
      } else if(it.y>h){ it.el.remove(); items.splice(i,1); }
    }
    raf=requestAnimationFrame(frame);
  }
  document.getElementById('c-start').onclick=(e)=>{
    items.forEach(i=>i.el.remove()); items=[]; score=0; lives=3; timeLeft=30; tick=0; spawn=300; $res.textContent='';
    $score.textContent='得分 0'; $life.textContent='❤️❤️❤️'; $time.textContent='30';
    e.target.disabled=true; running=true; last=performance.now(); raf=requestAnimationFrame(frame);
  };
  window.__gameCleanup=()=>{ running=false; cancelAnimationFrame(raf); };
}

  btn.onclick=()=>{

}

// ---------- 保障內容顯示：非一次性給付加「最高」 ----------
function covCleanLabel(cat){
  return String(cat||'').trim().replace(/[（(]最高[）)]/g,'').replace(/[（(]一次金[）)]/g,'').replace(/[（(]每次[）)]/g,'').replace(/[（(]每月[）)]/g,'');
}
function covUnitSuffix(cat, content){
  if(/\/\s*(日|次|月)/.test(content||'')) return '';
  const c=String(cat||'');
  if(/[（(]每次[）)]/.test(c)) return '/次';
  if(/[（(]每月[）)]|每月/.test(c)) return '/月';
  if(/日額|病房費/.test(c)) return '/日';
  return '';
}
function covIsNonLump(cat){
  const c=String(cat||'');
  if(/扶助|每月|月給付|日額|實支|雜費|手術|醫療限額|骨折|住院|病房|門診|療程|補貼/.test(c)) return true;
  return !/重大傷病|重大疾病|輕度癌症|重度癌症|癌症罹患|身故|失能金|燒燙傷|一次金|罹患金/.test(c);
}
function covValueText(cat, content){
  const v=String(content||'').trim(); if(!v) return '';
  const unit=covUnitSuffix(cat, v);
  const fixedDaily = /日額/.test(cat) && !/實支/.test(cat);
  if(covIsNonLump(cat) && !fixedDaily && !/^最高/.test(v)) return `最高 ${v}${unit}`;
  return v+unit;
}
function covFormatWan(content){
  const p=parseAmount(content);
  if(p && p.unit==='元' && p.n>=10000) return `${Math.round(p.n/100)/100}萬`;
  return content;
}
const COV_ORDER=[/重大傷病/,/重大疾病/,/癌症罹患|輕度癌症|重度癌症/,/燒燙傷/,/^疾病身故/,/^意外身故/,/癌症身故/,/失能金/,/扶助/,/醫療限額|骨折/,/病房費|日額|補貼/,/特定手術/,/手術/,/雜費/,/癌症/];
function covRank(label){ const i=COV_ORDER.findIndex(r=>r.test(label)); return i<0?99:i; }
function renderCoverageTotal(list){
  if(!list.length) return `<div class="empty" style="padding:20px;">尚未新增保障內容</div>`;
  const prepared = list.map(c=>({ category: covCleanLabel(c.category), content: String(c.content||'').trim(), _orig:c.category, phase:'', subgroup:'' }));
  const merged = mergeSameCategory(prepared).map(m=>({...m, content: covFormatWan(m.content)}));
  // 同名但原始標示不同（例如日額、每月）要保留單位判斷：以原始分類的第一筆為準
  const origByLabel = {}; prepared.forEach(p=>{ if(!origByLabel[p.category]) origByLabel[p.category]=p._orig; });
  merged.sort((a,b)=>covRank(a.category)-covRank(b.category));
  const GROUPS=[
    ['一次金', /重大傷病|重大疾病|^重大燒燙傷/],
    ['癌症',   /癌症/],
    ['醫療',   /住院|病房|手術|雜費|門診|補貼|轉換/],
    ['意外',   /意外|骨折/],
    ['長照／失能', /長照|失能|扶助/],
    ['壽險',   /身故/],
  ];
  const groupOf = label => { if(/長照|失能|扶助/.test(label)) return '長照／失能'; if(/身故/.test(label)) return /^意外/.test(label)?'意外':'壽險'; if(/重大傷病|輕度癌症|重度癌症|癌症罹患/.test(label)) return '一次金'; if(/癌症/.test(label)) return '癌症'; if(GROUPS[0][1].test(label)) return '一次金'; if(/^意外|骨折/.test(label)) return '意外'; if(GROUPS[2][1].test(label)) return '醫療'; return '其他'; };
  const buckets = new Map(GROUPS.map(g=>[g[0],[]])); buckets.set('其他',[]);
  merged.forEach(m=>buckets.get(groupOf(m.category)).push(m));
  const line = m=>`<div class="item-line"><div class="label">${esc(m.category)}</div><span class="amount">${esc(covValueText(origByLabel[m.category]||m.category, m.content))}</span></div>`;
  return `<div class="card total-card">
    ${[...buckets.entries()].filter(([,arr])=>arr.length).map(([g,arr])=>{ if(g==='癌症'){ const o=['罹患','住院','手術','放化療','門診']; arr.sort((a,b)=>o.findIndex(k=>a.category.includes(k))-o.findIndex(k=>b.category.includes(k))); return `<div class="cov-group"><span class="cov-group-bar"></span>癌症治療</div>${arr.map(line).join('')}`; } if(g==='一次金'){ arr.sort((a,b)=>(/重大傷病/.test(b.category)?1:0)-(/重大傷病/.test(a.category)?1:0)); } return `<div class="cov-group"><span class="cov-group-bar"></span>${g}</div>${arr.map(line).join('')}`; }).join('')}
    <div class="hint" style="margin-top:12px;line-height:1.7;">「最高」表示非一次性給付（如實支實付、手術、醫療限額），依實際住院或醫療狀況給付，以此為上限。</div>
  </div>`;
}
function renderCoverageGrouped(list, editable){
  if(!list.length) return `<div class="empty" style="padding:20px;">尚未新增保障內容</div>`;
  const groups = new Map();
  list.forEach(c=>{ const k=c.source||'保障內容'; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(c); });
  return [...groups.entries()].map(([src, items])=>`
    <div class="card" style="margin-bottom:16px;">
      <div class="cov-src">${esc(src)}</div>
      ${items.map(c=>`
        <div class="item-line">
          <div class="label">${esc(covCleanLabel(c.category))}</div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="amount">${esc(covValueText(c.category, c.content))}</span>
            ${editable ? `<span style="cursor:pointer;color:var(--ink-soft);" data-edit-cov="${c.id}">✎</span>
            <span style="cursor:pointer;color:var(--danger);" data-del-cov="${c.id}">✕</span>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

  const digits = phone.replace(/\D/g,'');

async function handleClientPhoneSubmit(e){
  e.preventDefault();
  const phone = document.getElementById('c-phone').value.trim();
  const code = document.getElementById('c-code').value.trim().toUpperCase();
  if(!phone){ return; }
  state.clientPhoneCache = phone;
  const { email, password } = phoneToCreds(phone);
  const btn = document.getElementById('client-phone-submit');
  btn.disabled = true; btn.textContent = '登入中…';

  // 先試著直接登入（已開通過的客戶）
  const { error: signInErr } = await sb.auth.signInWithPassword({ email, password });
  if(!signInErr){ return; } // afterAuthChange 會自動導向

  btn.disabled = false; btn.textContent = '登入';
  if(!code){ setMsg('error', '第一次使用，請輸入業務提供的邀請碼'); return; }

  // 第一次使用：用邀請碼開通
  btn.disabled = true; btn.textContent = '開通中…';
  const { error } = await sb.auth.signUp({ email, password, options:{ data:{ invite_code: code, display_name: '客戶' } } });
  if(error){ btn.disabled = false; btn.textContent = '登入'; setMsg('error', '開通失敗，請確認邀請碼是否正確'); return; }
  const { error: err2 } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = '登入';
  if(err2){ setMsg('error', '開通成功，但自動登入失敗，請再按一次登入'); }
}

const BACKUP_TABLES = ['clients','policies','policy_riders','coverage_summary','messages','referrals'];
async function exportBackup(){
  const out = { version:1, exported_at:new Date().toISOString(), tables:{} };
  for(const t of BACKUP_TABLES){
    const { data, error } = await sb.from(t).select('*');
    if(error){ setMsg('error', `匯出失敗：${t}`); return; }
    out.tables[t] = data || [];
  }
  const blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `保單備份_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setMsg('ok', '備份已下載');
}
async function importBackupFile(file){
  try{
    const obj = JSON.parse(await file.text());
    if(!obj || obj.version!==1 || !obj.tables) throw new Error('格式不符');
    for(const t of BACKUP_TABLES){
      const rows = obj.tables[t] || [];
      if(!rows.length) continue;
      for(let i=0;i<rows.length;i+=200){
        const { error } = await sb.from(t).upsert(rows.slice(i,i+200), { onConflict:'id' });
        if(error) throw new Error(`${t}：${error.message}`);
      }
    }
    await loadClients(); await loadAdminInbox();
    setMsg('ok', '備份已匯入');
  }catch(e){ setMsg('error', '匯入失敗：' + e.message); }
}

    await sb.from('ins_family_links').delete().eq('id', el.dataset.famDel);
    state.adminFamily = await loadFamily(state.activeClientId); render();
  });
  document.getElementById('paste-parse').onclick = ()=>{
    const txt = document.getElementById('paste-area').value;
    if(!txt.trim()) return;

    if(!groups.length){ setMsg('error','沒有解析到內容，請確認貼上的文字'); return; }
    state.parsedMultiBatches = groups;
    state.parsedBatch = null;
    render();
  };
  app.querySelectorAll('[data-edit-policy]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const p = state.policies.find(x=>x.id===el.dataset.editPolicy);

    state.activePolicyId = el.dataset.viewPolicy;

// 依民國日期切分出的多張保單：共用同一個建立函式
async function createPolicyFromBatch(b){
  const { data: policy, error } = await sb.from('ins_policies').insert({
    client_id: state.activeClientId,
    insurer: b.insurer || '',
    product_name: b.main.product_name.trim(),
    effective_date: b.effective_date || b.main.effective_date || null,
    status: b.status || '有效',
    payment_term: b.main.payment_term.trim(),
    coverage_plan: b.main.coverage_plan.trim(),
  }).select().single();
  if(error || !policy) return false;
  const validRiders = b.riders.filter(r=>r.product_name.trim());
  if(validRiders.length){
    await sb.from('ins_policy_riders').insert(validRiders.map((r,i)=>({
      policy_id: policy.id, product_name: r.product_name.trim(),
      payment_term: r.payment_term.trim(), coverage_plan: r.coverage_plan.trim(), sort_order: i
    })));
  }
  if((b.coverage||[]).length){
    await sb.from('ins_coverage_summary').insert(b.coverage.map((c,i)=>({
      client_id: state.activeClientId, policy_id: policy.id,
      category: c.category, content: c.content,
      phase: c.phase||null, subgroup: c.subgroup||null, sort_order: i
    })));
  }
  return true;
}

      const gi = parseInt(el.closest('[data-batch-idx]').dataset.batchIdx,10);
      const b = state.parsedMultiBatches[gi];
      const f = el.dataset.mbField;
      if(f==='insurer') b.insurer = el.value;
      else if(f==='effective_date') b.effective_date = el.value;
      else if(f==='status') b.status = el.value;
      else if(f==='main_name') b.main.product_name = el.value;
      else if(f==='main_term') b.main.payment_term = el.value;
      else if(f==='main_plan') b.main.coverage_plan = el.value;
    };
    el.oninput = handler; el.onchange = handler;
  });
  app.querySelectorAll('[data-mb-create]').forEach(el=>{
    el.onclick = async ()=>{
      const gi = parseInt(el.dataset.mbCreate,10);
      const b = state.parsedMultiBatches[gi];
      if(!b.main.product_name.trim()) return;
      await createPolicyFromBatch(b);
      state.parsedMultiBatches.splice(gi,1);
      await loadClientPolicies(state.activeClientId);
      render();

  app.querySelectorAll('[data-mb-skip]').forEach(el=>{

      state.parsedMultiBatches.splice(gi,1);
      render();

  const allBtn = document.getElementById('mb-create-all');
  if(allBtn) allBtn.onclick = async ()=>{
    for(const b of state.parsedMultiBatches){
      if(b.main.product_name.trim()){ await createPolicyFromBatch(b); }

    render();
  };
}

      product_name: name,
      effective_date: document.getElementById('pf-date').value || null,
      status: document.getElementById('pf-status').value,
      payment_term: document.getElementById('pf-term').value.trim(),
      coverage_plan: document.getElementById('pf-plan').value.trim(),
    };
    let policyId = policy?.id;
    if(policy){
      await sb.from('ins_policies').update(payload).eq('id', policy.id);
      await sb.from('ins_policy_riders').delete().eq('policy_id', policy.id);
    } else {
      const { data: inserted } = await sb.from('ins_policies').insert({...payload, client_id: state.activeClientId}).select().single();
      policyId = inserted?.id;
    }
    const validRiders = state.draftRiders.filter(r=>r.product_name.trim());
    if(policyId && validRiders.length){
      await sb.from('ins_policy_riders').insert(validRiders.map((r,i)=>({
        policy_id: policyId, product_name: r.product_name.trim(),
        payment_term: r.payment_term.trim(), coverage_plan: r.coverage_plan.trim(), sort_order: i
      })));
    }
    closeModal();
    await loadClientPolicies(state.activeClientId);
    render();
  };
}
function renderDraftRiders(){
  const wrap = document.getElementById('pf-riders');
  wrap.innerHTML = state.draftRiders.map((r,i)=>`
    <div class="item-row" style="flex-wrap:wrap;align-items:flex-start;">
      <input placeholder="附約商品名稱" data-rf="product_name" data-i="${i}" style="flex:1 1 100%;margin-bottom:6px;" value="${esc(r.product_name)}">
      <input placeholder="年期" data-rf="payment_term" data-i="${i}" style="max-width:90px;" value="${esc(r.payment_term)}">
      <input placeholder="保額" data-rf="coverage_plan" data-i="${i}" style="max-width:90px;" value="${esc(r.coverage_plan)}">
      <span class="rm" data-rup="${i}" style="${i===0?'opacity:.25;':''}">▲</span>
      <span class="rm" data-rdn="${i}" style="${i===state.draftRiders.length-1?'opacity:.25;':''}">▼</span>
      <span class="rm" data-rrm="${i}">✕</span>
    </div>
  `).join('');
  const mv=(i,d)=>{ const j=i+d; if(j<0||j>=state.draftRiders.length) return; [state.draftRiders[i],state.draftRiders[j]]=[state.draftRiders[j],state.draftRiders[i]]; renderDraftRiders(); };
  wrap.querySelectorAll('[data-rup]').forEach(el=>el.onclick=()=>mv(parseInt(el.dataset.rup,10),-1));
  wrap.querySelectorAll('[data-rdn]').forEach(el=>el.onclick=()=>mv(parseInt(el.dataset.rdn,10),1));
  wrap.querySelectorAll('[data-rf]').forEach(el=>{
    el.oninput = ()=>{ state.draftRiders[el.dataset.i][el.dataset.rf] = el.value; };
  });
  wrap.querySelectorAll('[data-rrm]').forEach(el=>{
    el.onclick = ()=>{ state.draftRiders.splice(parseInt(el.dataset.rrm,10),1); renderDraftRiders(); };
  });
}

  `;
  document.getElementById('back').onclick = ()=>{ state.view='client-home'; render(); };
}

// ---------- generic modal ----------
function renderModal(innerHtml){
  if(window.__gameCleanup){ try{ window.__gameCleanup(); }catch(e){} window.__gameCleanup=null; }
  const existing = document.getElementById('modal-root');
  if(existing) existing.remove();
  const wrap = document.createElement('div');
  wrap.id = 'modal-root';
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `<div class="modal"><div class="modal-handle"></div><button class="modal-close" id="modal-x" aria-label="關閉">✕</button>${innerHtml}</div>`;
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap) closeModal(); });
  const xb=wrap.querySelector('#modal-x'); if(xb) xb.onclick=closeModal;
  document.body.appendChild(wrap);
}
function closeModal(){
  if(window.__gameCleanup){ try{ window.__gameCleanup(); }catch(e){} window.__gameCleanup=null; }
  const existing = document.getElementById('modal-root');
  if(existing) existing.remove();
}

render();
</script>
