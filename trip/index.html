<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅行手帳</title>
<meta name="theme-color" content="#fbf3ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅行手帳">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, homey travel notebook — cream paper, caramel buttons, soft round cards
   IDEA: a bakery-warm keepsake journal that becomes a memory book after the trip
   PICTURE: colourful flat SVG scene of each destination with gentle motion + floating info chips
   COLOUR and TYPE: cream #fbf3ea, caramel #c8793f, brown ink; scene uses many soft colours; Noto Sans TC + Nunito numbers
   LAYOUT: fixed pill menu on top, one column of white rounded cards, bottom sheet for editing */
:root{--bg:#fbf3ea;--bg2:#f6e8d8;--card:#fffaf5;--ink:#4a3426;--mute:#9a8170;--line:#efdfcd;--pri:#c8793f;--pri2:#f6e1cb;--pri3:#fdf0e2;--ok:#7fb08f;--must:#e2725b;--sh:0 6px 20px rgba(150,95,50,.09)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
html{background:var(--bg);scroll-padding-top:130px}
body{color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip;min-height:100vh;background:radial-gradient(90% 40% at 100% 0,#f9e6d2,transparent 70%),var(--bg);-webkit-tap-highlight-color:transparent}
.num{font-family:Nunito,"Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
header{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:rgba(251,243,234,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hrow{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:8px}
.logo{flex:none;width:38px;height:38px;border-radius:50%;background:var(--pri2);display:grid;place-items:center;color:var(--pri)}
.tripbtn{flex:1;justify-content:flex-start;background:none!important;border:0!important;padding:4px!important;text-align:left;box-shadow:none!important}
.tripbtn b{display:block;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.tripbtn small{display:block;font-size:11px;color:var(--mute);letter-spacing:.06em;font-family:Nunito,sans-serif;font-weight:700}
.tabs{max-width:600px;margin:8px auto 0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex-direction:column;gap:1px;min-height:52px;padding:5px 0;white-space:nowrap;border-radius:16px;font-size:12px;background:none;border:0;color:var(--mute);box-shadow:none}
.tabs button.on{background:var(--pri2);color:var(--pri);font-weight:700}
.tabs button.sos{color:#c9543f}
.wrap{max-width:600px;margin:0 auto;padding:calc(132px + env(safe-area-inset-top)) 16px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
h1{font-size:clamp(28px,8vw,38px);line-height:1.15;margin:6px 0 4px;font-weight:900;text-wrap:balance}
h1 .hl{background:linear-gradient(transparent 62%,#f6d2ad 62%)}
h2{font-size:17px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px}
h2 .r{margin-left:auto;font-size:13px;color:var(--mute);font-weight:500}
h2 .dot{width:30px;height:30px;border-radius:50%;background:var(--pri2);color:var(--pri);display:grid;place-items:center;flex:none}
h2 .dot svg{width:17px;height:17px}
.pagehead{margin:4px 2px 14px}.pagehead h1{font-size:28px}
.mute{color:var(--mute);font-size:14px}.small{font-size:13px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:13px;padding:3px 11px;border-radius:99px;background:var(--pri3);border:1px solid var(--line);white-space:nowrap;color:#7a5a43}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--pri);box-shadow:var(--sh)}
.hero{padding:0;overflow:hidden}
.sc{position:relative;background:var(--bg2)}
.scene{display:block;width:100%;height:auto;aspect-ratio:16/10}
.float{position:absolute;display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:7px 12px;box-shadow:0 6px 18px rgba(120,70,30,.16);font-size:12px;line-height:1.3}
.float b{display:block;font-size:13px}
.float .fi{width:28px;height:28px;border-radius:50%;background:var(--pri2);color:var(--pri);display:grid;place-items:center;flex:none}
.float .fi svg{width:15px;height:15px}
.f1{left:12px;top:12px}.f2{right:12px;bottom:12px}
.hero .in{padding:16px 18px 18px}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 6px}
.cd div,.stat div{text-align:center;padding:10px 0;border-radius:18px;background:var(--pri3);border:1px solid var(--line)}
.cd div:first-child{background:var(--pri);color:#fff;border-color:var(--pri)}
.cd div:first-child span{color:#fde7d2}
.cd b{display:block;font:800 clamp(24px,7vw,32px)/1.1 Nunito,sans-serif}
.cd span,.stat span{font-size:13px;color:var(--mute)}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat b{display:block;font:800 24px/1.2 Nunito,"Noto Sans TC",sans-serif}
.flight{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.flight .t{font:800 clamp(26px,7vw,32px)/1 Nunito,sans-serif}
.flight .c{font-size:13px;color:var(--mute);margin-top:4px}
.arc{position:relative;height:34px;text-align:center;font-size:13px;color:var(--mute)}
.arc:before{content:"";position:absolute;left:6px;right:6px;top:12px;border-top:1.5px dashed #e3c9ae}
.arc svg{position:relative;background:var(--card);color:var(--pri)}
.fl+.fl{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:3px 11px;border-radius:99px;background:#fde3d3;color:#b5603a;margin-bottom:10px}
.tag.back{background:#dcebf5;color:#4a7495}
ul.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.chk li:last-child{border:0}
.chk .hit{display:flex;gap:12px;flex:1;justify-content:flex-start;background:none;border:0;padding:4px 0;min-height:36px;text-align:left;font-size:16px;color:var(--ink);box-shadow:none}
.chk .hit[disabled]{cursor:default}
.box{flex:none;width:22px;height:22px;border-radius:8px;border:2px solid #e0c6ab;display:grid;place-items:center;margin-top:2px;background:#fff}
.hit.on .box{background:var(--ok);border-color:var(--ok)}
.hit.on .box:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.hit.on .tx{color:var(--mute);text-decoration:line-through}
.bar{height:8px;border-radius:9px;background:var(--pri3);overflow:hidden;margin-bottom:8px;border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .4s}
.addrow{display:flex;gap:8px;margin-top:10px}.addrow input{flex:1}
button,.btn{font:inherit;color:var(--pri);background:#fff;border:1.5px solid #ecd3b9;border-radius:99px;padding:9px 16px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700}
button.pri,.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 6px 14px rgba(200,121,63,.3)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f1b98a;outline-offset:2px}
.sm{min-height:34px!important;padding:5px 12px!important;font-size:13px!important}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin-bottom:6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;flex-direction:column;gap:0;padding:8px 16px;border-radius:18px;line-height:1.25;color:var(--ink);font-weight:700}
.days button small{font-size:12px;color:var(--mute);font-weight:500}
.days button.on{background:var(--pri);border-color:var(--pri);color:#fff;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.days button.on small{color:#fde7d2}
@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}
.bounce{animation:bounce .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes bounce{0%{transform:translateY(22px);opacity:.2}60%{transform:translateY(-6px);opacity:1}100%{transform:none}}
.tl{position:relative;padding-left:58px}
.tl:before{content:"";position:absolute;left:48px;top:12px;bottom:12px;border-left:2px dashed #e6cdb2}
.ev{position:relative;margin-bottom:10px}
.ev .tm{position:absolute;left:-62px;width:40px;text-align:right;font:800 15px Nunito,sans-serif;top:15px;white-space:nowrap}
.ev:before{content:"";position:absolute;left:-15px;top:20px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--pri)}
.ev.must:before{border-color:var(--must);background:#fde3dc}
.ev .card{margin:0;padding:14px}
.ev.must .card{border-color:#f3c2b6;background:#fffaf8}
.ev .hd{display:flex;align-items:flex-start;gap:8px}.ev .hd b{font-weight:700;flex:1}
.mustb{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px;background:var(--must);color:#fff;margin-right:6px;vertical-align:2px}
.mv{margin:0 0 10px -6px}
.mode{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:3px 11px 3px 8px;border-radius:99px;white-space:nowrap}
.mode svg{width:15px;height:15px}
.place{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.place:last-child{border:0}.place .ic{flex:none;width:42px;height:42px;border-radius:14px;background:var(--pri3);color:var(--pri);display:grid;place-items:center}
.place .acts{margin-left:auto;display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid a{flex-direction:column;gap:4px;padding:12px 2px;border-radius:18px;font-size:13px;color:var(--ink);font-weight:500}
.grid a svg{color:var(--pri)}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.row:last-child{border:0}.row>span:first-child{color:var(--mute)}.row>span:last-child{text-align:right}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;width:100%}
textarea{min-height:96px;resize:vertical}
input::placeholder,textarea::placeholder{color:#c4ad9a}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--must)}
.conv{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.big{font:800 clamp(26px,8vw,34px)/1.2 Nunito,"Noto Sans TC",sans-serif;color:var(--pri)}
.qr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.qr img{width:100%;border-radius:14px;border:1px solid var(--line)}
.sos a{justify-content:space-between;width:100%;margin-bottom:8px;font-size:16px;border-radius:18px;color:var(--ink)}
.sos a b{font:800 20px Nunito,sans-serif;color:#c9543f}
.memo{white-space:pre-wrap;font-size:15px;line-height:1.8;background:var(--pri3);border-radius:16px;padding:12px 14px;margin-top:10px;border:1px dashed #e8cdb0}
.page .dn{font:800 13px Nunito,sans-serif;color:var(--pri);letter-spacing:.04em}
.page ol{margin:8px 0 0;padding-left:20px;font-size:15px}
.empty{text-align:center;padding:26px 18px}
.member{background:var(--pri);color:#fff;border-color:var(--pri)}
.member .small{color:#fde7d2}
.edit{display:none!important}body.editing .edit{display:inline-flex!important}
.editb{display:none!important}body.editing .editb{display:flex!important}
.acts2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.acts2>*{flex:1}
#sheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(74,52,38,.35)}
#sheet.open{display:flex}
#sheet .pane{width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));background:var(--bg);animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.f{display:block;margin-bottom:12px}.f>span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fchk{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:44px}
.warn{color:var(--must);font-size:13px;margin:-6px 0 10px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;display:none;max-width:90vw;text-align:center}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.view{display:none}.view.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
/* scene motion */
.scene .drift{animation:drift 14s ease-in-out infinite alternate}
.scene .drift2{animation:drift 20s ease-in-out infinite alternate-reverse}
.scene .fly{animation:fly 16s linear infinite}
.scene .ride{animation:ride 10s linear infinite}
.scene .bob{animation:bob 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.scene .wave{animation:wave 4s ease-in-out infinite alternate}
.scene .sway{animation:sway 3.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.scene .glow{animation:glow 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.scene .swing{animation:swing 9s ease-in-out infinite alternate}
.scene .fall{animation:fall 7s linear infinite}
.scene .steam{animation:steam 3s ease-in-out infinite}
.scene .float2{animation:bob 2.6s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
@keyframes fly{from{transform:translate(-80px,30px)}to{transform:translate(460px,-30px)}}
@keyframes ride{from{transform:translateX(-240px)}to{transform:translateX(440px)}}
@keyframes bob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(5px) rotate(2deg)}}
@keyframes wave{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.1)}}
@keyframes swing{from{transform:translate(0,0)}to{transform:translate(170px,-52px)}}
@keyframes fall{from{transform:translate(0,-20px) rotate(0)}to{transform:translate(-40px,240px) rotate(300deg)}}
@keyframes steam{0%{transform:translateY(0);opacity:0}40%{opacity:.8}100%{transform:translateY(-16px);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
 <div class="hrow">
  <span class="logo"><svg class="i"><use href="#i-plane"/></svg></span>
  <button class="tripbtn" id="tripBtn" aria-label="切換旅程"><span style="min-width:0"><b id="tripTitle">旅行手帳</b><small>TRAVEL NOTEBOOK</small></span><svg class="i" style="width:16px;color:var(--mute)"><use href="#i-down"/></svg></button>
  <button id="editToggle" class="sm" style="display:none"><svg class="i"><use href="#i-pen"/></svg><span>編輯</span></button>
 </div>
 <nav class="tabs" id="tabs"></nav>
</header>

<div class="wrap">
 <section class="view" id="v-home"></section>
 <section class="view" id="v-plan"><div class="days" id="dayBtns"></div><div id="dayBody"></div></section>
 <section class="view" id="v-eat"></section>
 <section class="view" id="v-list"></section>
 <section class="view" id="v-tool"></section>
 <section class="view" id="v-info"></section>
 <section class="view" id="v-sos"></section>
</div>

<div id="sheet" role="dialog" aria-modal="true"><div class="pane" id="pane"></div></div>
<div id="toast" role="status"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-plane" viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></symbol>
 <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
 <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16"/></symbol>
 <symbol id="i-bowl" viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-18 0zM8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></symbol>
 <symbol id="i-check" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12 3 3 5-6"/></symbol>
 <symbol id="i-tool" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></symbol>
 <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></symbol>
 <symbol id="i-sos" viewBox="0 0 24 24"><path d="M12 3 2 20h20zM12 10v4M12 17v.01"/></symbol>
 <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
 <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
 <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
 <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3M21 14v.01M14 21h7v-4"/></symbol>
 <symbol id="i-bed" viewBox="0 0 24 24"><path d="M3 19V6M3 15h18v4M21 15v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="11" r="2"/></symbol>
 <symbol id="i-map" viewBox="0 0 24 24"><path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/></symbol>
 <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></symbol>
 <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
 <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
 <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
 <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
 <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>

 const n=Math.max(1,diffDays(t.start,t.end)+1);t.days=t.days||[];while(t.days.length<n)t.days.push({title:"",weather:"",items:[],memo:""});t.days.length=n;return t}

const queue={};
async function save(id){const t=trips[id];if(!t)return;t.updated=Date.now();render();
 const q=queue[id]||(queue[id]={busy:false,again:false});if(q.busy){q.again=true;return}q.busy=true;saving++;
 try{do{q.again=false;await rpc("trip_save",{p_pass:pass,p_id:id,p_data:trips[id]})}while(q.again)}
 catch(e){toast(e.message==="bad pass"?"密碼失效，請重新解鎖":"沒有存到，請檢查網路")}
 finally{q.busy=false;saving--}}

 const up=list.filter(([,t])=>t.end>=td).sort((a,b)=>a[1].start.localeCompare(b[1].start));if(up.length)return up[0][0];

 if(!t){renderEmpty();showView();return}
 fill(t);
 if(dayIdx==null||dayIdx>=t.days.length){dayIdx=statusOf(t)==="during"?diffDays(t.start,todayTW()):0}
 renderHome(t);renderPlan(t);renderEat(t);renderList(t);renderTool(t);renderInfo(t);renderSos(t);showView();
}

 <div class="acts2">${canEdit?`<button class="pri" data-act="newTrip">${ic("i-plus")}新增旅程</button><button data-act="howImport">${ic("i-up")}匯入行程表</button>`:loaded?`<button data-act="unlock">${ic("i-lock")}我是主揪，輸入密碼</button>`:""}</div></div></div>`;

function departAt(t){const f=t.flights.find(f=>f.dir!=="回程")||{};const d=f.date||t.start;return{when:new Date(`${d}T${f.dep||"00:00"}:00+08:00`),f}}
function tick(){const t=T(),el=$("#cd");if(!t||!el)return;const{when,f}=departAt(t);const s=Math.floor(Math.max(0,when-new Date())/1e3);
 const b=el.querySelectorAll("b");b[0].textContent=Math.floor(s/86400);b[1].textContent=pad(Math.floor(s%86400/3600));b[2].textContent=pad(Math.floor(s%3600/60));b[3].textContent=pad(s%60);
 $("#cdNote").textContent=f.no?`距離 ${f.no} 起飛（${md(f.date||t.start)} ${f.dep}，台灣時間）`:`距離出發（${md(t.start)}）`;
 const lt=$("#localT");if(lt)lt.textContent=new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:t.theme==="japan"||t.theme==="korea"?"Asia/Tokyo":"Asia/Taipei"})}

function form(title,fields,vals,onSave,onDel,extra=""){

  if(f.type==="check")return `<label class="fchk"><input type="checkbox" id="${id}" ${v?"checked":""}><span>${f.label}</span></label>`;
  const inner=f.type==="select"?`<select id="${id}">${f.opts.map(o=>Array.isArray(o)?o:[o,o]).map(([ov,ol])=>`<option value="${esc(ov)}" ${String(ov)===String(v)?"selected":""}>${esc(ol)}</option>`).join("")}</select>`
   :f.type==="textarea"?`<textarea id="${id}" placeholder="${esc(f.ph||"")}">${esc(v)}</textarea>`
   :`<input id="${id}" type="${f.type||"text"}" value="${esc(v)}" placeholder="${esc(f.ph||"")}" autocomplete="off" ${f.type==="number"?'step="any" inputmode="decimal"':""}>`;
  return `<label class="f"><span>${f.label}</span>${inner}</label>`};
 const rows=[];for(let i=0;i<fields.length;i++){const f=fields[i];if(f.half&&fields[i+1]?.half){rows.push(`<div class="f2">${fh(f)}${fh(fields[i+1])}</div>`);i++}else rows.push(fh(f))}
 openSheet(`<h2 style="font-size:19px">${title}</h2><form id="sf">${rows.join("")}${extra}<div class="acts2">${onDel?`<button type="button" id="sfDel">刪除</button>`:""}<button type="button" data-close>取消</button><button class="pri" type="submit">儲存</button></div></form>`);
 $("#sf").addEventListener("submit",e=>{e.preventDefault();const o={};fields.forEach(f=>{const el=$("#f_"+f.k);o[f.k]=f.type==="check"?el.checked:el.value.trim()});if(onSave(o)!==false)closeSheet()});
 if(onDel){let armed=false;$("#sfDel").addEventListener("click",ev=>{if(!armed){armed=true;ev.target.textContent="再按一次確認";return}onDel();closeSheet()})}
}

/* ---------- load & sync ---------- */
async function load(){
 try{
  if(pass){try{const list=await rpc("trip_list",{p_pass:pass});canEdit=true;const next={};list.forEach(r=>next[r.id]=r.data);for(const id in queue)if(queue[id].busy&&trips[id])next[id]=trips[id];trips=next}
   catch(e){if(e.message==="bad pass"){pass="";LS.set("pass","");canEdit=false;editing=false}else throw e}}
  const h=hashId();
  if(!canEdit){if(h){const r=await rpc("trip_get",{p_id:h});trips=r?{[r.id]:r.data}:{}}else trips={}}
  if(h&&trips[h])curId=h;else if(!trips[curId]){curId=defaultTrip();if(curId&&canEdit)setHash(curId)}
  loaded=true;offline=false;
 }catch(e){loaded=true;offline=!Object.keys(trips).length;if(!offline)toast("連線不穩，顯示的是上次的內容")}
 if(Object.keys(trips).length)LS.set("cache",{trips,curId});
 if(!$("#sheet").classList.contains("open"))render();
}
const cache=LS.get("cache",null);if(cache&&(!hashId()||cache.trips[hashId()])){trips=cache.trips;curId=hashId()||cache.curId;loaded=true}
