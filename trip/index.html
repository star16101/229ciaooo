<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅行手帳</title>
<meta name="theme-color" content="#fbf3ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅行手帳">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* 旅行手帳 × 行旅野帳 — warm cream notebook; Huninn rounded type */
:root{--bg:#fbf3ea;--bg2:#f6e8d8;--card:#fffaf5;--ink:#4a3426;--mute:#9a8170;--line:#efdfcd;--pri:#c8793f;--pri2:#f6e1cb;--pri3:#fdf0e2;--ok:#7fb08f;--must:#e2725b;--sh:0 6px 20px rgba(150,95,50,.09);
 --k-spot:#8fbf8a;--k-meal:#f2a08f;--k-hotel:#8fb8de;--k-move:#e8c36a;--k-other:#c9b6ec}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
html{background:var(--bg);scroll-padding-top:130px}
body{color:var(--ink);font:16px/1.6 "Huninn","Noto Sans TC",system-ui,sans-serif;overflow-x:clip;min-height:100vh;background:radial-gradient(90% 40% at 100% 0,#f9e6d2,transparent 70%),var(--bg);-webkit-tap-highlight-color:transparent}
b,strong,h1,h2,h3{font-weight:700}
.num{font-variant-numeric:tabular-nums}
header{position:fixed;top:0;left:0;right:0;z-index:500;padding:calc(8px + env(safe-area-inset-top)) 12px 6px;background:rgba(251,243,234,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hrow{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px}
.logo{flex:none;width:38px;height:38px;border-radius:50%;background:var(--pri2);display:grid;place-items:center;color:var(--pri)}
.tripbtn{flex:1;justify-content:flex-start!important;background:none!important;border:0!important;padding:4px!important;text-align:left;box-shadow:none!important;color:var(--ink)!important}
.tripbtn b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;color:var(--pri)}
.tripbtn small{display:block;font-size:11px;color:var(--mute);letter-spacing:.08em}
.tabs{max-width:640px;margin:6px auto 0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.tabs button{flex-direction:column;gap:1px;min-height:52px;padding:4px 0;border-radius:16px;font-size:12px;background:none;border:0;color:var(--mute);box-shadow:none;white-space:nowrap}
.tabs button.on{background:var(--pri2);color:var(--pri)}
.tabs button.sos{color:#c9543f}
.wrap{max-width:640px;margin:0 auto;padding:calc(130px + env(safe-area-inset-top)) 14px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
h1{font-size:34px;line-height:1.2;margin:6px 0 4px;white-space:nowrap;overflow:hidden}
h1.fit .hl{background:linear-gradient(transparent 62%,#f6d2ad 62%)}
h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2 .r{margin-left:auto;font-size:13px;color:var(--mute);font-weight:400}
.dot{width:32px;height:32px;border-radius:11px;background:var(--pri2);color:var(--pri);display:grid;place-items:center;flex:none}
.dot svg{width:18px;height:18px}
.sec{display:flex;align-items:center;gap:8px;font-size:19px;margin:22px 4px 10px;color:var(--ink)}
.sec svg{color:var(--must)}
.pagehead{margin:4px 4px 14px}.pagehead h1{font-size:28px}
.mute{color:var(--mute);font-size:14px}.small{font-size:13px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:13px;padding:3px 11px;border-radius:99px;background:var(--pri3);border:1px solid var(--line);white-space:nowrap;color:#7a5a43}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--pri);box-shadow:var(--sh)}
.hero{padding:0;overflow:hidden}
.sc{position:relative;background:var(--bg2)}
.scene{display:block;width:100%;height:auto;aspect-ratio:16/10}
.float{position:absolute;display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:7px 12px;box-shadow:0 6px 18px rgba(120,70,30,.16);font-size:12px;line-height:1.3}
.float b{display:block;font-size:13px}
.float .fi{width:28px;height:28px;border-radius:50%;background:var(--pri2);color:var(--pri);display:grid;place-items:center;flex:none}
.float .fi svg{width:15px;height:15px}
.f1{left:12px;top:12px}.f2{right:12px;bottom:12px}
.hero .in{padding:14px 16px 16px}
.tagline{font-size:14px;color:var(--mute);margin:2px 0 0}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0 6px}
.cd div,.stat div{text-align:center;padding:10px 0;border-radius:18px;background:var(--pri3);border:1px solid var(--line)}
.cd div:first-child{background:var(--pri);color:#fff;border-color:var(--pri)}
.cd div:first-child span{color:#fde7d2}
.cd b{display:block;font-size:clamp(24px,7vw,32px);line-height:1.1}
.cd span,.stat span{font-size:13px;color:var(--mute)}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat b{display:block;font-size:22px;line-height:1.3}
.flight{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.flight .t{font-size:clamp(26px,7vw,32px);line-height:1}
.flight .c{font-size:13px;color:var(--mute);margin-top:4px}
.arc{position:relative;height:34px;text-align:center;font-size:13px;color:var(--mute)}
.arc:before{content:"";position:absolute;left:6px;right:6px;top:12px;border-top:1.5px dashed #e3c9ae}
.arc svg{position:relative;background:var(--card);color:var(--pri)}
.fl+.fl{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:3px 11px;border-radius:99px;background:#fde3d3;color:#b5603a;margin-bottom:10px}
.tag.back{background:#dcebf5;color:#4a7495}
ul.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.chk li:last-child{border:0}
.chk .hit{display:flex;gap:12px;flex:1;justify-content:flex-start;background:none;border:0;padding:4px 0;min-height:36px;text-align:left;font-size:16px;color:var(--ink);box-shadow:none}
.chk .hit[disabled]{cursor:default}
.box{flex:none;width:22px;height:22px;border-radius:8px;border:2px solid #e0c6ab;display:grid;place-items:center;margin-top:2px;background:#fff}
.hit.on .box{background:var(--ok);border-color:var(--ok)}
.hit.on .box:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.hit.on .tx{color:var(--mute);text-decoration:line-through}
.bar{height:8px;border-radius:9px;background:var(--pri3);overflow:hidden;margin-bottom:8px;border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .4s}
.addrow{display:flex;gap:8px;margin-top:10px}.addrow input{flex:1}
button,.btn{font:inherit;color:var(--pri);background:#fff;border:1.5px solid #ecd3b9;border-radius:99px;padding:9px 16px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
button.pri,.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 6px 14px rgba(200,121,63,.3)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f1b98a;outline-offset:2px}
.sm{min-height:34px!important;padding:5px 12px!important;font-size:13px!important}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;flex-direction:column;gap:2px;padding:7px 15px;border-radius:18px;line-height:1.2;color:var(--ink);border-style:dashed}
.days button small{font-size:12px;color:var(--mute)}
.days button i{display:flex;gap:3px;justify-content:center}.days button i span{width:5px;height:5px;border-radius:50%;background:var(--mute);opacity:.6}
.days button.on{background:var(--pri);border-color:var(--pri);border-style:solid;color:#fff;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.days button.on small{color:#fde7d2}.days button.on i span{background:#fff}
@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}
.bounce{animation:bounce .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes bounce{0%{transform:translateY(22px);opacity:.2}60%{transform:translateY(-6px);opacity:1}100%{transform:none}}
.map .leaflet-tile-pane{filter:sepia(.28) saturate(.85) brightness(1.03)}
.map{height:280px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#eee6d9;z-index:1}
.mapcard{padding:10px}
.maphead{display:flex;align-items:center;gap:8px;margin:2px 4px 8px;font-size:14px}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;display:grid;place-items:center;font:700 13px/1 system-ui;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.leaflet-popup-content{font-family:"Huninn",sans-serif;margin:10px 12px}
.leaflet-popup-content a{color:var(--pri)}
.tl{position:relative;padding-left:56px}
.ev{position:relative;margin-bottom:8px}
.ev .tm{position:absolute;left:-58px;width:46px;text-align:right;top:12px;white-space:nowrap;line-height:1.25}
.ev .tm b{display:block;font-size:15px}.ev .tm small{font-size:12px;color:var(--mute)}
.ev .ln{position:absolute;left:-7px;top:10px;bottom:-10px;width:5px;border-radius:9px;background:var(--k-spot)}
.ev .card{margin:0;padding:12px 14px;border-left:5px solid var(--k-spot);border-radius:18px}
.ev.must .card{background:#fffaf8}
.ev .hd{display:flex;align-items:flex-start;gap:8px}.ev .hd b{flex:1;font-size:16px}
.mustb{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--must);color:#fff;margin-right:6px;vertical-align:2px}
.flag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:8px;margin:4px 6px 0 0}
.flag.f-warn{background:#fbe3a6;color:#7a5a00}.flag.f-check{background:#cfe7c9;color:#2f6a3a}.flag.f-ok{background:#d6e6f6;color:#2c5d8a}
.mv{margin:0 0 8px -2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mode{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:3px 11px 3px 8px;border-radius:99px;white-space:nowrap}
.mode svg{width:15px;height:15px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px}
.place{padding:12px 0;border-bottom:1px dashed var(--line)}
.place:last-child{border:0}
.place .top{display:flex;gap:12px;align-items:flex-start}
.place .ic{flex:none;width:42px;height:42px;border-radius:14px;background:var(--pri3);color:var(--pri);display:grid;place-items:center}
.place .body{flex:1}
.place .body b{font-size:16px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.grid a{flex-direction:column;gap:4px;padding:10px 2px;border-radius:18px;font-size:12px;color:var(--ink);min-height:64px}
.grid a svg{color:var(--pri)}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.row:last-child{border:0}.row>span:first-child{color:var(--mute);flex:none}.row>span:last-child{text-align:right}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;width:100%}
textarea{min-height:96px;resize:vertical}
input::placeholder,textarea::placeholder{color:#c4ad9a}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri)}
.conv{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.big{font-size:clamp(26px,8vw,34px);line-height:1.2;color:var(--pri)}
.qr{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.qr img{width:100%;border-radius:14px;border:1px solid var(--line)}
.sos a{justify-content:space-between;width:100%;margin-bottom:8px;font-size:16px;border-radius:18px;color:var(--ink)}
.sos a b{font-size:20px;color:#c9543f}
.memo{white-space:pre-wrap;font-size:15px;line-height:1.8;background:var(--pri3);border-radius:16px;padding:12px 14px;margin-top:10px;border:1px dashed #e8cdb0}
.page .dn{font-size:13px;color:var(--pri);letter-spacing:.04em}
.page ol{margin:8px 0 0;padding-left:20px;font-size:15px}
.empty{text-align:center;padding:24px 16px}
.member{background:var(--pri);color:#fff;border-color:var(--pri)}
.member .small{color:#fde7d2}
.wx{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:10px 12px}
.wx .city{flex:none;background:#f6cf6b;color:#5a3d10;border-radius:12px;padding:8px 10px;font-size:15px;max-width:7em;text-align:center}
.wx .ico{flex:none;color:#6a87b5}.wx .ico svg{width:40px;height:40px;stroke-width:1.5}
.wx b{font-size:18px}
.wxcard{background:#e4eef8;border-color:#cddfee}
.seg{display:flex;gap:10px;align-items:flex-start;text-align:left;justify-content:flex-start;width:100%;border-radius:22px;padding:10px 14px;margin-bottom:8px;color:var(--ink);line-height:1.5}
.seg.first{background:#f3a091;border-color:#f3a091;color:#4a2a26}
.seg svg{flex:none;margin-top:3px}
.mem{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 12px;background:var(--pri3);border:1.5px solid var(--line);font-size:15px;color:var(--ink)}
.mem.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.bal{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.bal .p{color:#3f7a52}.bal .n{color:#c9543f}
.pick details{border:1px solid var(--line);border-radius:16px;margin-bottom:8px;background:#fff}
.pick summary{padding:10px 14px;cursor:pointer;list-style:none;font-size:15px}
.pick summary::-webkit-details-marker{display:none}
.pick .cities{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.pick .cities button{min-height:34px;padding:4px 12px;font-size:14px;color:var(--ink)}
.pick .cities button.lib{border-color:var(--pri);color:var(--pri)}
.pick .cities button.on{background:var(--pri);color:#fff}
.pick .ctry{font-size:13px;color:var(--mute);padding:6px 14px 2px;width:100%}
.edit{display:none!important}body.editing .edit{display:inline-flex!important}
.editb{display:none!important}body.editing .editb{display:flex!important}
.acts2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.acts2>*{flex:1}
#sheet{position:fixed;inset:0;z-index:900;display:none;align-items:flex-end;justify-content:center;background:rgba(74,52,38,.35)}
#sheet.open{display:flex}
#sheet .pane{width:min(640px,100%);max-height:90vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));background:var(--bg);animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.f{display:block;margin-bottom:12px}.f>span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fchk{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:44px}
.warn{color:var(--must);font-size:13px;margin:-4px 0 10px}
.note2{font-size:13px;color:var(--mute);margin:-4px 0 12px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:950;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;display:none;max-width:90vw;text-align:center}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.view{display:none}.view.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.scene .drift{animation:drift 14s ease-in-out infinite alternate}
.scene .drift2{animation:drift 20s ease-in-out infinite alternate-reverse}
.scene .fly{animation:fly 16s linear infinite}
.scene .ride{animation:ride 10s linear infinite}
.scene .bob{animation:bob 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.scene .wave{animation:wave 4s ease-in-out infinite alternate}
.scene .sway{animation:sway 3.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.scene .glow{animation:glow 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.scene .swing{animation:swing 9s ease-in-out infinite alternate}
.scene .fall{animation:fall 7s linear infinite}
.scene .steam{animation:steam 3s ease-in-out infinite}
.scene .float2{animation:bob 2.6s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
@keyframes fly{from{transform:translate(-80px,30px)}to{transform:translate(460px,-30px)}}
@keyframes ride{from{transform:translateX(-240px)}to{transform:translateX(440px)}}
@keyframes bob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(5px) rotate(2deg)}}
@keyframes wave{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.1)}}
@keyframes swing{from{transform:translate(0,0)}to{transform:translate(170px,-52px)}}
@keyframes fall{from{transform:translate(0,-20px) rotate(0)}to{transform:translate(-40px,240px) rotate(300deg)}}
@keyframes steam{0%{transform:translateY(0);opacity:0}40%{opacity:.8}100%{transform:translateY(-16px);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media(max-width:380px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
 <div class="hrow">
  <span class="logo"><svg class="i"><use href="#i-plane"/></svg></span>
  <button class="tripbtn" id="tripBtn" aria-label="切換旅程"><span style="min-width:0;flex:1"><b id="tripTitle">旅行手帳</b><small>TRAVEL NOTEBOOK × 行旅野帳</small></span><svg class="i" style="width:16px;color:var(--mute)"><use href="#i-down"/></svg></button>
  <button id="editToggle" class="sm" style="display:none"><svg class="i"><use href="#i-pen"/></svg><span>編輯</span></button>
 </div>
 <nav class="tabs" id="tabs"></nav>
</header>

<div class="wrap">
 <section class="view" id="v-home"></section>
 <section class="view" id="v-plan"><div class="days" id="dayBtns"></div><div id="dayBody"></div></section>
 <section class="view" id="v-eat"></section>
 <section class="view" id="v-list"></section>
 <section class="view" id="v-tool"></section>
 <section class="view" id="v-info"></section>
 <section class="view" id="v-sos"></section>
</div>

<div id="sheet" role="dialog" aria-modal="true"><div class="pane" id="pane"></div></div>
<div id="toast" role="status"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-plane" viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></symbol>

/* ================= library glue ================= */
function libKeyOf(dest){if(!HAS_LIB||!dest)return"";dest=String(dest).trim();if(CACHED[dest]||CACHED[dest.toLowerCase()])return CACHED[dest]?dest:dest.toLowerCase();
 for(const k of CACHED_NAMES)if(dest.includes(k))return k;return""}
function pickOf(city){if(!HAS_LIB)return null;for(const[cont,cs]of Object.entries(QUICK_PICKS))for(const[ctry,v]of Object.entries(cs)){
  const list=Array.isArray(v)?v:Object.values(v).flat();if(list.some(c=>c===city||city.includes(c)))return{continent:cont,country:cont==="台灣"?"台灣":ctry}}return null}
function countryOf(dest){dest=dest||"";const lk=libKeyOf(dest);if(lk){const bc=CACHED[lk].breadcrumb.split(" · ");return bc[0]==="台灣"?"台灣":bc[1]}
 const p=pickOf(dest);if(p)return p.country;for(const c of Object.keys(COUNTRY))if(dest.includes(c))return c;
 if(/台灣|臺灣|國內|台北|臺北|新北|台中|台南|高雄|花蓮|台東|宜蘭|屏東|墾丁|嘉義|新竹|苗栗|彰化|南投|雲林|基隆|金門|馬祖|日月潭|阿里山/.test(dest))return"台灣";
 if(/東京|大阪|京都|福岡|北海道|沖繩|名古屋|Japan/i.test(dest))return"日本";if(/首爾|釜山|濟州|Korea/i.test(dest))return"韓國";return""}
function themeOf(dest,country){if(ISLAND_CITY.test(dest||""))return"island";return(COUNTRY[country]||[])[4]||"city"}
function transportMode(s){s=s||"";if(/自駕|租車/.test(s))return"自駕";if(/機車/.test(s))return"機車";if(/捷運/.test(s))return"捷運";if(/地鐵|輕軌|BTS|單軌/.test(s))return"地鐵";if(/巴士|公車|客運/.test(s))return"巴士";if(/JR|火車|電車|新幹線|台鐵/.test(s))return"電車";return""}
function stayMin(tip){tip=tip||"";let m=0;const h=tip.match(/([\d.]+)(?:\s*[-–]\s*[\d.]+)?\s*小時/);if(h)m=parseFloat(h[1])*60;const mm=tip.match(/(\d+)\s*分/);if(mm)m+=+mm[1];return Math.min(m,600)}
function addMin(t,m){if(!t||!m)return"";const[h,mi]=t.split(":").map(Number);const x=h*60+mi+m;return `${pad(Math.floor(x/60)%24)}:${pad(x%60)}`}
const mealTime=t=>/早/.test(t||'')?'08:30':/午/.test(t||'')?'12:30':/晚/.test(t||'')?'18:30':/宵/.test(t||'')?'21:00':'15:30';
function libItem(x,kind,mode){const time=x.time||"";const it={id:uid(),kind,time,end:"",name:x.name,note:x.desc||"",tip:x.tip||"",type:x.type||"",price:x.price||"",stars:x.stars||0,mode:mode||"",move:"",must:false,flag:/預約|已預訂/.test((x.type||"")+(x.tip||""))?"已預訂":"",q:x.mapq||""};
 if(it.time&&kind==="spot")it.end=addMin(it.time,stayMin(it.tip));return it}
function applyLib(t,key){const tpl=CACHED[key];const n=Math.max(1,diffDays(t.start,t.end)+1);const b=buildDestination(tpl,n);const mode=transportMode((tpl.metaRest||[]).map(m=>m.value).join(" "))||"步行";
 t.lib=key;t.days=b.days.map(d=>{const items=[];(d.spots||[]).forEach((s,i)=>{const it=libItem(s,"spot",mode);if(!it.time){it.time=SPOT_T[Math.min(i,SPOT_T.length-1)];it.end=addMin(it.time,stayMin(it.tip))}items.push(it)});
   (d.meals||[]).forEach(m=>{const it=libItem(m,"meal",mode);if(!it.time)it.time=mealTime(m.type);items.push(it)});
   items.sort((a,b)=>a.time.localeCompare(b.time));if(items[0])items[0].mode="";
   return{title:d.title,area:d.area||"",drive:d.drive||"",tag:d.tag||"",weather:"",memo:"",stayTitle:d.stay?.title||"",stayDesc:d.stay?.desc||"",items}});
 t.spots=[...(b.trays.spots||[]).map(s=>({id:uid(),kind:"spot",name:s.name,note:s.desc||"",tip:s.tip||"",q:s.mapq||"",from:s.from||""})),...(b.trays.meals||[]).map(m=>({id:uid(),kind:"meal",name:m.name,note:m.desc||"",type:m.type||"",price:m.price||"",stars:m.stars||0,from:m.from||""}))];
 t.tips=(b.driveTips||[]).map(x=>({id:uid(),h:x.h,t:x.t}));

 return t}

/* ---------- weather (Open-Meteo) ---------- */
const WX={};
const wxInfo=c=>c==null?null:c===0?["晴","w-sun"]:c<=2?["晴時多雲","w-part"]:c===3?["陰天","w-cloud"]:c<=48?["霧","w-fog"]:c<=57?["毛毛雨","w-rain"]:c<=67?["下雨","w-rain"]:c<=77?["下雪","w-snow"]:c<=82?["陣雨","w-rain"]:c<=86?["陣雪","w-snow"]:["雷雨","w-storm"];
function centerOf(t){if(t.center)return t.center;const k=t.lib||libKeyOf(t.dest);if(k&&CENTER[k])return CENTER[k];const it=t.days.flatMap(d=>d.items).find(i=>i.lat!=null);return it?[it.lat,it.lng]:null}
async function loadWeather(t){const c=centerOf(t);if(!c){geocodeCenter(t);return}const key=curId+t.start;if(WX[key]&&Date.now()-WX[key].ts<3*36e5)return;
 const last=addDays(todayTW(),15),s=t.start>todayTW()?t.start:todayTW(),e=t.end<last?t.end:last;if(s>e){WX[key]={ts:Date.now(),days:{}};return}
 try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c[0]}&longitude=${c[1]}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${s}&end_date=${e}`);
  const j=await r.json();const days={};(j.daily?.time||[]).forEach((d,i)=>days[d]={c:j.daily.weather_code[i],hi:j.daily.temperature_2m_max[i],lo:j.daily.temperature_2m_min[i],p:j.daily.precipitation_probability_max[i]});
  WX[key]={ts:Date.now(),days};document.querySelectorAll("[data-wx]").forEach(el=>el.outerHTML=weatherCard(t,+el.dataset.wx))}catch(e){}}
function weatherCard(t,di){const ds=addDays(t.start,di),w=WX[curId+t.start]?.days?.[ds],inf=w&&wxInfo(w.c),manual=t.days[di]?.weather;
 const city=esc((t.dest||"").replace(/^(日本|韓國|台灣|泰國|中國)/,"").slice(0,5)||"當地");
 const body=inf?`<div class="wx"><span class="city">${city}</span><span class="ico">${ic(inf[1])}</span><span><b>${inf[0]}　<span class="num">${Math.round(w.lo)}° / ${Math.round(w.hi)}°</span></b><br><span class="small">降雨機率 ${w.p??"-"}%</span></span></div>`
  :`<div class="wx"><span class="city">${city}</span><span class="ico">${ic("w-part")}</span><span>${manual?`<b>${esc(manual)}</b><br>`:""}<span class="small">出發前 16 天內會自動顯示天氣預報</span></span></div>`;

/* ---------- geocoding (Nominatim, 1 req/sec) ---------- */
let geoBusy=false;const GEO=LS.get("geo",{});
function cands(it,t){const out=[];const add=s=>{s=(s||"").replace(/[📸🤿]/gu,"").trim();if(s&&!out.includes(s))out.push(s)};add(it.q);
 const par=(it.name.match(/[（(]([^）)]+)[）)]/)||[])[1];if(par&&!/^\d|停留|約/.test(par))add(par);add(it.name.replace(/[（(][^）)]*[）)]/g,"").replace(/[・|｜].*$/,""));add(it.name);return out.slice(0,3)}
async function nomi(q,c){const vb=c?`&viewbox=${c[1]-1.2},${c[0]+1.2},${c[1]+1.2},${c[0]-1.2}&bounded=1`:"";
 const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=zh-TW&q=${encodeURIComponent(q)}${vb}`);const j=await r.json();return j[0]?[+j[0].lat,+j[0].lon]:null}
async function geocodeCenter(t){if(t.center||t._cTried||!t.dest)return;t._cTried=1;try{const r=await nomi(t.dest,null);if(r){t.center=r;if(canEdit)save(curId,true);loadWeather(t)}}catch(e){}}
async function geocodeDay(t,di){if(geoBusy)return;geoBusy=true;const c=centerOf(t);let changed=false;
 try{for(const it of t.days[di].items){if(it.lat!=null||it.geoFail)continue;const ck=(t.lib||t.dest)+"|"+it.name;
   if(GEO[ck]){it.lat=GEO[ck][0];it.lng=GEO[ck][1];changed=true;continue}
   let hit=null;for(const q of cands(it,t)){try{hit=await nomi(q,c)}catch(e){}await sleep(1100);if(hit)break}
   if(hit){it.lat=hit[0];it.lng=hit[1];GEO[ck]=hit;LS.set("geo",GEO)}else it.geoFail=1;changed=true;
   if(T()===t&&dayIdx===di)drawMapLite()}}
 finally{geoBusy=false}
 if(changed&&canEdit&&trips[curId]===t)save(curId,true);if(T()===t&&dayIdx===di)drawMapLite()}
function drawMapLite(){if(view==="plan")drawMap()}

async function ensureRate(t){const c=t.cur;if(!c||!c.code||c.code==="TWD")return;if(FX&&Date.now()-FX.ts<12*36e5&&FX.rates[c.code])return applyFx(t);
 try{const r=await fetch("https://open.er-api.com/v6/latest/TWD");const j=await r.json();if(j.rates){FX={ts:Date.now(),rates:j.rates,date:j.time_last_update_utc};LS.set("fx",FX);applyFx(t)}}catch(e){}}
function applyFx(t){const u=FX?.rates?.[t.cur.code];if(!u)return;const live=1/u;if(Math.abs((t._live||0)-live)>1e-9){t._live=live;if(view==="tool")renderTool(t)}}
const rateOf=t=>t.cur.code==="TWD"?1:(LS.get(curId+":rate",null)??t._live??t.cur.rate);
function balances(t){const r=rateOf(t),bal={};t.members.forEach(m=>bal[m.id]=0);
 t.expenses.forEach(e=>{const amt=+e.amount||0,local=e.cur==="T"?amt/r:amt;const f=(e.for&&e.for.length?e.for:t.members.map(m=>m.id)).filter(id=>id in bal);if(!(e.who in bal)||!f.length)return;bal[e.who]+=local;f.forEach(id=>bal[id]-=local/f.length)});return bal}
function settle(bal){const pos=Object.entries(bal).filter(([,v])=>v>0.5).sort((a,b)=>b[1]-a[1]).map(x=>[...x]),neg=Object.entries(bal).filter(([,v])=>v<-0.5).sort((a,b)=>a[1]-b[1]).map(x=>[...x]),out=[];
 while(pos.length&&neg.length){const p=pos[0],n=neg[0],x=Math.min(p[1],-n[1]);out.push([n[0],p[0],x]);p[1]-=x;n[1]+=x;if(p[1]<0.5)pos.shift();if(n[1]>-0.5)neg.shift()}return out}

   const items=t.days[+o.d].items;items.push(it);items.sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));t.spots.splice(i,1);toast(`已排進 Day ${+o.d+1}`)}))},
 editDay(){const t=T();form(`第 ${dayIdx+1} 天`,[{k:"title",label:"這天的標題",ph:"例如：西部海岸線"},{k:"area",label:"住宿區域",ph:"住宿：涯月／翰林"},{k:"drive",label:"移動方式與車程",ph:"濟州市 → 涯月，約 1 小時"},{k:"weather",label:"天氣（沒有預報時手動填）",ph:"晴 8° / 15°"}],t.days[dayIdx],o=>mut(t=>Object.assign(t.days[dayIdx],o)))},
 memo(a){const i=+a.dataset.d,t=T();form(`DAY ${i+1} 的筆記`,[{k:"memo",label:"寫下這天",type:"textarea",ph:"好吃的、好笑的、想再去的……"}],t.days[i],o=>mut(t=>t.days[i].memo=o.memo))},
 editItem(a){const di=+a.dataset.d,j=+a.dataset.j,t=T(),it=j>=0?t.days[di].items[j]:{kind:"spot"};
  form(j>=0?"編輯行程":"新增行程",[{k:"name",label:"地點／活動"},{k:"time",label:"開始",type:"time",half:1},{k:"end",label:"結束",type:"time",half:1},
   {k:"kind",label:"類型",type:"select",opts:Object.entries(KINDS).map(([k,v])=>[k,v[0]]),half:1},{k:"mode",label:"怎麼過去",type:"select",opts:[["","（不標示）"],...Object.keys(MODES)],half:1},
   {k:"move",label:"交通補充",ph:"例如：15 分、JR 鹿兒島本線"},{k:"note",label:"說明"},{k:"tip",label:"提醒",ph:"停留 1 小時、門票 ₩2,000"},
   {k:"flag",label:"標記",type:"select",opts:Object.keys(FLAGS).map(k=>[k,FLAGS[k]&&k?k:"（無）"]),half:1},{k:"d",label:"放在哪一天",type:"select",opts:t.days.map((d,k)=>[k,`Day ${k+1}`]),half:1},
   {k:"q",label:"地圖搜尋字或 Google Maps 連結（定位不準時填）",ph:"留空就用地點名稱"},{k:"must",label:"標成「必去」",type:"check"}],
   {...it,d:di},o=>{if(!o.name){toast("請填地點");return false}const nd=+o.d;delete o.d;const coord=parseCoord(o.q);
    mut(t=>{let x;if(j>=0){x=t.days[di].items[j];const qChanged=x.q!==o.q||x.name!==o.name;Object.assign(x,o);if(qChanged){delete x.lat;delete x.lng;delete x.geoFail}if(nd!==di){t.days[di].items.splice(j,1);t.days[nd].items.push(x)}}
     else{x={id:uid(),...o};t.days[nd].items.push(x)}
     if(coord){x.lat=coord[0];x.lng=coord[1];delete x.geoFail;if(/^https?:/.test(x.q))x.q=""}
     t.days[nd].items.sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"))})},
   j>=0?()=>mut(t=>t.days[di].items.splice(j,1)):null)},
 members(){const t=T();form("旅伴",[{k:"list",label:"一行一位：名字／電話（電話可省略）",type:"textarea",ph:"YU／0912345678\n小美\n阿明"}],{list:t.members.map(m=>m.name+(m.phone?"／"+m.phone:"")).join("\n")},
  o=>mut(t=>{const old=t.members;t.members=o.list.split(/\n/).map(s=>s.trim()).filter(Boolean).map(s=>{const[n,p]=s.split(/[／/]/).map(x=>x.trim());const ex=old.find(m=>m.name===n);return{id:ex?.id||uid(),name:n,phone:p||""}})}))},
 pay(a){const t=T(),who=a.dataset.m,m=t.members.find(x=>x.id===who);
  openSheet(`<h2 style="font-size:19px">${ic("i-wallet")}${esc(m.name)} 付了多少？</h2><form id="pf">
  <div class="f2"><label class="f"><span>金額</span><input id="p_amt" inputmode="decimal" placeholder="0" required></label><label class="f"><span>幣別</span><select id="p_cur"><option value="L">${esc(t.cur.name)} ${esc(t.cur.sym)}</option>${t.cur.code==="TWD"?"":`<option value="T">台幣 NT$</option>`}</select></label></div>
  <label class="f"><span>項目（選填）</span><input id="p_note" placeholder="晚餐、門票、計程車"></label>
  <div class="small" style="margin-bottom:6px">分給誰（<span id="p_cnt">${t.members.length}</span> 人分）</div><div class="chips">${t.members.map(x=>`<button type="button" class="mem sel" data-for="${x.id}">${esc(x.name)}</button>`).join("")}</div>
  <div class="acts2"><button type="button" data-close>取消</button><button class="pri" type="submit">記一筆</button></div></form>`);
  $("#pf").querySelectorAll("[data-for]").forEach(b=>b.addEventListener("click",()=>{b.classList.toggle("sel");$("#p_cnt").textContent=$("#pf").querySelectorAll(".sel").length}));
  $("#pf").addEventListener("submit",e=>{e.preventDefault();const amt=parseFloat($("#p_amt").value);const forIds=[...$("#pf").querySelectorAll(".sel")].map(b=>b.dataset.for);if(!amt||!forIds.length){toast("請填金額並選分給誰");return}
   mut(t=>t.expenses.push({id:uid(),who,amount:amt,cur:$("#p_cur").value,note:$("#p_note").value.trim(),for:forIds,at:Date.now()}));closeSheet();toast("已記錄")})},
};
const unlock={has:true};

$("#tripBtn").addEventListener("click",async()=>{
 if(!canEdit){try{unlock.has=await rpc("trip_has_pass")}catch(e){}
  openSheet(`<h2 style="font-size:19px">${esc(T()?.name||"旅行手帳")}</h2><p class="small">你正在看旅伴分享的行程，內容會跟主揪同步。</p><div class="acts2"><button data-act="unlock">${ic("i-lock")}我是主揪</button><button class="pri" data-close>關閉</button></div>`);return}
 const list=Object.entries(trips).sort((a,b)=>b[1].start.localeCompare(a[1].start)),lab={before:"即將出發",during:"旅行中",after:"回憶書"};
 openSheet(`<h2 style="font-size:19px">我的旅程</h2>${list.map(([id,t])=>`<button style="width:100%;justify-content:space-between;margin-bottom:8px;border-radius:18px;color:var(--ink);${id===curId?"background:var(--pri2)":""}" data-pick="${id}"><span style="text-align:left"><b>${esc(t.name)}</b><br><span class="small">${esc(t.dest||"")}・${md(t.start)} – ${md(t.end)}</span></span><span class="chip">${lab[statusOf(t)]}</span></button>`).join("")||`<div class="small">還沒有旅程</div>`}
 <div class="acts2"><button class="pri" data-act="newTrip">${ic("i-plus")}新增旅程</button></div><div class="small" style="margin-top:8px">公司招待的行程表：拍照或 PDF 傳到和 Claude 的對話，說「幫我匯入旅行手帳」</div><div class="acts2"><button data-act="lockOut">登出主揪</button><button data-close>關閉</button></div>`)});
$("#pane").addEventListener("click",e=>{const b=e.target.closest("[data-pick]");if(!b)return;curId=b.dataset.pick;dayIdx=null;setHash(curId);view="home";closeSheet();window.scrollTo(0,0)});

/* ================= load & sync ================= */
async function load(){
 try{
  if(pass){try{const list=await rpc("trip_list",{p_pass:pass});canEdit=true;const next={};list.forEach(r=>next[r.id]=r.data);for(const id in queue)if(queue[id].busy&&trips[id])next[id]=trips[id];
    for(const id in next){if(trips[id]&&trips[id]._live)next[id]._live=trips[id]._live}trips=next}
   catch(e){if(e.message==="bad pass"){pass="";LS.set("pass","");canEdit=false;editing=false}else throw e}}
  const h=hashId();
  if(!canEdit){if(h){const r=await rpc("trip_get",{p_id:h});trips=r?{[r.id]:r.data}:{}}else trips={}}
  if(h&&trips[h])curId=h;else if(!trips[curId]){curId=defaultTrip();if(curId&&canEdit)setHash(curId)}
  loaded=true;offline=false;
 }catch(e){loaded=true;offline=!Object.keys(trips).length;if(!offline)toast("連線不穩，顯示的是上次的內容")}
 if(Object.keys(trips).length)LS.set("cache",{trips,curId});
 if(!$("#sheet").classList.contains("open"))render();
}
const cache=LS.get("cache",null);if(cache&&(!hashId()||cache.trips[hashId()])){trips=cache.trips;curId=hashId()||cache.curId;loaded=true}
render();load();
setInterval(()=>{if(document.visibilityState==="visible"&&!saving&&!geoBusy&&!$("#sheet").classList.contains("open"))load()},30000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!saving&&!geoBusy)load()});
}
</script>
