<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅行手帳</title>
<meta name="theme-color" content="#FFFCF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅行手帳">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* 旅行手帳 × 行旅野帳 — refined notebook: #FFFCF6 paper, thin ink lines, soft tints, compact */
:root{--bg:#FFFCF6;--ink:#3E3A39;--mute:#8a8481;--card:#fff;--line:#e6ded3;--soft:#efe9e0;--tint:#F5F0E8;
 --coral:#F2A497;--yellow:#F6D27A;--mizu:#A8D3E6;--green:#B9DAA5;--pri:#3E3A39;--pri3:#FBF6EC;--ok:#B9DAA5;--must:#d9705c;
 --t-coral:#FBE3DD;--t-yellow:#FCEFC8;--t-mizu:#E2EFF6;--t-green:#E3F0DA;--t-lilac:#ECE5F6;
 --k-spot:#B9DAA5;--k-meal:#F2A497;--k-hotel:#A8D3E6;--k-move:#F6D27A;--k-other:#cdbde6;--bw:1.5px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
html{background:var(--bg);scroll-padding-top:110px}
body{color:var(--ink);font:15px/1.55 "Huninn","Noto Sans TC",system-ui,sans-serif;overflow-x:clip;min-height:100vh;background:var(--bg);-webkit-tap-highlight-color:transparent}
b,strong,h1,h2,h3{font-weight:700}
.num{font-variant-numeric:tabular-nums}
header{position:fixed;top:0;left:0;right:0;z-index:500;padding:calc(6px + env(safe-area-inset-top)) 12px 4px;background:rgba(255,252,246,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hrow{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:6px}
.logo{flex:none;width:34px;height:34px;border-radius:10px;background:var(--ink);display:grid;place-items:center;color:#fff}
.logo svg{width:18px;height:18px}
.tripbtn{flex:1;justify-content:flex-start!important;background:none!important;border:0!important;padding:2px 4px!important;text-align:left;color:var(--ink)!important;min-height:36px!important}
.tripbtn b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.tripbtn small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;color:var(--mute);letter-spacing:.12em}
.hbtn{flex:none;width:36px;min-height:36px!important;padding:0!important;border-radius:10px!important}
.tabs{max-width:640px;margin:4px auto 0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.tabs button{flex-direction:column;gap:0;min-height:44px;padding:3px 0;border-radius:10px;font-size:11px;background:none;border:0;color:var(--mute);white-space:nowrap}
.tabs button svg{width:18px;height:18px}
.tabs button.on{background:var(--ink);color:#fff}
.tabs button.sos{color:#c4503b}.tabs button.sos.on{background:#c4503b;color:#fff}
.wrap{max-width:640px;margin:0 auto;padding:calc(104px + env(safe-area-inset-top)) 12px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 0 rgba(62,58,57,.03)}
h1{font-size:28px;line-height:1.2;margin:4px 0 2px;white-space:nowrap;overflow:hidden;letter-spacing:.01em}
h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h2 .r{margin-left:auto;font-size:12px;color:var(--mute);font-weight:400}
.dot{width:26px;height:26px;border-radius:8px;background:var(--t-yellow);color:var(--ink);display:grid;place-items:center;flex:none}
.dot svg{width:15px;height:15px}
.sec{display:flex;align-items:center;gap:6px;font-size:16px;margin:18px 2px 8px;color:var(--ink)}
.sec svg{color:#c4503b}
.pagehead{margin:2px 2px 10px}.pagehead h1{font-size:22px}
.mute{color:var(--mute);font-size:13px}.small{font-size:12.5px;color:var(--mute)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.chip{font-size:12px;padding:1px 9px;border-radius:99px;background:var(--tint);white-space:nowrap;color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--t-mizu);color:var(--ink)}
.badge svg{width:14px;height:14px}
.hero{padding:0;overflow:hidden}
.sc{position:relative;background:var(--mizu);border-bottom:1px solid var(--line)}
.scene{display:block;width:100%;height:auto;aspect-ratio:16/9}
.float{position:absolute;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.94);border-radius:12px;padding:5px 10px;font-size:11px;line-height:1.3;box-shadow:0 2px 8px rgba(62,58,57,.12)}
.float b{display:block;font-size:12px}
.float .fi{width:22px;height:22px;border-radius:7px;background:var(--t-yellow);display:grid;place-items:center;flex:none}
.float .fi svg{width:13px;height:13px}
.float.fa{left:8px;bottom:8px}.float.fb{right:8px;bottom:8px}.float{max-width:calc(50% - 14px)}.float>span:last-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .in{padding:10px 14px 12px}
.tagline{font-size:13px;color:var(--mute);margin:2px 0 0}
.cd{display:flex;align-items:stretch;gap:8px;margin:10px 0 4px}
.cd .cdd{flex:none;display:flex;align-items:baseline;gap:3px;background:var(--ink);color:#fff;border-radius:12px;padding:4px 12px}
.cd .cdd b{font-size:24px;line-height:1.15}.cd .cdd span{font-size:13px}
.cd .cdt{flex:1;display:flex;align-items:center;justify-content:center;gap:2px;background:var(--tint);border-radius:12px;padding:4px 8px}
.cd .cdt b{font-size:19px}.cd .cdt small{font-size:11px;color:var(--mute);margin:0 5px 0 1px}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.stat div{text-align:center;padding:6px 0;border-radius:12px;background:var(--tint)}
.stat div:first-child{background:var(--ink);color:#fff}.stat div:first-child span{color:#d8d2cc}
.stat b{display:block;font-size:18px;line-height:1.3}.stat span{font-size:12px;color:var(--mute)}
.flight{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px}
.flight .t{font-size:clamp(22px,6vw,26px);line-height:1}
.flight .c{font-size:12px;color:var(--mute);margin-top:3px}
.arc{position:relative;height:30px;text-align:center;font-size:12px;color:var(--mute)}
.arc:before{content:"";position:absolute;left:6px;right:6px;top:10px;border-top:1.5px dashed #cfc6bb}
.arc svg{position:relative;background:var(--card);color:var(--ink);width:18px;height:18px}
.fl+.fl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--t-coral);margin-bottom:6px}
.tag svg{width:14px;height:14px}
.tag.back{background:var(--t-mizu)}
ul.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--soft)}
.chk li:last-child{border:0}
.chk .hit{display:flex;gap:10px;flex:1;justify-content:flex-start;align-items:center;background:none;border:0;padding:6px 0;min-height:38px;text-align:left;font-size:15px;color:var(--ink);border-radius:0}
.chk .hit[disabled]{cursor:default}
.box{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid #b9b0a6;display:grid;place-items:center;background:#fff}
.hit.on .box{background:var(--ink);border-color:var(--ink)}
.hit.on .box:after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.hit.on .tx{color:var(--mute);text-decoration:line-through}
.bar{height:6px;border-radius:9px;background:var(--tint);overflow:hidden;margin-bottom:6px}.bar i{display:block;height:100%;background:var(--green);transition:width .4s}
.addrow{display:flex;gap:6px;margin-top:8px}.addrow input{flex:1;padding:7px 12px}.addrow button{width:40px;padding:0}
button,.btn{font:inherit;color:var(--ink);background:#fff;border:1px solid #d9d0c5;border-radius:12px;padding:7px 14px;min-height:40px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
button.pri,.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
button:active,.btn:active{transform:translateY(1px)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--mizu);outline-offset:2px}
.sm{min-height:32px!important;padding:3px 10px!important;font-size:13px!important;border-radius:10px!important}
.ib{width:32px;height:32px;min-height:32px!important;padding:0!important;border-radius:9px!important;flex:none;position:relative}
.ib svg{width:16px;height:16px}
.ib.naver,.btn.naver{color:#03a94d}
.ib .cnt{position:absolute;top:-4px;right:-4px;background:var(--coral);color:var(--ink);font-size:10px;line-height:15px;min-width:15px;border-radius:8px;padding:0 3px}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;flex-direction:row;gap:6px;padding:4px 12px;min-height:34px;border-radius:10px;line-height:1.2;font-size:13px;border-color:var(--line)}
.days button small{font-size:11.5px;color:var(--mute)}
.days button.on{background:var(--ink);border-color:var(--ink);color:#fff;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.days button.on small{color:#d8d2cc}
@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}
.bounce{animation:bounce .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes bounce{0%{transform:translateY(22px);opacity:.2}60%{transform:translateY(-6px);opacity:1}100%{transform:none}}
.mapwrap{position:sticky;top:calc(98px + env(safe-area-inset-top));z-index:20;background:var(--bg);padding:2px 0 6px}
.map{height:170px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#e9e5dc;position:relative;z-index:1}
.mapnote{position:absolute;right:8px;top:8px;z-index:500;background:rgba(255,255,255,.92);border-radius:8px;padding:1px 8px;font-size:11.5px;color:var(--mute);pointer-events:none}
.mapnote:empty{display:none}
.leaflet-control-zoom a{width:26px!important;height:26px!important;line-height:26px!important}
.pin{width:24px;height:24px;border-radius:50%;color:var(--ink);display:grid;place-items:center;font:700 12px/1 system-ui;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.leaflet-popup-content{font-family:"Huninn",sans-serif;margin:10px 12px}
.leaflet-popup-content a{color:#c4503b}
.leaflet-popup-content-wrapper{border-radius:12px}
.dayhd{display:flex;align-items:flex-start;gap:8px;margin:2px 2px 8px}
.dayhd .t{flex:1}
.dayhd b{font-size:16px;display:block;line-height:1.3}
.dayhd .small{line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wxs{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink);background:var(--t-mizu);border-radius:8px;padding:1px 8px;margin-top:3px}
.wxs svg{width:14px;height:14px}
.wx{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 10px}
.wx .city{flex:none;background:var(--t-yellow);border-radius:8px;padding:4px 8px;font-size:13px;max-width:7em;text-align:center}
.wx .ico svg{width:30px;height:30px;stroke-width:1.6}
.wx b{font-size:15px}
.wxcard{background:var(--t-mizu);border-color:transparent}
.tl{position:relative;padding-left:44px}
.tl:before{content:"";position:absolute;left:38px;top:6px;bottom:6px;border-left:1.5px dotted #d6ccc0}
.ev{position:relative;margin-bottom:6px;touch-action:pan-y}
.ev .tm{position:absolute;left:-46px;width:38px;text-align:right;top:8px;white-space:nowrap;line-height:1.15}
.ev .tm b{display:block;font-size:13px}.ev .tm small{font-size:10.5px;color:var(--mute)}
.ev .card{margin:0;padding:7px 8px 7px 14px;border-radius:12px;position:relative;overflow:hidden}
.ev .card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,var(--k-spot))}
.ev.hl .card{background:var(--pri3)}
.ev .hd{display:flex;align-items:center;gap:4px}.ev .hd b{flex:1;font-size:14.5px;line-height:1.35}
.ev .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}.ev .meta:empty{display:none}
.ev .nt{font-size:12px;color:var(--mute);line-height:1.4;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev .nt.open{-webkit-line-clamp:unset}
.ev .nt.tp{color:#b5603a;-webkit-line-clamp:1}
.geofix{min-height:26px!important;padding:1px 9px!important;font-size:11.5px!important;border-radius:8px!important;background:var(--t-coral)!important;border:0!important;color:#9a3f2e!important;gap:3px!important}
.geofix svg{width:13px;height:13px}
.mustb{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;background:var(--t-coral);color:#b94a36;margin-right:5px;vertical-align:1px}
.flag{display:inline-block;font-size:11px;padding:0 7px;border-radius:6px;margin:0}
.flag.f-warn{background:var(--t-yellow)}.flag.f-check{background:var(--t-green)}.flag.f-ok{background:var(--t-mizu)}
.ev .chip{font-size:11px;padding:0 7px;border-radius:6px}
.mv{margin:0 0 6px 2px}
.mv1{display:flex;align-items:center;gap:6px;overflow:hidden}
.mv2{display:block;margin:1px 0 0 4px;font-size:12.5px;color:var(--ink);text-decoration:none;line-height:1.4}
.mv2:before{content:"⏱ ";font-size:11px}
.mvbtn{display:inline-flex;align-items:center;gap:2px;background:none;border:0;padding:0;min-height:28px;flex:none}
.mvbtn>svg{width:12px;height:12px;color:var(--mute)}
.mv a.small{color:var(--mute);text-decoration:none}
.mv .small{white-space:nowrap;line-height:1.35;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.mode{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:0 8px 0 6px;border-radius:99px;white-space:nowrap;flex:none}
.mode svg{width:13px;height:13px}
.btnrow{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px}
.place{padding:8px 0;border-bottom:1px solid var(--soft)}
.place:last-child{border:0}
.place .top{display:flex;gap:10px;align-items:flex-start}
.place .ic{flex:none;width:32px;height:32px;border-radius:9px;background:var(--t-green);display:grid;place-items:center}
.place .ic svg{width:16px;height:16px}
.place .body{flex:1}
.place .body b{font-size:15px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.grid a{flex-direction:column;gap:2px;padding:6px 2px;border-radius:12px;font-size:11.5px;min-height:54px;border-color:var(--line)}
.grid a:nth-child(4n+1) svg{color:#d0705d}.grid a:nth-child(4n+2) svg{color:#c89a1d}.grid a:nth-child(4n+3) svg{color:#4f93b0}.grid a:nth-child(4n) svg{color:#5f9a4b}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--soft);font-size:14px}
.row:last-child{border:0}.row>span:first-child{color:var(--mute);flex:none}.row>span:last-child{text-align:right}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid #d9d0c5;border-radius:12px;padding:9px 12px;width:100%;min-width:0;max-width:100%;display:block}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-height:44px;text-align:left;font-size:15px}
input::-webkit-date-and-time-value{text-align:left}
textarea{min-height:96px;resize:vertical}
input[hidden]{display:none!important}
input::placeholder,textarea::placeholder{color:#b5aea8}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink);display:inline-block}
.conv{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.big{font-size:clamp(22px,7vw,28px);line-height:1.2}
.qr{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:8px}
.qr img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.sos a{justify-content:space-between;width:100%;margin-bottom:6px;font-size:15px}
.sos a b{font-size:17px;color:#c4503b}
.memo{white-space:pre-wrap;font-size:14px;line-height:1.75;background:var(--pri3);border-radius:12px;padding:10px 12px;margin-top:8px}
.page .dn{font-size:12px;letter-spacing:.06em;display:inline-block;background:var(--t-yellow);border-radius:6px;padding:0 8px}
.page ol{margin:6px 0 0;padding-left:20px;font-size:14px}
.empty{text-align:center;padding:20px 14px}
.member{background:var(--t-green);border-color:transparent}
.seg{display:flex;gap:8px;align-items:flex-start;text-align:left;justify-content:flex-start;width:100%;padding:8px 12px;margin-bottom:6px;line-height:1.45;font-size:13.5px}
.seg.first{background:var(--t-coral);border-color:transparent}
.seg svg{flex:none;margin-top:2px;width:16px;height:16px}
.mem{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 12px;background:#fff;border:1px solid #d9d0c5;font-size:14px;color:var(--ink);min-height:34px}
.mem.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.bal{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--soft);font-size:14px}
.bal .p{color:#3f7a3a}.bal .n{color:#c4503b}
.stepper{display:flex;align-items:center;gap:0;border:1px solid #d9d0c5;border-radius:12px;overflow:hidden;background:#fff}
.stepper button{border:0;border-radius:0;min-height:42px;width:40px;padding:0;font-size:18px}
.stepper input{border:0;border-radius:0;text-align:center;width:48px;padding:8px 0}
.pick details{border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:#fff}
.pick summary{padding:9px 12px;cursor:pointer;list-style:none;font-size:14px}
.pick summary::-webkit-details-marker{display:none}
.pick .cities{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 10px}
.pick .cities button{min-height:32px;padding:2px 10px;font-size:13px}
.pick .cities button.lib{background:var(--t-yellow);border-color:transparent}
.pick .cities button.on{background:var(--ink);color:#fff}
.shelf .swx{width:60px;border-radius:0 10px 10px 0}
.pick .ctry{font-size:12px;color:var(--mute);padding:6px 4px 0;width:100%}
/* swipe-to-delete */
.sw{position:relative;overflow:hidden}
.sw>.swc{position:relative;z-index:1;background:inherit;transition:transform .2s ease;will-change:transform}
.sw.drag>.swc{transition:none}
.sw>.swx{position:absolute;right:0;top:0;bottom:0;width:76px;border:0;border-radius:0;background:#d9705c;color:#fff;font-size:14px;min-height:0}
.chk li.sw{display:block}.chk li.sw>.swc{background:#fff;display:flex}
.tripitem{margin-bottom:6px;border-radius:14px}
.tripitem>.swc{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;border-radius:14px;background:#fff;border:1px solid var(--line);padding:9px 12px;gap:8px}
.tripitem.cur>.swc{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px;padding:10px 4px 14px;border-bottom:6px solid #d9c9b4;margin-bottom:12px}
.bk{position:relative;width:100%;aspect-ratio:360/447;padding:0;border:0;background:url(book.webp) center/100% 100% no-repeat;min-height:0;display:block;filter:drop-shadow(0 4px 6px rgba(62,58,57,.18))}
.bkt{position:absolute;left:19%;right:9%;top:9%;bottom:20%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;color:#5b3a22;line-height:1.25}
.bkt b{font-size:clamp(13px,3.8vw,16px);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.bkt i{display:block;width:40%;border-top:1px solid rgba(91,58,34,.35)}
.bkt small{font-size:10px;opacity:.75;font-style:normal}
.shelf .sw{background:transparent}.shelf .sw>.swc{background:transparent}
.drop{position:fixed;left:0;right:0;bottom:0;z-index:800;display:none;gap:6px;overflow-x:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(62,58,57,.94)}
.drop.on{display:flex}
.drop span{flex:none;color:#fff;font-size:12px;align-self:center;margin-right:4px}
.drop div{flex:none;color:#fff;border:1px dashed rgba(255,255,255,.5);border-radius:10px;padding:6px 12px;font-size:13px}
.drop div.hov{background:var(--yellow);color:var(--ink);border-style:solid}
.ghost{position:fixed;z-index:850;pointer-events:none;opacity:.92;transform:rotate(1.5deg);box-shadow:0 10px 24px rgba(62,58,57,.28);border-radius:12px}
.ev.dragsrc{opacity:.3}
.dragging .mv{display:none}
.dragging{-webkit-user-select:none;user-select:none}
.ev .card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ph{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
.ph figure{margin:0;position:relative}
.ph img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.ph button{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.92)}
.bkph{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:6px 0 8px}
.bkph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.bkph .small{grid-column:1/-1}
.page ol li{margin-bottom:3px}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ftile{position:relative;flex-direction:column;gap:2px;padding:8px 2px 6px;min-height:68px;font-size:11.5px;border-color:var(--line);text-align:center;line-height:1.25}
.ftile.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ftile.off{color:var(--mute);background:var(--tint);border-color:transparent}
.ficon svg{width:26px;height:26px;stroke:currentColor;display:block}
.place .ic.ficon svg{width:22px;height:22px}
.ftile .fn{position:absolute;top:3px;right:4px;font-size:10px;line-height:15px;min-width:15px;border-radius:8px;background:var(--t-yellow);color:var(--ink);padding:0 3px}
.ftile .fn.low{background:var(--t-coral)}
.ftile.on .fn{background:#fff}
.fno{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:50%;background:var(--t-yellow);font-size:11px;margin-right:5px;vertical-align:1px}
.frow{cursor:pointer}
.frbtn{display:flex;gap:5px;margin-top:6px;padding-left:42px}
.frbtn>*{flex:1 1 0;min-width:0;min-height:32px!important;padding:2px 4px!important;font-size:12px!important;border-radius:9px!important;gap:3px!important;white-space:nowrap}
.frbtn>*[data-fedit]{flex:0 0 32px}
.frbtn svg{width:14px;height:14px}
.ended{text-align:center;padding:26px 16px}
.edit{display:none!important}body.editing .edit{display:inline-flex!important}
.editb{display:none!important}body.editing .editb{display:flex!important}
.acts2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.acts2>*{flex:1}
#sheet{position:fixed;inset:0;z-index:900;display:none;align-items:flex-end;justify-content:center;background:rgba(62,58,57,.35)}
#sheet.open{display:flex}
#sheet .pane{width:min(640px,100%);max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));background:var(--bg);animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.f{display:block;margin-bottom:10px;min-width:0}.f>span{display:block;font-size:12.5px;color:var(--mute);margin-bottom:3px}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.fchk{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:40px}
.warn{color:#c4503b;font-size:12.5px;margin:-4px 0 10px}
.note2{font-size:12.5px;color:var(--mute);margin:-4px 0 10px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:950;background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;display:none;max-width:90vw;text-align:center}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.view{display:none}.view.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.scene .drift{animation:drift 14s ease-in-out infinite alternate}
.scene .drift2{animation:drift 20s ease-in-out infinite alternate-reverse}
.scene .fly{animation:fly 16s linear infinite}
.scene .ride{animation:ride 10s linear infinite}
.scene .bob{animation:bob 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.scene .wave{animation:wave 4s ease-in-out infinite alternate}
.scene .sway{animation:sway 3.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.scene .glow{animation:glow 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.scene .swing{animation:swing 9s ease-in-out infinite alternate}
.scene .fall{animation:fall 7s linear infinite}
.scene .steam{animation:steam 3s ease-in-out infinite}
.scene .float2{animation:bob 2.6s ease-in-out infinite alternate}
.scene .petal{animation:petal 8s linear infinite;transform-box:fill-box;transform-origin:center}
.scene .flagw{animation:flagw 2.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 50%}
.scene .lant{animation:lant 2.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
.scene .twk{animation:twk 3s ease-in-out infinite alternate}
.scene .bird{animation:bird 18s linear infinite}
.scene .branch{animation:sway 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 0}
@keyframes drift{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
@keyframes fly{from{transform:translate(-80px,30px)}to{transform:translate(460px,-30px)}}
@keyframes ride{from{transform:translateX(-240px)}to{transform:translateX(440px)}}
@keyframes bob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(5px) rotate(2deg)}}
@keyframes wave{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.1)}}
@keyframes swing{from{transform:translate(0,0)}to{transform:translate(170px,-52px)}}
@keyframes fall{from{transform:translate(0,-20px) rotate(0)}to{transform:translate(-40px,240px) rotate(300deg)}}
@keyframes steam{0%{transform:translateY(0);opacity:0}40%{opacity:.8}100%{transform:translateY(-16px);opacity:0}}
@keyframes petal{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:1}100%{transform:translate(150px,230px) rotate(540deg);opacity:0}}
@keyframes flagw{0%{transform:skewY(-5deg) scaleX(.96)}100%{transform:skewY(4deg) scaleX(1.02)}}
@keyframes lant{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes twk{from{opacity:.35}to{opacity:1}}
@keyframes bird{from{transform:translate(-60px,0)}to{transform:translate(460px,-40px)}}
@media(prefers-reduced-motion:reduce){body:not(.motion) *,body:not(.motion) *:before,body:not(.motion) *:after{animation:none!important;transition:none!important}}
@media(max-width:380px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.cd .cdt b{font-size:17px}.shelf{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

/* ---------- weather (Open-Meteo) ---------- */
const WX={};
const wxInfo=c=>c==null?null:c===0?["晴","w-sun"]:c<=2?["晴時多雲","w-part"]:c===3?["陰天","w-cloud"]:c<=48?["霧","w-fog"]:c<=57?["毛毛雨","w-rain"]:c<=67?["下雨","w-rain"]:c<=77?["下雪","w-snow"]:c<=82?["陣雨","w-rain"]:c<=86?["陣雪","w-snow"]:["雷雨","w-storm"];
function centerOf(t){if(t.center)return t.center;const k=t.lib||libKeyOf(t.dest);if(k&&CENTER[k])return CENTER[k];const it=t.days.flatMap(d=>d.items).find(i=>i.lat!=null);return it?[it.lat,it.lng]:null}
async function loadWeather(t){const c=centerOf(t);if(!c){geocodeCenter(t);return}const key=curId+t.start;if(WX[key]&&Date.now()-WX[key].ts<3*36e5)return;
 const last=addDays(todayTW(),15),s=t.start>todayTW()?t.start:todayTW(),e=t.end<last?t.end:last;if(s>e){WX[key]={ts:Date.now(),days:{}};return}
 try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c[0]}&longitude=${c[1]}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${s}&end_date=${e}`);
  const j=await r.json();const days={};(j.daily?.time||[]).forEach((d,i)=>days[d]={c:j.daily.weather_code[i],hi:j.daily.temperature_2m_max[i],lo:j.daily.temperature_2m_min[i],p:j.daily.precipitation_probability_max[i]});
  WX[key]={ts:Date.now(),days};document.querySelectorAll("[data-wx]").forEach(el=>el.outerHTML=weatherCard(t,+el.dataset.wx));document.querySelectorAll("[data-wxs]").forEach(el=>el.outerHTML=wxSmall(t,+el.dataset.wxs))}catch(e){}}
function wxSmall(t,di){const ds=addDays(t.start,di),w=WX[curId+t.start]?.days?.[ds],inf=w&&wxInfo(w.c),m=t.days[di]?.weather;
 return inf?`<span class="wxs num" data-wxs="${di}">${ic(inf[1])}${inf[0]} ${Math.round(w.lo)}°/${Math.round(w.hi)}°・雨 ${w.p??"-"}%</span>`:m?`<span class="wxs" data-wxs="${di}">${ic("w-part")}${esc(m)}</span>`:`<span data-wxs="${di}"></span>`}
function weatherCard(t,di){const ds=addDays(t.start,di),w=WX[curId+t.start]?.days?.[ds],inf=w&&wxInfo(w.c),manual=t.days[di]?.weather;
 const city=esc((t.dest||"").replace(/^(日本|韓國|台灣|泰國|中國)/,"").slice(0,5)||"當地");
 const body=inf?`<div class="wx"><span class="city">${city}</span><span class="ico">${ic(inf[1])}</span><span><b>${inf[0]}　<span class="num">${Math.round(w.lo)}° / ${Math.round(w.hi)}°</span></b><br><span class="small">降雨機率 ${w.p??"-"}%</span></span></div>`
  :`<div class="wx"><span class="city">${city}</span><span class="ico">${ic("w-part")}</span><span>${manual?`<b>${esc(manual)}</b><br>`:""}<span class="small">出發前 16 天內會自動顯示天氣預報</span></span></div>`;
 return `<div class="card wxcard" data-wx="${di}"><h2 style="color:#c9543f;font-size:15px;margin-bottom:8px">天氣・${md(ds)}（${wk(ds)}）</h2>${body}</div>`}

function routeSegs(t,di){const its=t.days[di].items.filter(i=>i.kind!=="move"||i.name);const stops=its.map(i=>({name:i.name,q:gq(t,i)}));const segs=[];
 if(stops.length<2)return segs;for(let i=0;i<stops.length-1;i+=4)segs.push(stops.slice(i,i+5));return segs}
function routeUrl(t,seg){const mode=/自駕|機車/.test(t.meta?.facts?.map(f=>f.value).join("")||"")||t.days.some(d=>d.items.some(i=>i.mode==="自駕"))?"driving":"transit";
 const o=seg[0].q,dst=seg[seg.length-1].q,w=seg.slice(1,-1).map(s=>s.q).join("|");return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(o)}&destination=${encodeURIComponent(dst)}${w?`&waypoints=${encodeURIComponent(w)}`:""}&travelmode=${mode}`}
function routeCard(t,di){const segs=routeSegs(t,di);if(!segs.length)return"";
 return `<div class="card"><h2>${dot("i-route")}這天的整條路線</h2>${segs.map((s,i)=>`<a class="btn seg ${i===0?"first":""}" href="${routeUrl(t,s)}" target="_blank" rel="noopener">${ic("i-nav")}<span><b>第 ${i+1} 段・${esc(s[0].name)} 出發</b><br>${s.slice(1).map(x=>esc(x.name)).join(" → ")}</span></a>`).join("")}

/* ---------- timeline ---------- */
function modeTag(m,txt){const[icn,bg,fg]=MODES[m]||["m-walk","#eee","#555"];return `<span class="mode" style="background:${bg};color:${fg}">${ic(icn)}${esc(m)}${txt?` ${esc(txt)}`:""}</span>`}
const LEG=LS.get("leg2",{});
const LEGKIND=m=>/自駕|計程車|租車|汽車/.test(m)?"car":/機車|摩托車/.test(m)?"moto":/步行|走路/.test(m)?"foot":/腳踏車|單車/.test(m)?"bike":/飛機|船|渡輪|纜車/.test(m)?"far":m?"transit":"";
const LEGPICK=[["汽車","m-car"],["摩托車","m-scooter"],["火車","m-train"],["捷運","m-train"],["高鐵","m-fast"],["走路","m-walk"],["腳踏車","m-bike"]],LEGMORE=["巴士","計程車","租車","船","纜車","飛機"];
const legKey=(m,a,b)=>`${m}|${a.lat.toFixed(4)},${a.lng.toFixed(4)}|${b.lat.toFixed(4)},${b.lng.toFixed(4)}`;
function legText(m,v){if(!v)return"計算中…";const k=LEGKIND(m),t=v.min>=60?`${Math.floor(v.min/60)} 小時${v.min%60?` ${v.min%60} 分`:""}`:`${v.min} 分`;
 const f=n=>n>=60?`${Math.floor(n/60)} 小時${n%60?` ${n%60} 分`:""}`:`${n} 分`;
 return k==="transit"?(v.wo?`很近，走路約 ${f(v.min)}`:v.ride!=null?`${/高鐵|新幹線/.test(m)?"":`${v.st} 站・`}搭 ${f(v.ride)}＋下車走路 ${f(v.walk)} ≈ ${f(v.min)}`:`約 ${v.st} 站・${t}（含走路）`):k==="foot"?`走路約 ${t}・${v.km} km`:k==="far"?`距離約 ${v.km} km`:`約 ${t}・${v.km} km`}
function legRow(t,a,b,di,j){const m=b.mode;if(!m&&!b.move&&!canEdit)return"";const has=a.lat!=null&&b.lat!=null&&m;const key=has?legKey(m,a,b):"";
 const tm=LEGKIND(m)==="car"||LEGKIND(m)==="moto"?"driving":LEGKIND(m)==="foot"?"walking":LEGKIND(m)==="bike"?"bicycling":"transit";
 const href=`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(gq(t,a))}&destination=${encodeURIComponent(gq(t,b))}&travelmode=${tm}`;
 const tag=m?modeTag(m,""):`<span class="mode" style="background:var(--tint);color:var(--mute)">＋ 交通方式</span>`;
 const pend=m&&!has&&(needGeo(a)||needGeo(b)),line2=!m?"":has?legText(m,LEG[key]):pend?"定位中，稍後算出時間…":"有一站找不到位置，點這裡用 Google 地圖看時間";
 return `<div class="mv"><div class="mv1">${canEdit&&di!=null?`<button class="mvbtn" data-act="legMode" data-d="${di}" data-j="${j}" aria-label="選擇交通方式">${tag}${ic("i-down")}</button>`:tag}<span class="small">${esc(a.name)} → ${esc(b.name)}</span></div>${m||b.move?`<a class="mv2" href="${href}" target="_blank" rel="noopener"><span ${has&&!LEG[key]?`data-leg="${esc(key)}"`:""}>${line2}</span>${b.move?`${line2?"・":""}${esc(b.move)}`:""}</a>`:""}</div>`}
const hav=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dg=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
async function osrm(p,a,b){const r=await fetch(`https://routing.openstreetmap.de/routed-${p}/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=false`);const j=await r.json();const x=j.routes?.[0];return x?{min:Math.max(1,Math.round(x.duration/60)),km:+(x.distance/1000).toFixed(1)}:null}
let legBusy=false;
async function computeLegs(){if(legBusy)return;legBusy=true;
 try{let el;while((el=document.querySelector("[data-leg]"))){const key=el.dataset.leg;const[m,pa,pb]=key.split("|");const a=pa.split(",").map(Number),b=pb.split(",").map(Number),k=LEGKIND(m),d=hav(a,b);let v=null;
   if(!LEG[key]){if(k==="car"||k==="moto"||k==="foot"||k==="bike"){try{v=await osrm(k==="foot"?"foot":k==="bike"?"bike":"car",a,b)}catch(e){}
     if(!v){const sp={car:32,moto:28,foot:4.5,bike:13}[k];const km=d*1.35;v={min:Math.max(1,Math.round(km/sp*60)),km:+km.toFixed(1),est:1}}
     else if(k==="moto")v.min=Math.round(v.min*1.1)}
    else{const km=d*1.25;const hsr=/高鐵|新幹線/.test(m),[spc,sp]=/巴士|公車|客運/.test(m)?[.5,18]:hsr?[45,190]:/電車|JR|火車|台鐵/.test(m)?[2.5,40]:[1.1,30];
     const ride=Math.max(3,Math.round(km/sp*60)),walk=hsr?15:Math.round(Math.min(14,6+km*.4)),wait=/巴士|公車|客運/.test(m)?6:hsr?10:4;

let FX=LS.get("fx",null);
async function ensureRate(t){const c=t.cur;if(!c||!c.code||c.code==="TWD")return;if(FX&&Date.now()-FX.ts<12*36e5&&FX.rates[c.code])return applyFx(t);
 try{const r=await fetch("https://open.er-api.com/v6/latest/TWD");const j=await r.json();if(j.rates){FX={ts:Date.now(),rates:j.rates,date:j.time_last_update_utc};LS.set("fx",FX);applyFx(t)}}catch(e){}}
function applyFx(t){const u=FX?.rates?.[t.cur.code];if(!u)return;const live=1/u;if(Math.abs((t._live||0)-live)>1e-9){t._live=live;if(view==="tool")renderTool(t)}}
const rateOf=t=>t.cur.code==="TWD"?1:(LS.get(curId+":rate",null)??t._live??t.cur.rate);
function balances(t){const r=rateOf(t),bal={};t.members.forEach(m=>bal[m.id]=0);
 t.expenses.forEach(e=>{const amt=+e.amount||0,local=e.cur==="T"?amt/r:amt;const f=(e.for&&e.for.length?e.for:t.members.map(m=>m.id)).filter(id=>id in bal);if(!(e.who in bal)||!f.length)return;bal[e.who]+=local;f.forEach(id=>bal[id]-=local/f.length)});return bal}
function settle(bal){const pos=Object.entries(bal).filter(([,v])=>v>0.5).sort((a,b)=>b[1]-a[1]).map(x=>[...x]),neg=Object.entries(bal).filter(([,v])=>v<-0.5).sort((a,b)=>a[1]-b[1]).map(x=>[...x]),out=[];
 while(pos.length&&neg.length){const p=pos[0],n=neg[0],x=Math.min(p[1],-n[1]);out.push([n[0],p[0],x]);p[1]-=x;n[1]+=x;if(p[1]<0.5)pos.shift();if(n[1]>-0.5)neg.shift()}return out}
function renderTool(t){const c=t.cur,dom=c.code==="TWD",r=rateOf(t),name=id=>t.members.find(m=>m.id===id)?.name||"?";

{let P=null;const LP=420;

 function start(e){if(!canEdit||view!=="plan")return;const card=e.target.closest("#dayBody .tl .ev .card");if(!card||e.target.closest("a,button"))return;if(e.button>0)return;
  const p=pt(e);P={ev:card.parentElement,x:p.clientX,y:p.clientY,on:false};P.tm=setTimeout(()=>begin(p),LP)}

  document.body.classList.add("dragging");const g=ev.querySelector(".card").cloneNode(true);g.classList.add("ghost");g.style.width=r.width+"px";g.style.left=r.left+"px";g.style.top=r.top+"px";document.body.appendChild(g);
  P.g=g;P.ox=P.x-r.left;P.oy=P.y-r.top;ev.classList.add("dragsrc");
  const t=T();let bar=$("#dropBar");if(!bar){bar=document.createElement("div");bar.id="dropBar";bar.className="drop";document.body.appendChild(bar)}
  bar.innerHTML=`<span>換到</span>`+t.days.map((d,i)=>i===dayIdx?"":`<div data-dd="${i}">D${i+1} ${md(addDays(t.start,i))}</div>`).join("");bar.classList.add("on")}
 function move(e){if(!P)return;const p=pt(e);if(!P.on){if(Math.hypot(p.clientX-P.x,p.clientY-P.y)>8){clearTimeout(P.tm);P=null}return}
  e.preventDefault();P.g.style.left=(p.clientX-P.ox)+"px";P.g.style.top=(p.clientY-P.oy)+"px";
  const bar=$("#dropBar");bar.querySelectorAll("[data-dd]").forEach(x=>x.classList.remove("hov"));const under=document.elementFromPoint(p.clientX,p.clientY);P.day=null;
  const dd=under?.closest?.("[data-dd]");if(dd){dd.classList.add("hov");P.day=+dd.dataset.dd;return}
  const tl=P.ev.parentElement;const evs=[...tl.querySelectorAll(":scope>.ev")].filter(x=>x!==P.ev);
  let placed=false;for(const x of evs){const r=x.getBoundingClientRect();if(p.clientY<r.top+r.height/2){tl.insertBefore(P.ev,x);placed=true;break}}if(!placed&&evs.length)tl.insertBefore(P.ev,evs[evs.length-1].nextSibling);

 function end(){if(!P)return;clearTimeout(P.tm);if(!P.on){P=null;return}

  const id=ev.dataset.id,order=[...ev.parentElement.querySelectorAll(":scope>.ev")].map(x=>x.dataset.id);P=null;
  mut(t=>{const items=t.days[dayIdx].items;if(day!=null){const k=items.findIndex(i=>i.id===id);const[x]=items.splice(k,1);t.days[day].items.push(x);t.days[day].items.sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));toast(`已移到 Day ${day+1}`);return}
   const slots=items.map(i=>[i.time,i.end]);const next=order.map(o=>items.find(i=>i.id===o)).filter(Boolean);
   if(next.map(i=>i.id).join()===items.map(i=>i.id).join())return;
