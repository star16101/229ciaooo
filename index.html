:root{
  /* 新擬物：同色系淺灰底，靠一亮一暗兩道陰影做出凸起和凹陷，金黃色當重點 */
  --bg:#ECEDF1; --ink:#3A3D45; --muted:#8E929C; --faint:#B4B8C1;
  --hi:#FFFFFF; --lo:#C9CCD4; --gold:#F5B53D; --gold2:#FFD66E; --orange:#F39A3B;
  --raise:9px 9px 18px var(--lo),-9px -9px 18px var(--hi);
  --raise-s:5px 5px 10px var(--lo),-5px -5px 10px var(--hi);
  --press:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi);
  --latin:"Quicksand","Noto Sans TC",sans-serif;
  --body:"Noto Sans TC","PingFang TC",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:300 14px/1.8 var(--body);letter-spacing:.03em;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:440px;margin:0 auto;padding:22px 22px 48px;display:flex;flex-direction:column;gap:26px}
.top{display:flex;justify-content:space-between;align-items:flex-start;font:400 11px/1.5 var(--latin);color:var(--muted);letter-spacing:.06em}
.top i{display:block;width:12px;height:2px;background:var(--gold);border-radius:2px;margin-top:6px}
.top b{font:400 22px var(--latin);color:var(--faint);border-bottom:1px solid var(--faint);line-height:1.2}

/* 個人卡 */
.me{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:26px 18px 24px;border-radius:30px;box-shadow:var(--raise)}
.ring{position:relative;width:132px;height:132px;border-radius:50%;box-shadow:var(--raise);display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring img{width:96px;height:96px;border-radius:50%;object-fit:cover;box-shadow:var(--press);padding:4px;background:var(--bg)}
.ring .dot{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#FCE7B8);box-shadow:2px 2px 5px var(--lo);top:14px;right:16px}
.name{font:500 26px/1.2 'Latte',var(--body);letter-spacing:.12em;margin:0}
.name small{display:block;font:400 12px var(--latin);letter-spacing:.3em;color:var(--muted);margin-top:4px}
.role{font-size:12.5px;color:var(--ink);letter-spacing:.08em}
.bio{color:var(--muted);font-size:13px;line-height:2;margin:0}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chips span{font-size:12px;padding:6px 14px;border-radius:99px;box-shadow:var(--raise-s);color:var(--ink)}
.chips span:first-child{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#5A3B00;box-shadow:4px 4px 10px #E8C58A,-4px -4px 10px var(--hi)}

/* 區塊標題 */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:4px 6px -10px}
.sec h2{font:500 15px 'Latte',var(--body);letter-spacing:.14em;margin:0}
.sec span{font:400 11px var(--latin);color:var(--faint);letter-spacing:.12em}

/* 連結卡 */
.links{display:flex;flex-direction:column;gap:16px}
.card{display:grid;grid-template-columns:52px 1fr 20px;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;box-shadow:var(--raise);color:inherit;text-decoration:none;transition:box-shadow .2s,transform .2s}
.card:active,.card:focus-visible{box-shadow:var(--press);outline:none}
.ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;box-shadow:var(--press)}
.ico svg{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card.hot .ico{background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:4px 4px 10px #E8C58A,-4px -4px 10px var(--hi)}
.card.hot .ico svg{stroke:#fff}
.t{font-size:14.5px;font-weight:500;line-height:1.5;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.t em{font:500 10px var(--latin);font-style:normal;color:var(--orange);letter-spacing:.1em;padding:1px 8px;border-radius:99px;box-shadow:var(--press)}
.s{font-size:12px;color:var(--muted);line-height:1.6}
.arr{width:20px;height:20px;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round}

/* 作品格 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{border-radius:22px;box-shadow:var(--raise);padding:16px 14px;display:flex;flex-direction:column;gap:10px;color:inherit;text-decoration:none;min-height:132px}
.tile:active{box-shadow:var(--press)}
.tile .ico{width:42px;height:42px;border-radius:14px}
.tile .ico svg{width:20px;height:20px}
.tile b{font-weight:500;font-size:13.5px;line-height:1.5}
.tile small{font-size:11.5px;color:var(--muted);line-height:1.6}
.tile.soon{grid-column:1/-1;min-height:96px;box-shadow:var(--press);justify-content:center;align-items:center;text-align:center;color:var(--faint)}

.quote{display:flex;gap:14px;align-items:center;padding:18px;border-radius:22px;box-shadow:var(--raise)}
.quote q{font:600 40px/0.6 var(--latin);color:var(--gold);quotes:"“" "";}
.quote p{margin:0;font-size:13px;color:var(--muted);line-height:1.9}
footer{text-align:center;font:400 11px var(--latin);color:var(--faint);letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.live{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.live span{padding:5px 12px;border-radius:99px;box-shadow:var(--press);display:inline-flex;align-items:center;gap:6px}
.live b{font:600 12px var(--latin);color:var(--ink)}
.live i{width:7px;height:7px;border-radius:50%;background:#4CC38A;box-shadow:0 0 0 3px rgba(76,195,138,.18);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(76,195,138,0)}}
.live[hidden]{display:none}
.bio{color:var(--muted);font-size:13px;line-height:2;margin:0}
.bio b.em{color:var(--ink);font-weight:700}
.intro{display:flex;flex-direction:column;gap:10px;width:100%}
.intro p{margin:0}
.lead1{font-size:13.5px;color:var(--ink);letter-spacing:.1em;font-weight:500}
.pt{font-size:13px;color:var(--ink);line-height:1.7}
.pt small{display:block;font-size:11.5px;color:var(--muted)}
.exp{width:100%;text-align:left;border-radius:20px;box-shadow:var(--press);padding:14px 18px}
.exp h3{margin:0 0 6px;font:500 13px 'Latte',var(--body);letter-spacing:.2em;color:var(--orange)}
.exp ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
